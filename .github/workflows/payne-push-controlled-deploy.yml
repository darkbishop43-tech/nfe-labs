name: Deploy PAYNE Push Only - Controlled Isolated
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payne-push-only-deployment
  cancel-in-progress: false
jobs:
  isolated-deploy:
    runs-on: ubuntu-latest
    environment: payne-push-only
    defaults:
      run:
        working-directory: market-edge-lab/real/payne-kalshi-real/push-worker
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify existing Cloudflare and dedicated PAYNE secret presence
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYNE_PUBLIC: ${{ secrets.PAYNE_PUSH_VAPID_PUBLIC_KEY }}
          PAYNE_PRIVATE: ${{ secrets.PAYNE_PUSH_VAPID_PRIVATE_KEY }}
          PAYNE_ENROLL: ${{ secrets.PAYNE_PUSH_ENROLL_TOKEN }}
        run: |
          set -euo pipefail
          for key in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID PAYNE_PUBLIC PAYNE_PRIVATE PAYNE_ENROLL; do
            test -n "${!key:-}" || { echo "BLOCKED: required secret absent: $key"; exit 1; }
          done
          echo 'DEDICATED_SECRET_NAMES_PRESENT'
      - name: Validate no trading bindings, no cron and no dispatch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name = "market-edge-payne-real-push"' wrangler.toml
          grep -q 'crons = \[\]' wrangler.toml
          grep -q "PAYNE_PUSH_DISPATCH_ENABLED!=='TRUE'" src/index.js
          if grep -E 'KALSHI_API|PAYNE_KALSHI_STATE|BASELINE_REAL_SHADOW_STATE|\[\[services\]\]' wrangler.toml; then exit 1; fi
          npm install --ignore-scripts --no-audit --no-fund
          npm test
          npx wrangler deploy --dry-run --outdir /tmp/payne-push-only
      - name: Verify target name not already in account before any write
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" > /tmp/payne-worker-list.json
          jq -e '.success == true' /tmp/payne-worker-list.json > /dev/null
          if jq -e 'any(.result[]?; .id == "market-edge-payne-real-push")' /tmp/payne-worker-list.json >/dev/null; then
            echo 'BLOCKED: TARGET_WORKER_ALREADY_EXISTS'; exit 1
          fi
          echo 'UNIQUE_TARGET_CONFIRMED'
      - name: Deploy only standalone notification-inactive Worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --name market-edge-payne-real-push
      - name: Provision only dedicated PAYNE notification Worker secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYNE_PUBLIC: ${{ secrets.PAYNE_PUSH_VAPID_PUBLIC_KEY }}
          PAYNE_PRIVATE: ${{ secrets.PAYNE_PUSH_VAPID_PRIVATE_KEY }}
          PAYNE_ENROLL: ${{ secrets.PAYNE_PUSH_ENROLL_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$PAYNE_PUBLIC" | npx wrangler secret put NFE_PUSH_VAPID_PUBLIC_KEY --name market-edge-payne-real-push >/dev/null
          printf '%s' "$PAYNE_PRIVATE" | npx wrangler secret put NFE_PUSH_VAPID_PRIVATE_KEY --name market-edge-payne-real-push >/dev/null
          printf '%s' "$PAYNE_ENROLL" | npx wrangler secret put PAYNE_ENROLL_TOKEN --name market-edge-payne-real-push >/dev/null
          echo 'PAYNE_ONLY_SECRETS_PROVISIONED'
      - name: Verify notification endpoint and disabled scheduler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            https://market-edge-payne-real-push.darkbishop43.workers.dev/push-config > /tmp/payne-push-config.json
          jq -e '.publicKey | type == "string" and length > 0' /tmp/payne-push-config.json > /dev/null
          echo 'PUSH_ONLY_ENDPOINT_RESPONDS_SCHEDULED_DELIVERY_DISABLED'
