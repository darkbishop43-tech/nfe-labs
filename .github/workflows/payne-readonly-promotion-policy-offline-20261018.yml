name: PAYNE Readonly Promotion Workflow Policy Offline
# Read-only checks of the isolated Founder-approved legacy deployment recovery policy.
# Includes absence/explicit-true/explicit-null legacy provider-post fixtures.
on:
  push:
    branches: [payne-readonly-promotion-workflow-isolated-20261018]
    paths: [".github/workflows/payne-readonly-promotion-policy-offline-20261018.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate isolated promotion policy and protected source
        shell: bash
        run: |
          set -euo pipefail
          assembly=693a9440f403e26bed7e0bc64decaeb702cad8bc
          base=ad1f88bbdaa79587bc95074689270b7640c65027
          target=.github/workflows/payne-disarm-accountability-v1-production.yml
          git merge-base --is-ancestor "$base" "$assembly"
          git merge-base --is-ancestor "$assembly" HEAD
          git diff --name-only "$assembly" HEAD | sort > /tmp/changed
          printf '%s\n' ".github/workflows/payne-disarm-accountability-v1-production.yml" ".github/workflows/payne-readonly-promotion-policy-offline-20261018.yml" ".github/scripts/payne-kv-deployment-safety-maintenance.sh" ".github/workflows/payne-live-readiness-get-only-20261018.yml" ".github/workflows/payne-provider-post-inventory-readonly-20261018.yml" ".github/scripts/payne-empty-series-readonly-verifier.mjs" "market-edge-lab/real/payne-kalshi-real/test/deployment-empty-series-policy.test.mjs" "market-edge-lab/real/payne-kalshi-real/test/deployment-readonly-verifier.test.mjs" | sort > /tmp/allowed
          cmp /tmp/changed /tmp/allowed
          grep -Fq "ref: $assembly" "$target"
          grep -Fq "path: maintenance-source" "$target"
          grep -Fq 'test "$(git rev-parse HEAD)" = '$assembly "$target"
          grep -Fq 'test "$(git rev-parse HEAD:market-edge-lab/real/payne-kalshi-real/src/index.js)" = 948f00a6e9053cdcca33d4160508996d472d329d' "$target"
          grep -Fq "base=$base" "$target"
          grep -Fq 'UNAPPROVED_ASSEMBLY_DIFFERENCE' "$target"
          grep -Fq 'PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN' "$target"
          grep -Fq 'PAYNE_EXECUTION_COORDINATOR' "$target"
          grep -Fq 'payne-maintenance-decision.mjs' "$target"
          grep -Fq 'payne-kv-deployment-safety-maintenance.sh pre' "$target"
          grep -Fq 'payne-kv-deployment-safety-maintenance.sh post' "$target"
          grep -Fq 'Verify Founder still disarmed' "$target"
          grep -Fq 'Confirm current production baseline' "$target"
          grep -Fq 'Verify new Worker version has all production traffic' "$target"
          grep -Fq 'branches: [payne-direct-pull-fire-isolated-20261018]' "$target"
          ! grep -Fq 'branches: [payne-readonly-promotion-workflow-isolated-20261018]' "$target"
          test "$(git rev-parse "$assembly:market-edge-lab/real/payne-kalshi-real/src/index.js")" = 948f00a6e9053cdcca33d4160508996d472d329d
          grep -Fq 'name = "PAYNE_EXECUTION_COORDINATOR"' market-edge-lab/real/payne-kalshi-real/wrangler.toml
          git diff --quiet "$assembly" HEAD -- market-edge-lab/real/payne-kalshi-real/src market-edge-lab/real/payne-kalshi-real/wrangler.toml
          test "$(git hash-object .github/scripts/payne-kv-deployment-safety-maintenance.sh)" = 9497a5fc26c6aede92858aea8310e419d2ddc162
          test "$(git hash-object .github/scripts/payne-empty-series-readonly-verifier.mjs)" = e4c88d4685aa2bd8d60d73e5950f5716eed89fd3
          grep -Fq 'payne-empty-series-readonly-verifier.mjs' "$target"
          grep -Fq 'Generate authenticated zero-attempt deployment evidence' "$target"
          grep -Fq 'UNVERIFIED_EVIDENCE_APPROVAL' "$target"
          node --check .github/scripts/payne-empty-series-readonly-verifier.mjs
          verifier_line=$(grep -n -m1 'node maintenance-source/.github/scripts/payne-empty-series-readonly-verifier.mjs' "$target" | cut -d: -f1)
          gate_line=$(grep -n -m1 'bash maintenance-source/.github/scripts/payne-kv-deployment-safety-maintenance.sh pre' "$target" | cut -d: -f1)
          test "$verifier_line" -lt "$gate_line"
          deploy_line=$(grep -n -m1 'npx --yes wrangler@4 deploy |' "$target" | cut -d: -f1)
          test "$gate_line" -lt "$deploy_line"
          echo ISOLATED_PROMOTION_PIN_AND_ALL_EXISTING_SAFETY_GATES=PASS
      - name: Validate assembled GET-only coordinator and full original regressions
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/payne-execution-coordinator.js
          node --test test/coordinator-series-inspection.test.mjs test/coordinator-parent-authenticated-read.test.mjs
          node --test test/deployment-empty-series-policy.test.mjs test/deployment-readonly-verifier.test.mjs
          npm test
