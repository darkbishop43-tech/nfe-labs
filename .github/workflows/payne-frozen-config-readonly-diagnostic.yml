name: PAYNE Frozen Config Read Only Diagnostic
on:
  push:
    branches: [payne-direct-pull-fire-isolated-20261018]
    paths: [".github/workflows/payne-frozen-config-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing PAYNE KV and print minimal redacted comparison
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values"
          read_key() {
            local key="$1" label="$2" encoded code
            encoded="$(jq -nr --arg v "$key" '$v|@uri')"
            code="$(curl --silent --show-error --max-time 25 --output "$tmp/$label.json" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$encoded")"
            if [[ "$code" != 200 ]]; then echo "READ_FAILED_$label HTTP_$code"; exit 1; fi
            jq -e 'type=="object"' "$tmp/$label.json" >/dev/null || { echo "INVALID_KV_$label"; exit 1; }
          }
          read_key 'payne-kalshi:control:v1' control
          read_key 'payne-kalshi:real-series:v1' series
          jq -c '{seriesId,attemptsStarted,attemptTarget,status,configFrozen}' "$tmp/series.json"
          echo "READ_ONLY_DIAGNOSTIC_COMPLETE_NO_WRITES"
