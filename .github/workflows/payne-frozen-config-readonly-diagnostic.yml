name: PAYNE Frozen Config Read Only Diagnostic
on:
  push:
    branches: [payne-direct-pull-fire-isolated-20261018]
    paths: [".github/workflows/payne-frozen-config-readonly-diagnostic.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing PAYNE KV and print minimal redacted comparison
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING_TOKEN}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING_ACCOUNT}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values"
          read_key() {
            local key="$1" label="$2" encoded code
            encoded="$(jq -nr --arg v "$key" '$v|@uri')"
            code="$(curl --silent --show-error --max-time 25 --output "$tmp/$label.json" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/$encoded")"
            if [[ "$code" != 200 ]]; then echo "READ_FAILED_$label HTTP_$code"; exit 1; fi
            jq -e 'type=="object"' "$tmp/$label.json" >/dev/null || { echo "INVALID_KV_$label"; exit 1; }
          }
          read_key 'payne-kalshi:control:v1' control
          read_key 'payne-kalshi:real-series:v1' series
          jq -n --slurpfile c "$tmp/control.json" --slurpfile s "$tmp/series.json" '
            ($c[0]) as $ctl | ($s[0]) as $ser |
            {
              seriesId:$ser.seriesId,
              seriesStatus:($ser.status // null),
              configFrozen:$ser.configFrozen,
              frozenThreshold:$ser.threshold,
              currentThreshold:$ctl.activeThreshold,
              frozenAttemptTarget:$ser.attemptTarget,
              currentAttemptTarget:$ctl.attemptTarget,
              frozenMaxEntryDebitUsd:$ser.maxEntryDebitUsd,
              currentMaxEntryDebitUsd:$ctl.maxEntryDebitUsd,
              armed:$ctl.armed,
              unresolvedEntry:$ser.unresolvedEntry,
              openPositions:$ctl.openPositions,
              persistedPositionStatus:($ser.position.status // null),
              persistedPositionOwner:($ser.position.owner // null),
              fireLatchState:($ser.fireLatch.state // "NONE"),
              providerPostState:($ser.fireLatch.providerPost // "NOT_EXPOSED"),
              providerPostStarted:($ser.currentAttempt.providerPostStarted // null),
              currentAttemptStatus:($ser.currentAttempt.status // null),
              reconciliationReason:($ser.currentAttempt.reconciliationReason // null),
              exactMismatchFields:(
                [if $ser.threshold != $ctl.activeThreshold then "THRESHOLD" else empty end,
                 if $ser.attemptTarget != $ctl.attemptTarget then "ATTEMPT_TARGET" else empty end,
                 if $ser.maxEntryDebitUsd != $ctl.maxEntryDebitUsd then "MAX_ENTRY_DEBIT" else empty end]
              ),
              historicalException1:(
                $ctl.armed==false and $ser.unresolvedEntry==true and
                $ser.currentAttempt.status=="NO_PROVIDER_EXECUTION" and
                $ser.currentAttempt.reconciliationReason=="PROVIDER_RECONCILED_NO_EXECUTION" and
                $ser.currentAttempt.providerPostStarted!=true and
                ($ser.fireLatch.state//"NONE")=="PRE_PROVIDER_VALIDATION" and
                ($ser.fireLatch.providerPost//"NOT_STARTED")=="NOT_STARTED"
              ),
              historicalException2:(
                $ctl.armed==false and $ser.unresolvedEntry==false and
                ($ser.position//null)==null and
                $ser.currentAttempt.status=="NO_PROVIDER_EXECUTION" and
                $ser.currentAttempt.reconciliationReason=="PROVIDER_RECONCILED_NO_EXECUTION" and
                ($ser.fireLatch.state//"NONE")=="INVALIDATED_BEFORE_POST" and
                $ser.fireLatch.finalResult=="NO_PROVIDER_EXECUTION"
              )
            } |
            . + {configGateClassification:(
              if .configFrozen!=true then "NOT_FROZEN"
              elif (.exactMismatchFields|length)==0 then "MATCH"
              elif .historicalException1 or .historicalException2 then "FROZEN_MISMATCH_WITH_EXISTING_EXCEPTION"
              else "FROZEN_FOUNDER_CONFIG_MISMATCH" end
            )}
          ' | jq -c .
          echo "READ_ONLY_DIAGNOSTIC_COMPLETE_NO_WRITES"
