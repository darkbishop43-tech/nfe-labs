name: Kalshi Event Surface Proof

on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/kalshi-event-surface-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Compact read-only Kalshi events proof
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request, urllib.parse, time, datetime
          BASE='https://external-api.kalshi.com/trade-api/v2'
          SERIES=['KXBTC15M','KXETH15M','KXSOL15M','KXXRP15M','KXHYPE15M']
          now=time.time()

          def get(url):
              req=urllib.request.Request(url,headers={'Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  return r.status,json.load(r)

          def ts(x):
              try:return datetime.datetime.fromisoformat(str(x).replace('Z','+00:00')).timestamp()
              except:return None

          def p(m,a,b):
              v=m.get(a,m.get(b))
              if v is None:return None
              try:n=float(v)
              except:return None
              if n>1 and n<=100:n/=100
              return n if 0<=n<=1 else None

          allout=[]
          exact_candidates=[]
          for series in SERIES:
              q=urllib.parse.urlencode({'series_ticker':series,'with_nested_markets':'true','min_close_ts':int(now),'limit':200})
              hs,d=get(BASE+'/events?'+q)
              ev=d.get('events') or []
              nested=[]
              valid=[]
              nearest=[]
              for e in ev:
                  for m in (e.get('markets') or []):
                      ot,ct=ts(m.get('open_time')),ts(m.get('close_time'))
                      dur=(ct-ot) if ot is not None and ct is not None else None
                      rem=(ct-now) if ct is not None else None
                      yb,ya=p(m,'yes_bid_dollars','yes_bid'),p(m,'yes_ask_dollars','yes_ask')
                      nb,na=p(m,'no_bid_dollars','no_bid'),p(m,'no_ask_dollars','no_ask')
                      if na is None and yb is not None: na=round(1-yb,4)
                      if nb is None and ya is not None: nb=round(1-ya,4)
                      st=str(m.get('status') or '').lower()
                      row={'eventTicker':e.get('event_ticker') or e.get('ticker'),'ticker':m.get('ticker'),'status':m.get('status'),
                           'open_time':m.get('open_time'),'close_time':m.get('close_time'),
                           'minutesToClose':round(rem/60,3) if rem is not None else None,
                           'durationMinutes':round(dur/60,3) if dur is not None else None,
                           'yesBid':yb,'yesAsk':ya,'noBid':nb,'noAsk':na,'exchange_index':m.get('exchange_index')}
                      nested.append(row)
                      reasons=[]
                      if st not in ('active','open'): reasons.append('STATUS_NOT_OPEN_ACTIVE')
                      if None in (yb,ya,nb,na): reasons.append('BBO_INCOMPLETE')
                      if ya is not None and (ya<=.01 or ya>=.99): reasons.append('YES_ASK_DEGENERATE')
                      if na is not None and (na<=.01 or na>=.99): reasons.append('NO_ASK_DEGENERATE')
                      if rem is None or rem<=0: reasons.append('CLOSE_NOT_FUTURE_OR_INVALID')
                      elif rem>1200: reasons.append('CLOSE_MORE_THAN_20_MIN_AWAY')
                      if dur is None or not 600<=dur<=1200: reasons.append('DURATION_OUTSIDE_10_TO_20_MIN')
                      row['rejectReasons']=reasons
                      if not reasons and m.get('ticker'):
                          valid.append(row); exact_candidates.append((series,m.get('ticker')))
              nearest=sorted(nested,key=lambda x: (10**12 if x['minutesToClose'] is None else abs(x['minutesToClose'])))[:3]
              allout.append({'seriesTicker':series,'httpStatus':hs,'eventCount':len(ev),'nestedMarketCount':len(nested),
                             'currentValidNestedMarketCount':len(valid),'nearestNestedMarkets':nearest,'currentValidNestedMarkets':valid[:5]})

          controls=[]
          for series,ticker in exact_candidates[:10]:
              hs,d=get(BASE+'/markets/'+urllib.parse.quote(ticker,safe=''))
              m=d.get('market') or d
              controls.append({'seriesTicker':series,'ticker':ticker,'httpStatus':hs,'status':m.get('status'),
                               'open_time':m.get('open_time'),'close_time':m.get('close_time'),
                               'yes_bid_dollars':m.get('yes_bid_dollars',m.get('yes_bid')),
                               'yes_ask_dollars':m.get('yes_ask_dollars',m.get('yes_ask')),
                               'no_bid_dollars':m.get('no_bid_dollars',m.get('no_bid')),
                               'no_ask_dollars':m.get('no_ask_dollars',m.get('no_ask')),
                               'exchange_index':m.get('exchange_index')})
          print(json.dumps({'observedAtUnix':int(now),'series':allout,'exactTickerControls':controls},indent=2))
          PY
