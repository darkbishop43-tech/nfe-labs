name: Founder Coach Card Zero Money Proof

on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/add-founder-coach-card-zero-money.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
      - name: Verify original ARM isolation and Coach Card freeze model
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='market-edge-lab/real/baseline/src/index.js'
          EXPECTED_SOURCE_BLOB='7df4b0a663c8659969ce55adab495bd905a65c5f'
          ACTUAL_SOURCE_BLOB="$(git hash-object "$SOURCE")"
          echo "expectedSourceBlob=$EXPECTED_SOURCE_BLOB"
          echo "actualSourceBlob=$ACTUAL_SOURCE_BLOB"
          test "$ACTUAL_SOURCE_BLOB" = "$EXPECTED_SOURCE_BLOB"

          python - <<'PY'
          from dataclasses import dataclass, FrozenInstanceError
          from pathlib import Path

          source = Path('market-edge-lab/real/baseline/src/index.js').read_text()

          source_checks = {
              'original_arm_route': 'url.pathname === "/execution-test-arm"' in source,
              'original_disarm_route': 'url.pathname === "/execution-test-disarm"' in source,
              'original_arm_authority': 'ARM_BOUNDED_EXECUTION_TESTS_MAX_1_USD' in source,
              'original_default_stake_1': 'maxEntryDebitUsd:1' in source,
              'original_max_concurrent_3': 'maxConcurrent:3' in source,
              'original_runtime_initial': 'estimateKalshiFeeSafeSize(candidate.yes,EXECUTION_TEST_CONFIG.maxEntryDebitUsd)' in source,
              'original_runtime_final': 'estimateKalshiFeeSafeSize(finalCandidate.yes,EXECUTION_TEST_CONFIG.maxEntryDebitUsd)' in source,
          }

          SUPPORTED_THRESHOLDS = (0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85)

          @dataclass(frozen=True)
          class CoachRunConfig:
              threshold: float
              maxAttempts: int
              maxEntryDebitUsd: int
              maxConcurrent: int

          def validate(ui):
              threshold = float(ui['threshold'])
              attempts = int(ui['maxAttempts'])
              stake = int(ui['maxEntryDebitUsd'])
              concurrent = int(ui['maxConcurrent'])
              if threshold not in SUPPORTED_THRESHOLDS:
                  raise ValueError('INVALID_THRESHOLD')
              if not 1 <= attempts <= 100:
                  raise ValueError('INVALID_ATTEMPTS')
              if not 1 <= stake <= 10:
                  raise ValueError('INVALID_STAKE')
              if not 1 <= concurrent <= 10:
                  raise ValueError('INVALID_CONCURRENCY')
              return CoachRunConfig(threshold, attempts, stake, concurrent)

          fixtures = {
              'A': {'threshold':0.60,'maxAttempts':3,'maxEntryDebitUsd':1,'maxConcurrent':3},
              'B': {'threshold':0.65,'maxAttempts':5,'maxEntryDebitUsd':2,'maxConcurrent':3},
              'C': {'threshold':0.80,'maxAttempts':1,'maxEntryDebitUsd':10,'maxConcurrent':1},
              'D': {'threshold':0.70,'maxAttempts':10,'maxEntryDebitUsd':3,'maxConcurrent':5},
          }

          for name, ui in fixtures.items():
              frozen = validate(dict(ui))
              before = (frozen.threshold, frozen.maxAttempts, frozen.maxEntryDebitUsd, frozen.maxConcurrent)
              changed_ui = dict(ui)
              changed_ui.update({'threshold':0.55,'maxAttempts':99,'maxEntryDebitUsd':9,'maxConcurrent':9})
              after = (frozen.threshold, frozen.maxAttempts, frozen.maxEntryDebitUsd, frozen.maxConcurrent)
              assert before == after, f'{name}_UI_MUTATED_FROZEN_CONFIG'
              try:
                  frozen.maxAttempts = 42
                  raise AssertionError(f'{name}_FROZEN_CONFIG_MUTABLE')
              except FrozenInstanceError:
                  pass
              print(f'fixture_{name}=PASS frozen={before}')

          invalid = [
              {'threshold':0.61,'maxAttempts':3,'maxEntryDebitUsd':1,'maxConcurrent':3},
              {'threshold':0.60,'maxAttempts':0,'maxEntryDebitUsd':1,'maxConcurrent':3},
              {'threshold':0.60,'maxAttempts':101,'maxEntryDebitUsd':1,'maxConcurrent':3},
              {'threshold':0.60,'maxAttempts':3,'maxEntryDebitUsd':0,'maxConcurrent':3},
              {'threshold':0.60,'maxAttempts':3,'maxEntryDebitUsd':11,'maxConcurrent':3},
              {'threshold':0.60,'maxAttempts':3,'maxEntryDebitUsd':1,'maxConcurrent':0},
              {'threshold':0.60,'maxAttempts':3,'maxEntryDebitUsd':1,'maxConcurrent':11},
          ]

          for i, ui in enumerate(invalid, 1):
              try:
                  validate(ui)
                  raise AssertionError(f'INVALID_FIXTURE_{i}_ACCEPTED')
              except ValueError:
                  print(f'invalid_fixture_{i}=FAIL_CLOSED')

          for key, value in source_checks.items():
              print(f'{key}={value}')
          assert all(source_checks.values()), [k for k,v in source_checks.items() if not v]

          print('coachConfigSurface=PROVEN_ZERO_MONEY_MODEL')
          print('thresholdConfig=PROVEN')
          print('attemptConfig=PROVEN_1_TO_100')
          print('stakeConfig=PROVEN_1_TO_10')
          print('concurrencyConfig=PROVEN_1_TO_10')
          print('fourValueFreeze=PROVEN')
          print('frozenConfigImmutable=PROVEN')
          print('autoCanChangeConfig=NO')
          print('originalArmFailureIsolation=PROVEN')
          print('providerWrites=0')
          print('capitalMovedUsd=0')
          print('ordersSubmitted=0')
          PY
