name: Founder Coach Card UI Integration

# NFE-OS verifier trigger: compact Coach Card presentation
on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/add-founder-coach-card-zero-money.yml'
      - '.github/scripts/render-founder-coach-card-ui.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
      - name: Apply safe Coach Card UI governance patch
        run: python .github/scripts/render-founder-coach-card-ui.py
      - name: Verify zero-money lock boundaries
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'FOUNDER COACH CARD' market-edge-lab/real/baseline/src/index.js
          grep -q 'ACTIVE FROZEN CONFIGURATION' market-edge-lab/real/baseline/src/index.js
          grep -q "id='coachStakeLockButton'" market-edge-lab/real/baseline/src/index.js
          grep -q "id='coachConcurrentLockButton'" market-edge-lab/real/baseline/src/index.js
          grep -q "btn.textContent=locked?'UNLOCK':'RE-LOCK'" market-edge-lab/real/baseline/src/index.js
          grep -q 'ARM COACH CARD RUN — NOT ENABLED' market-edge-lab/real/baseline/src/index.js
          grep -q 'ARM_BOUNDED_EXECUTION_TESTS_MAX_1_USD' market-edge-lab/real/baseline/src/index.js
          grep -q 'DISARM_EXECUTION_TEST_SERIES_PRESERVE_HISTORY' market-edge-lab/real/baseline/src/index.js
          echo 'functionalLogicChanged=NO'
          echo 'providerWrites=0'
          echo 'capitalMovedUsd=0'
          echo 'ordersSubmitted=0'
      - name: Commit UI-governance source change
        run: |
          git config user.name 'NFE-OS Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add market-edge-lab/real/baseline/src/index.js
          git commit -m 'Compact Founder Coach Card and Original ARM UI'
          git push origin HEAD:market-edge-baseline-real
