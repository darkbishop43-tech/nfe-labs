name: PAYNE First Pullback Shadow Offline
on:
  push:
    branches: [payne-first-pullback-shadow-isolated-20261015]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check shadow evaluation and original PAYNE tests
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --test test/first-pullback-shadow-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
