name: PAYNE Push Cloudflare Readiness Only
on:
  push:
    branches:
      - payne-real-push-notifications-isolated-20261009
    paths:
      - .github/workflows/payne-push-cloudflare-readiness.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check required secret presence without revealing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NFE_PUSH_VAPID_PUBLIC_KEY: ${{ secrets.PAYNE_PUSH_VAPID_PUBLIC_KEY }}
          NFE_PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PAYNE_PUSH_VAPID_PRIVATE_KEY }}
          PAYNE_ENROLL_TOKEN: ${{ secrets.PAYNE_PUSH_ENROLL_TOKEN }}
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NFE_PUSH_VAPID_PUBLIC_KEY NFE_PUSH_VAPID_PRIVATE_KEY PAYNE_ENROLL_TOKEN; do
            if [ -z "${!name:-}" ]; then echo "MISSING_REQUIRED_SECRET_NAME=$name"; exit 1; fi
          done
          echo "REQUIRED_SECRET_NAMES_PRESENT"
      - name: Validate isolated Worker configuration and migrations without deployment
        working-directory: market-edge-lab/real/payne-kalshi-real/push-worker
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/payne-push-build
          echo "ISOLATED_WORKER_DRY_RUN_PASS"
