name: Promote Live Position Proof
on:
  push:
    branches: [market-edge-promote-live-position]
    paths:
      - '.github/workflows/promote-live-position-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-promote-live-position
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution source
        run: sha256sum market-edge-lab/real/baseline/src/index.js | tee /tmp/before.sha
      - name: Apply presentation patch
        run: python3 market-edge-lab/real/baseline/apply-promote-live-position.py
      - name: Verify presentation-only boundary
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          test "$(git diff --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          grep -q 'LIVE POSITION / THESIS STATUS' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'holdJumpPositions' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'holdJumpOrders' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'NO LIVE OWNED POSITION' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'data-tab="triage"' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'FOUNDER HEADS-UP ONLY' market-edge-lab/real/baseline/founder-terminal.html
          grep -q '<button disabled>+30 SEC</button>' market-edge-lab/real/baseline/founder-terminal.html
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          for src in re.findall(r'<script>(.*?)</script>',s,re.S):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(src);f.close();subprocess.run(['node','--check',f.name],check=True)
          print('INLINE_SCRIPTS_OK')
          PY
      - name: Commit cockpit-only change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-edge-lab/real/baseline/founder-terminal.html
          test "$(git diff --cached --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          git commit -m 'Promote live position thesis panel above chart'
          git push origin HEAD:market-edge-promote-live-position
