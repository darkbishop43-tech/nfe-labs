name: PAYNE Stage 1 Bootstrap Offline Proof
on:
  push:
    branches: [payne-closure-bootstrap-stage1-offline-20261013]
    paths: [".github/workflows/payne-stage1-bootstrap-offline.yml"]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Stage 1 exact source and diff-only additions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:market-edge-lab/real/payne-kalshi-real/src/index.js)" = bcea107f1bbe4ef4e5e8b6ef0591fee63978e510
          node --check market-edge-lab/real/payne-kalshi-real/src/index.js
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/payne-stage1-bootstrap-manual.yml")'
          echo BOOTSTRAP_SOURCE_IDENTITY=PASS
      - name: Existing PAYNE regression
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: npm test
      - name: Stage 1 protected GET and safety proof
        run: node --test .github/tests/payne-stage1-bootstrap.test.mjs

      - name: Read current persisted PAYNE position identity (GET only)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          key="$(jq -nr --arg k 'payne-kalshi:real-series:v1' '$k|@uri')"
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values/$key"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$url" -o /tmp/payne-series-position-read.json
          jq -c '{seriesId,position:{owner:.position.owner,status:.position.status,reconciliationState:.position.reconciliationState},positionType:(.position|type)}' /tmp/payne-series-position-read.json
          echo PERSISTED_PAYNE_POSITION_GET_ONLY=PASS
