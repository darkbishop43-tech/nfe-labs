name: Validate Robinhood Observatory V0 Branch

on:
  workflow_dispatch:
  push:
    branches:
      - robinhood-observatory-v0
    paths:
      - 'wrangler.toml'
      - 'cloudflare/**'
      - 'migrations/**'
      - 'robinhood-observatory-v0/**'
      - '.github/workflows/deploy-robinhood-observatory-v0.yml'

permissions:
  contents: read

concurrency:
  group: robinhood-observatory-v0-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Robinhood Observatory branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: V0 zero-money firewall and SI tests
        working-directory: robinhood-observatory-v0
        run: npm test

      - name: Compile proof only
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deployment authority boundary
        run: |
          echo "PASS branch workflow is validation-only"
          echo "Authoritative deployment is .github/workflows/deploy-robinhood-observatory-cloudflare.yml on main"
          echo "No Cloudflare credential is consumed here"
          echo "No Worker deployment occurs here"
