name: Scoreboard Readonly Probe
on:
  push:
    branches: [market-edge-scoreboard]
    paths:
      - '.github/workflows/scoreboard-readonly-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe read-only evidence shapes
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-founder-read.darkbishop43.workers.dev'
          curl -fsS "$base/execution-test-state" -o /tmp/ex.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/ex.json'))
          s=x.get('state',{});q=x.get('queue',{});h=x.get('history',[])
          print('CURRENT',json.dumps({k:s.get(k) for k in ['status','armed','seriesId','attemptsStarted','maxAttempts','attemptsRemaining','openPositions']},sort_keys=True))
          print('CURRENT_ATTEMPTS',json.dumps(s.get('attempts',[]),sort_keys=True))
          print('QUEUE',json.dumps({k:q.get(k) for k in ['active','status','queueId','currentIndex','totalAttempts','completedAttempts']},sort_keys=True))
          print('QUEUE_COMPLETED_STAGES',json.dumps(q.get('completedStages',[]),sort_keys=True))
          print('HISTORY',json.dumps(h,sort_keys=True))
          PY
