name: Deploy Disarm UI Restore

on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/deploy-disarm-ui-restore.yml'

permissions:
  contents: read

concurrency:
  group: deploy-baseline-real-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/baseline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Baseline Real dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Deploy Baseline Real only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
