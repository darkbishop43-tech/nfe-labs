name: Verify Market Edge Web Push Zero Money

on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/verify-market-edge-web-push-zero-money.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract current execution and push evidence read only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          BASE="https://market-edge-baseline-real.darkbishop43.workers.dev"
          NS="d110292129c94b26942c25d0c462a17b"
          KV="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          curl -fsS "$BASE/health" -o /tmp/health.json
          curl -fsS "$BASE/push/status" -o /tmp/push-status.json
          curl -fsS "$BASE/push/config" -o /tmp/push-config.json
          curl -fsS "$BASE/sw.js" -o /tmp/sw.js
          curl -fsS "$BASE/execution-test-state" -o /tmp/execution.json
          curl -fsS "$BASE/founder-capital-ledger" -o /tmp/capital.json
          curl -fsS "https://market-edge-siblings.darkbishop43.workers.dev/api/state/payne" -o /tmp/payne.json
          curl -fsS "${auth[@]}" "$KV/baseline-real-execution-test-v1" -o /tmp/execution-kv.json

          node <<'NODE' >/tmp/forensic-plan.json
          const fs=require("fs");
          const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          const ps=JSON.parse(fs.readFileSync("/tmp/push-status.json","utf8"));
          const pc=JSON.parse(fs.readFileSync("/tmp/push-config.json","utf8"));
          const ex=JSON.parse(fs.readFileSync("/tmp/execution.json","utf8"));
          const cap=JSON.parse(fs.readFileSync("/tmp/capital.json","utf8"));
          const payne=JSON.parse(fs.readFileSync("/tmp/payne.json","utf8"));
          const kv=JSON.parse(fs.readFileSync("/tmp/execution-kv.json","utf8"));

          // Print evidence before assertions so stale historical expectations can never hide current state.
          console.error("CURRENT_EXECUTION_STATE="+JSON.stringify(ex));
          console.error("CURRENT_PUSH_STATUS="+JSON.stringify(ps));
          console.error("CURRENT_CAPITAL_LEDGER="+JSON.stringify(cap));
          console.error("CURRENT_PAYNE_STATE="+JSON.stringify(payne));

          const positions=Array.isArray(kv.positions)?kv.positions:[];
          const attempts=Array.isArray(kv.attempts)?kv.attempts:[];
          const ledger=Array.isArray(kv.ledger)?kv.ledger:[];
          const dogePositions=positions.filter(p=>String(p?.asset||"").toUpperCase()==="DOGE");
          const dogeAttempts=attempts.filter(a=>String(a?.asset||"").toUpperCase()==="DOGE");
          const pos=dogePositions.slice().sort((a,b)=>Date.parse(b?.closedAt||b?.filledAt||b?.createdAt||0)-Date.parse(a?.closedAt||a?.filledAt||a?.createdAt||0))[0]||null;
          const attemptNo=pos?.attemptNo??dogeAttempts.at(-1)?.attemptNo??null;
          const dogeLedger=ledger.filter(e=>String(e?.asset||"").toUpperCase()==="DOGE" || (pos?.id&&String(e?.positionId||"")===String(pos.id)) || (attemptNo!=null&&Number(e?.attemptNo)===Number(attemptNo)));
          const entryOrderId=pos?.entryOrderId||dogeAttempts.find(a=>Number(a?.attemptNo)===Number(attemptNo))?.orderId||null;
          const closeAuthority=pos?(pos.exitOrderId||pos.providerReconciledAt||pos.closedAt||dogeLedger.find(e=>e?.type==="TEST_POSITION_CLOSED"||e?.type==="TEST_STALE_POSITION_PROVIDER_FLAT_RECONCILED")?.ts||null):null;
          const fillEventId=(entryOrderId&&pos?.id)?("fill:"+entryOrderId+":"+pos.id):null;
          const closeEventId=(closeAuthority&&pos?.id)?("close:"+closeAuthority+":"+pos.id):null;
          const times=[pos?.filledAt,pos?.closedAt,...dogeLedger.map(e=>e?.ts)].filter(Boolean).map(Date.parse).filter(Number.isFinite);
          const minTs=times.length?Math.floor((Math.min(...times)-15*60*1000)/1000):null;
          const maxTs=times.length?Math.floor((Math.max(...times)+15*60*1000)/1000):null;

          console.error("DOGE_POSITION="+JSON.stringify(pos));
          console.error("DOGE_ATTEMPTS="+JSON.stringify(dogeAttempts));
          console.error("DOGE_LEDGER="+JSON.stringify(dogeLedger));
          process.stdout.write(JSON.stringify({positionId:pos?.id||null,ticker:pos?.marketTicker||null,entryOrderId,closeAuthority,fillEventId,closeEventId,minTs,maxTs}));
          NODE

          node -e 'const p=require("/tmp/forensic-plan.json"); for(const [k,v] of Object.entries(p)) if(v!=null) console.log(k+"="+v)' >/tmp/plan.env
          cat /tmp/plan.env

          fillId="$(node -p 'require("/tmp/forensic-plan.json").fillEventId||""')"
          closeId="$(node -p 'require("/tmp/forensic-plan.json").closeEventId||""')"
          ticker="$(node -p 'require("/tmp/forensic-plan.json").ticker||""')"
          minTs="$(node -p 'require("/tmp/forensic-plan.json").minTs||""')"
          maxTs="$(node -p 'require("/tmp/forensic-plan.json").maxTs||""')"

          kv_exists() {
            local key="$1"
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${auth[@]}" "$KV/$key")"
            if [ "$code" = "200" ]; then echo PRESENT
            elif [ "$code" = "404" ]; then echo ABSENT
            else echo "UNKNOWN_HTTP_$code"; fi
          }

          echo "SERVER_SUBSCRIPTION_RECORD=$(kv_exists 'notification:founder:subscription:v1')"
          echo "PAYNE_ONE_SHOT_LATCH=$(kv_exists 'notification:payne-paper-once:v1')"
          if [ -n "$fillId" ]; then echo "FILL_DEDUPE_KEY=notification:delivery:v1:$fillId"; echo "FILL_DEDUPE=$(kv_exists "notification:delivery:v1:$fillId")"; else echo "FILL_DEDUPE=UNESTABLISHED"; fi
          if [ -n "$closeId" ]; then echo "CLOSE_DEDUPE_KEY=notification:delivery:v1:$closeId"; echo "CLOSE_DEDUPE=$(kv_exists "notification:delivery:v1:$closeId")"; else echo "CLOSE_DEDUPE=UNESTABLISHED"; fi

          if [ -n "$ticker" ] && [ -n "$minTs" ] && [ -n "$maxTs" ]; then
            curl -fsS "$BASE/forensic-historical-orders?min_ts=$minTs&max_ts=$maxTs&limit=200" -o /tmp/orders.json
            node - <<'NODE'
          const fs=require("fs"),p=require("/tmp/forensic-plan.json");
          const body=JSON.parse(fs.readFileSync("/tmp/orders.json","utf8"));
          const rows=Array.isArray(body?.orders)?body.orders:Array.isArray(body)?body:[];
          const relevant=rows.filter(o=>String(o?.ticker||o?.market_ticker||"")===String(p.ticker) || String(o?.order_id||o?.id||"")===String(p.entryOrderId||"") || String(o?.order_id||o?.id||"")===String(p.closeAuthority||""));
          console.log("DOGE_PROVIDER_HISTORICAL_ORDERS="+JSON.stringify(relevant));
          NODE
          else
            echo "DOGE_PROVIDER_HISTORICAL_ORDERS=UNESTABLISHED"
          fi

          node <<'NODE'
          const fs=require("fs");
          const health=JSON.parse(fs.readFileSync("/tmp/health.json","utf8"));
          const ps=JSON.parse(fs.readFileSync("/tmp/push-status.json","utf8"));
          const pc=JSON.parse(fs.readFileSync("/tmp/push-config.json","utf8"));
          const ex=JSON.parse(fs.readFileSync("/tmp/execution.json","utf8"));
          if(!health.ok) throw new Error("health failed");
          if(!ps.ok||ps.configured!==true||ps.tradingAuthority!==false) throw new Error("push status failed");
          if(!pc.ok||typeof pc.publicKey!=="string"||pc.publicKey.length<40||pc.tradingAuthority!==false) throw new Error("push config failed");
          if(ex?.safety?.productionBaselineEntryScore!==0.8) throw new Error("production baseline changed");
          if(ex?.safety?.maxEntryDebitUsd!==1||ex?.safety?.requiredExchangeIndex!==2) throw new Error("execution invariants changed");
          if(ex?.state?.armed!==false||ex?.state?.openPositions!==0) throw new Error("execution series not at safe boundary");
          const sw=fs.readFileSync("/tmp/sw.js","utf8");
          if(!sw.includes("showNotification")||!sw.includes("notificationclick")) throw new Error("service worker missing push notification handlers");
          console.log("READ_ONLY_SAFETY="+JSON.stringify({armed:ex.state.armed,openPositions:ex.state.openPositions,providerTradingWrites:0,ordersCreated:0,ordersCancelled:0,capitalMovedUsd:0,authorizationConsumed:0}));
          NODE
      - name: Verify notification isolation in source
        shell: bash
        run: |
          set -euo pipefail
          F="market-edge-lab/real/baseline/src/index.js"
          grep -Fq 'TEST_POSITION_OPENED' "$F"
          grep -Fq 'TEST_POSITION_CLOSED' "$F"
          grep -Fq 'TEST_STALE_POSITION_PROVIDER_FLAT_RECONCILED' "$F"
          grep -Fq 'pushDeliverySeen' "$F"
          grep -Fq 'sendFounderPushBestEffort' "$F"
          grep -Fq 'providerTradingWrites:0' "$F"
          grep -Fq 'ctx.waitUntil(dispatchExecutionNotifications(env).catch(()=>{}))' "$F"
          grep -Fq 'dispatchOnePaynePaperFishNotification' "$F"
          grep -Fq 'PAYNE_PAPER_NOTIFY_ONCE_KEY' "$F"
          grep -Fq 'title:"🐟 NFE-OS · PAYNE PAPER FISH"' "$F"
          grep -Fq 'title:"🎣 NFE-OS · REAL FISH"' "$F"
          grep -Fq 'notification:attempt:v1:' "$F"

      - name: Arm authorized real validation .65 x1 through existing control
        if: github.event_name == 'push' && github.event.head_commit.message == 'Verify Payne notification isolation and arm authorized .65 x1'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://market-edge-baseline-real.darkbishop43.workers.dev"
          curl -fsS "$BASE/execution-test-state" -o /tmp/pre-arm.json
          node - <<'NODE'
          const ex=require("/tmp/pre-arm.json");
          if(ex?.state?.armed!==false||ex?.state?.openPositions!==0)throw new Error("unsafe pre-arm state");
          if(ex?.safety?.productionBaselineEntryScore!==0.8||ex?.safety?.maxEntryDebitUsd!==1)throw new Error("protected execution invariant changed");
          const idx=Number(ex?.funding?.index2);
          if(!Number.isFinite(idx)||idx<1)throw new Error("existing Index 2 capital does not satisfy $1 gate");
          console.log("PRE_ARM="+JSON.stringify({armed:ex.state.armed,openPositions:ex.state.openPositions,index2Usd:idx,productionBaseline:ex.safety.productionBaselineEntryScore}));
          NODE
          curl -fsS -X POST "$BASE/execution-test-arm"             -H 'content-type: application/x-www-form-urlencoded'             --data 'authorization=ARM_BOUNDED_EXECUTION_TESTS_MAX_1_USD&testScore=.65&runCount=1'             -o /tmp/arm-result.html
          curl -fsS "$BASE/execution-test-state" -o /tmp/post-arm.json
          node - <<'NODE'
          const ex=require("/tmp/post-arm.json");
          if(ex?.state?.armed!==true||ex?.state?.attemptsStarted!==0||ex?.state?.openPositions!==0)throw new Error("authorized arm did not reach ARMED_FISHING 0/1");
          if(ex?.safety?.productionBaselineEntryScore!==0.8||Math.abs(Number(ex?.safety?.testEntryScore)-0.65)>1e-9||Number(ex?.safety?.maxAttempts)!==1)throw new Error("authorized .65 x1 state mismatch");
          console.log("POST_ARM="+JSON.stringify(ex));
          NODE

# verification rerun after notification adapter wiring

# verification rerun after mobile enrollment parser repair

# final safety recheck before Founder mobile release

# pre-run manual cash-out inspection safety snapshot

# post-deploy pre-exit reconciliation zero-money verification

# post-cleanup original-control zero-money verification

# forensic read-only checkpoint after DOGE one-attempt lifecycle

# post-notification-repair zero-money verification