name: Existing AUTO Push PAYNE Source Offline Only
on:
  push:
    branches: [auto-existing-push-payne-source-offline-20261012]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify only additive notification source files changed
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only c78cd0332857d347ec5dae567b6dc4c93297c6ad HEAD > /tmp/changed.txt
          cat /tmp/changed.txt
          if grep -Ev '^market-edge-lab/real/baseline/(src/index.js|src/payne-real-notification-adapter.js|test/payne-real-notification-adapter.test.mjs)$|^\.github/workflows/auto-existing-push-payne-offline.yml$' /tmp/changed.txt; then exit 1; fi
          node --check market-edge-lab/real/baseline/src/index.js
          node --check market-edge-lab/real/baseline/src/payne-real-notification-adapter.js
          grep -Fq 'PAYNE_REAL_PUSH_ROUTING_ENABLED==="TRUE"' market-edge-lab/real/baseline/src/index.js
          grep -Fq 'dispatchExecutionNotifications(env)' market-edge-lab/real/baseline/src/index.js
          grep -Fq 'notification:founder:subscription:v1' market-edge-lab/real/baseline/src/index.js
          grep -Fq 'PAYNE_REAL_READ' market-edge-lab/real/baseline/wrangler.toml
          echo EXISTING_AUTO_PUSH_PRESERVED=PASS
      - name: Run additive PAYNE push adapter offline tests
        working-directory: market-edge-lab/real/baseline
        shell: bash
        run: |
          set -euo pipefail
          node --test test/payne-real-notification-adapter.test.mjs
          npm install --ignore-scripts --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir /tmp/auto-payne-push-offline
          echo ZERO_LIVE_DEPLOYMENT=PASS
      - name: Read-only active AUTO Cloudflare deployment identity
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" || -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then echo 'AUTO_CF_VERSION=UNVERIFIED_CREDENTIALS'; exit 0;fi
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          for route in "scripts/market-edge-baseline-real/deployments" "scripts/market-edge-baseline-real/versions";do
            code="$(curl -sS --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/auto-deploy.json -w '%{http_code}' "$base/$route")"
            echo "AUTO_CF_ENDPOINT=$route HTTP=$code"
            if [[ "$code" == 200 ]];then
              jq -c '{success,versions:(.result.versions//[]|map({id,version_id,percentage})),deployments:(.result.deployments//[]|map({id,created_on,versions:(.versions//[]|map({version_id,percentage}))})),count:(.result|if type=="array" then length else null end)}' /tmp/auto-deploy.json
            fi
          done
          echo "NO_SOURCE_HASH_CLAIM_WITHOUT_EXPLICIT_PROVENANCE"
      - name: Read-only Cloudflare deployed AUTO version provenance
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          target='fa172049-50f4-41f0-8e28-0af9c1ba8b8c'
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/market-edge-baseline-real"
          for tail in "versions/$target" "versions/$target/content"; do
            code="$(curl -sS --max-time 30 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o /tmp/auto-version-metadata -w '%{http_code}' "$base/$tail")"
            echo "AUTO_VERSION_READ=$tail HTTP=$code"
            if [[ "$code" == 200 ]]; then
              if [[ "$tail" == */content ]];then
                sha256sum /tmp/auto-version-metadata | sed 's@/tmp/auto-version-metadata@DEPLOYED_BUNDLE@'
                echo "DEPLOYED_CONTENT_BYTES=$(wc -c </tmp/auto-version-metadata)"
              else
                jq -c 'if .success == true then {success, version_id:(.result.id//.result.version.id//null), created_on:(.result.created_on//null), annotations:(.result.annotations//null), deployment_id:(.result.deployment_id//null), source_commit:(.result.source_commit//.result.metadata.source_commit//null)} else {success, errors:(.errors|map({code,message}))} end' /tmp/auto-version-metadata
              fi
            fi
          done
          echo NO_PRODUCTION_CHANGES
