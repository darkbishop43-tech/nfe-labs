name: PAYNE Stage 1 Live Display Isolated Tests
on:
  push:
    branches: [payne-stage1-live-display-isolated-20261010]
    paths:
      - .github/workflows/payne-stage1-live-display-isolated-tests.yml
      - market-edge-lab/real/payne-kalshi-real/src/**
      - market-edge-lab/real/payne-kalshi-real/test/**
permissions:
  contents: read
jobs:
  isolated-zero-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          node --check src/cockpit-html.js
          node --check src/payne-live-order-watch.js
      - name: Full PAYNE suite
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: npm test
