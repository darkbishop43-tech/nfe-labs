name: PAYNE numeric threshold exact-head zero-money validation
on:
  push:
    branches: [payne-numeric-threshold-validation]
    paths:
      - '.github/workflows/payne-numeric-threshold-validation.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/payne-kalshi-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run complete PAYNE zero-money suite
        run: npm test
