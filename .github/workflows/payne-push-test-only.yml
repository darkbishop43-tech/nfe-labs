name: PAYNE Isolated Push Notification Tests
on:
  push:
    branches:
      - payne-real-push-notifications-isolated-20261009
    paths:
      - .github/workflows/payne-push-test-only.yml
      - market-edge-lab/real/payne-kalshi-real/src/payne-push-alerts.js
      - market-edge-lab/real/payne-kalshi-real/src/payne-push-delivery.js
      - market-edge-lab/real/payne-kalshi-real/test/payne-push-alerts.test.mjs
      - market-edge-lab/real/payne-kalshi-real/test/payne-push-delivery.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check alert module syntax
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          node --check src/payne-push-alerts.js
          node --check src/payne-push-delivery.js
      - name: Full PAYNE zero-money tests
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: npm test
