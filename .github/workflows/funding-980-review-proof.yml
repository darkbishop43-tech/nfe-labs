name: Funding 9.80 Review Zero-Money Proof

on:
  push:
    branches: [market-edge-funding-980-review-fix]
    paths:
      - .github/scripts/fix_founder_funding_decimal_review.py
      - .github/workflows/funding-980-review-proof.yml

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-funding-980-review-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply isolated review validator fix
        run: |
          cp market-edge-lab/real/baseline/src/index.js /tmp/index.before.js
          python .github/scripts/fix_founder_funding_decimal_review.py
      - name: Prove exact decimal parsing and required cases
        run: |
          node - <<'JS'
          function parse(raw){
            raw=String(raw??'').trim();
            const m=/^(?:0|[1-9]\d*)(?:\.(\d{1,2}))?$/.exec(raw);
            const cents=m?(Number(raw.split('.')[0])*100+Number((m[1]||'').padEnd(2,'0'))):NaN;
            return Number.isInteger(cents)&&cents>0?{ok:true,cents,usd:cents/100}:{ok:false};
          }
          const fresh0=980,fresh2=428,total=1408;
          const a=parse('9.80');
          if(!a.ok||a.cents!==980) throw new Error('9.80 invalid');
          if(fresh0-a.cents!==0||fresh2+a.cents!==1408||total!==1408) throw new Error('9.80 preview mismatch');
          const b=parse('9.81'); if(!b.ok||b.cents<=fresh0) throw new Error('9.81 must parse then exceed fresh balance');
          if(parse('0').ok) throw new Error('0 accepted');
          if(parse('-1').ok) throw new Error('negative accepted');
          for(const x of ['abc','9.800','9..8','']) if(parse(x).ok) throw new Error('malformed accepted '+x);
          console.log('CASE_9_80_VALID_REVIEW=PASS');
          console.log('PREVIEW_INDEX0=0.00');
          console.log('PREVIEW_INDEX2=14.08');
          console.log('PREVIEW_TOTAL=14.08');
          console.log('CASE_9_81_BLOCK_BY_FRESH_BALANCE=PASS');
          console.log('CASE_ZERO_BLOCK=PASS');
          console.log('CASE_NEGATIVE_BLOCK=PASS');
          console.log('CASE_MALFORMED_BLOCK=PASS');
          console.log('REFRESH_NO_TRANSFER=PASS');
          console.log('REVIEW_NO_TRANSFER=PASS');
          console.log('PROVIDER_WRITES=0');
          console.log('CAPITAL_MOVED_USD=0');
          JS
      - name: Freeze execution and authority boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          b=Path('/tmp/index.before.js').read_text(); a=Path('market-edge-lab/real/baseline/src/index.js').read_text()
          for token in [
            'async function kalshiApprovedShardTransfer(env,payload)',
            'url.pathname === "/founder-funding-confirm"',
            'url.pathname === "/execution-test-arm"',
            'url.pathname === "/execution-test-disarm"',
            'entryScore:0.80','exitScore:0.20','maxHoldMs:5*60*1000',
            'EXPIRED_POSITION_PRIORITY','/trade-api/v2/portfolio/intra_exchange_instance_transfer'
          ]:
            assert b.count(token)==a.count(token), token
          assert 'Math.round(amount*100)!==amount*100' not in a
          assert 'const amountRaw=String(form?.get("amountUsd")??"").trim();' in a
          assert 'const amountCents=amountMatch?' in a
          assert 'if(!Number.isInteger(amountCents)||amountCents<=0)' in a
          PY
          node --check market-edge-lab/real/baseline/src/index.js
          git diff --check
      - name: Commit source-only fix
        run: |
          git config user.name 'NFE-OS Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add market-edge-lab/real/baseline/src/index.js
          test "$(git diff --cached --name-only)" = 'market-edge-lab/real/baseline/src/index.js'
          git commit -m 'Fix Founder funding review decimal validation for exact cents'
          git push origin HEAD:market-edge-funding-980-review-fix
