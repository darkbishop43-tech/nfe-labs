name: Final Cockpit Polish Proof
on:
  push:
    branches: [market-edge-final-cockpit-polish]
    paths:
      - '.github/workflows/final-cockpit-polish-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-final-cockpit-polish
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution and thesis logic
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/execution-before.sha
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          m=re.search(r"function thesis\(p\)\{.*?return \{light,reason,entry,same,opp,sameDelta:entry!==null&&same!==null\?same-entry:null\}\}",s,re.S)
          if not m: raise SystemExit('thesis function not found')
          pathlib.Path('/tmp/thesis-before.txt').write_text(m.group(0))
          PY
      - name: Apply presentation patch
        run: python3 market-edge-lab/real/baseline/apply-final-cockpit-polish.py
      - name: Verify boundaries and persistent layout
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/execution-after.sha
          diff -u /tmp/execution-before.sha /tmp/execution-after.sha
          python3 - <<'PY'
          import pathlib,re
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          m=re.search(r"function thesis\(p\)\{.*?return \{light,reason,entry,same,opp,sameDelta:entry!==null&&same!==null\?same-entry:null\}\}",s,re.S)
          if not m: raise SystemExit('thesis function missing after patch')
          if m.group(0)!=pathlib.Path('/tmp/thesis-before.txt').read_text(): raise SystemExit('THESIS_LOGIC_CHANGED')
          hold=s.index('id="holdObsPanel"'); summary=s.index('id="upperProgressSummary"'); workspace=s.index('<main class="workspace">')
          if not hold < summary < workspace: raise SystemExit('UPPER_PROGRESS_LOCATION_INVALID')
          for x in ['thesisLampGreen','thesisLampYellow','thesisLampRed','NO LIVE THESIS TO EVALUATE','upSignalAccuracy','upCaptureRate','upMgmtWL','VALUES UPDATE IN PLACE']:
            if x not in s: raise SystemExit('MISSING '+x)
          if 'data-tab="triage"' not in s or 'data-tab="log"' not in s: raise SystemExit('BOTTOM_TABS_MISSING')
          PY
          grep -q 'function updateUpperSummary()' market-edge-lab/real/baseline/progress-analytics.js
          grep -q "method:'GET'" market-edge-lab/real/baseline/progress-analytics.js
          ! grep -Eq "fetch\([^\n]*method:'POST'|fetch\([^\n]*method:\"POST\"" market-edge-lab/real/baseline/progress-analytics.js
      - name: Syntax checks
        run: |
          node --check market-edge-lab/real/baseline/progress-analytics.js
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          for src in re.findall(r'<script>(.*?)</script>',s,re.S):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(src);f.close();subprocess.run(['node','--check',f.name],check=True)
          print('INLINE_JS_OK')
          PY
      - name: Commit presentation-only files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-edge-lab/real/baseline/founder-terminal.html market-edge-lab/real/baseline/progress-analytics.js
          test "$(git diff --cached --name-only | sort)" = $'market-edge-lab/real/baseline/founder-terminal.html\nmarket-edge-lab/real/baseline/progress-analytics.js'
          git commit -m 'Promote persistent progress summary and stabilize thesis rendering'
          git push origin HEAD:market-edge-final-cockpit-polish
