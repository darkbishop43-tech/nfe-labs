name: PAYNE Execution Deployment KV Preflight Read Only
on:
  push:
    branches: [payne-fire-deploy-preflight-20261010]
    paths: [.github/workflows/payne-execution-deploy-preflight-readonly.yml]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify fresh authoritative persisted safety; no worker deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/payne-kv-deployment-safety.sh pre
