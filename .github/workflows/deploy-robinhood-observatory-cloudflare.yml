      - name: Verify authoritative SI_CORE_V0A with non-blocking N_V0
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute nfe-os-robinhood-si-v0a-ledger --remote --command="SELECT id,observed_at,robinhood_symbol,research_symbol,m,t,v,q,f,n_v0,si_core_v0a,n_status,n_version,robinhood_provider_timestamp FROM v0a_observations ORDER BY observed_at_ms DESC LIMIT 1;" --json > /tmp/current-si.json
          cat /tmp/current-si.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/current-si.json','utf8'));
          const row=p?.[0]?.results?.[0]||p?.results?.[0]||null;
          if(!row) throw new Error('Current SI observation missing');
          const vals={M:row.m,T:row.t,V:row.v,Q:row.q,F:row.f};
          for(const [k,raw] of Object.entries(vals)){
            const v=Number(raw);
            if(!Number.isFinite(v)||v<0||v>1) throw new Error(k+' invalid');
          }
          const expected=100*(.30*Number(row.m)+.20*Number(row.t)+.15*Number(row.v)+.10*Number(row.q)+.15*Number(row.f))/.90;
          if(!Number.isFinite(Number(row.si_core_v0a))) throw new Error('SI_CORE_V0A not numeric');
          if(Math.abs(Number(row.si_core_v0a)-expected)>1e-9) throw new Error('SI_CORE_V0A arithmetic mismatch');
          if(row.n_v0!==null||row.n_status!=='INCOMPLETE') throw new Error('Expected preserved incomplete N_V0 research state');
          if(row.n_version!=='N_V0') throw new Error('N version metadata mismatch');
          console.log('VERIFY SI_CORE_V0A numeric while N_V0 incomplete PASS',JSON.stringify({id:row.id,observed_at:row.observed_at,M:row.m,T:row.t,V:row.v,Q:row.q,F:row.f,rawWeighted:.30*Number(row.m)+.20*Number(row.t)+.15*Number(row.v)+.10*Number(row.q)+.15*Number(row.f),SI_CORE_V0A:row.si_core_v0a,N_V0:row.n_v0,n_status:row.n_status,robinhood_provider_timestamp:row.robinhood_provider_timestamp}));
          NODE

      - name: Verify N_V0 persistence and versioning
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            npx --yes wrangler@4 d1 execute nfe-os-robinhood-si-v0a-ledger --remote --command="SELECT id,observed_at,n_version,si_version,n_v0,n_status,n_missing_components,n_e,n_fr,n_tr,n_tx,n_a,n_c,full_si,full_si_state,n_provenance_json FROM v0a_observations WHERE n_version='N_V0' ORDER BY observed_at_ms DESC LIMIT 1;" --json > /tmp/n-v0-row.json
            if grep -q '"n_version": "N_V0"' /tmp/n-v0-row.json; then break; fi
            sleep 15
          done
          cat /tmp/n-v0-row.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/n-v0-row.json','utf8'));
          const row=p?.[0]?.results?.[0]||p?.results?.[0]||null;
          if(!row) throw new Error('N_V0 row missing');
          if(row.n_version!=='N_V0'||row.si_version!=='SI_V0') throw new Error('N/SI version mismatch');
          if(row.n_status!=='INCOMPLETE'||row.n_v0!==null||row.full_si!==null) throw new Error('N_V0 fail-closed state mismatch');
          const missing=JSON.parse(row.n_missing_components||'[]');
          if(!missing.some(x=>String(x.reason).includes('evidence bundle missing'))) throw new Error('N_V0 missing-evidence reason absent');
          const prov=JSON.parse(row.n_provenance_json||'{}');
          if(prov.marketDataDoubleCountPrevented!==true) throw new Error('N_V0 double-count guard provenance absent');
          console.log('VERIFY N_V0 persisted version + fail-closed state PASS',JSON.stringify({id:row.id,n_version:row.n_version,si_version:row.si_version,n_status:row.n_status,missingCount:missing.length,provenance:prov}));
          NODE
