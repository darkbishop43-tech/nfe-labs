name: Deploy Robinhood Observatory Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-robinhood-observatory-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robinhood-observatory-cloudflare
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accepted Robinhood Observatory branch
        uses: actions/checkout@v4
        with:
          ref: robinhood-observatory-v0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate existing Cloudflare deployment credentials are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Ensure dedicated SI V0-A D1 exists
        id: d1
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="nfe-os-robinhood-si-v0a-ledger"
          LIST_JSON="$(npx --yes wrangler@4 d1 list --json)"
          DB_ID="$(printf '%s' "$LIST_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='nfe-os-robinhood-si-v0a-ledger');if(x)process.stdout.write(x.uuid||x.id||'')})")"
          if [ -z "$DB_ID" ]; then
            echo "Creating dedicated D1: $DB_NAME"
            npx --yes wrangler@4 d1 create "$DB_NAME" >/tmp/d1-create.txt
            cat /tmp/d1-create.txt
            LIST_JSON="$(npx --yes wrangler@4 d1 list --json)"
            DB_ID="$(printf '%s' "$LIST_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d);process.stdin.on('end',()=>{const a=JSON.parse(s);const x=a.find(v=>v.name==='nfe-os-robinhood-si-v0a-ledger');if(x)process.stdout.write(x.uuid||x.id||'')})")"
          fi
          test -n "$DB_ID"
          echo "D1_DATABASE_ID=$DB_ID"
          echo "database_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare D1-bound deploy config
        shell: bash
        env:
          DB_ID: ${{ steps.d1.outputs.database_id }}
        run: |
          set -euo pipefail
          cp wrangler.toml wrangler.deploy.toml
          printf '\n[[d1_databases]]\nbinding = "V0A_DB"\ndatabase_name = "nfe-os-robinhood-si-v0a-ledger"\ndatabase_id = "%s"\nmigrations_dir = "migrations"\n' "$DB_ID" >> wrangler.deploy.toml
          grep -q 'binding = "V0A_DB"' wrangler.deploy.toml
          grep -q 'crons = \["\* \* \* \* \*"\]' wrangler.deploy.toml

      - name: Apply dedicated SI V0-A D1 schema
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply nfe-os-robinhood-si-v0a-ledger --remote --config wrangler.deploy.toml
          npx --yes wrangler@4 d1 execute nfe-os-robinhood-si-v0a-ledger --remote --command="SELECT name FROM sqlite_schema WHERE type='table' AND name IN ('v0a_observations','v0a_spread_samples','v0a_outcomes') ORDER BY name" --json > /tmp/d1-tables.json
          cat /tmp/d1-tables.json
          grep -q 'v0a_observations' /tmp/d1-tables.json
          grep -q 'v0a_spread_samples' /tmp/d1-tables.json
          grep -q 'v0a_outcomes' /tmp/d1-tables.json

      - name: V0 read-only firewall
        working-directory: robinhood-observatory-v0
        run: npm test

      - name: Cloudflare compile proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.deploy.toml

      - name: Deploy dedicated Robinhood Observatory Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.ROBINHOOD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(npx --yes wrangler@4 deploy --config wrangler.deploy.toml 2>&1)"
          printf '%s\n' "$DEPLOY_OUTPUT"
          LIVE_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1)"
          test -n "$LIVE_URL" || { echo "Cloudflare live URL not found in Wrangler output"; exit 1; }
          echo "live_url=$LIVE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public shell and security headers
        shell: bash
        env:
          LIVE_URL: ${{ steps.deploy.outputs.live_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --dump-header /tmp/headers "$LIVE_URL/" --output /tmp/body
          grep -q 'NFE-OS Robinhood Observatory' /tmp/body && echo "VERIFY title PASS"
          grep -q 'EXECUTION DISARMED' /tmp/body && echo "VERIFY execution badge PASS"
          grep -q 'Live Trader Cockpit' /tmp/body && echo "VERIFY cockpit PASS"
          grep -q 'Crypto Radar Universe' /tmp/body && echo "VERIFY universe PASS"
          grep -q 'NFE-OS SI Crypto V0' /tmp/body && echo "VERIFY SI Crypto V0 PASS"
          grep -q 'SI Crypto V0-A Instrumentation' /tmp/body && echo "VERIFY V0-A PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/app.js" --output /tmp/app-js
          grep -q 'D1 LIVE RESEARCH FEED' /tmp/app-js && echo "VERIFY main SI D1 feed wiring PASS"
          grep -q 'AUTHORITATIVE CURRENT MARKET INTELLIGENCE' /tmp/app-js && echo "VERIFY SI_CORE_V0A authoritative cockpit PASS"
          grep -q 'NFE EVIDENCE RESEARCH — N_V0' /tmp/app-js && echo "VERIFY N_V0 separate research cockpit PASS"
          grep -q 'It does NOT block or alter SI_CORE_V0A' /tmp/app-js && echo "VERIFY N_V0 non-blocking presentation PASS"
          grep -q 'Founder Quick State' /tmp/body && echo "VERIFY lifecycle quick-state placement PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/data/snapshot.json" --output /tmp/snapshot
          grep -q '"operationalCockpit"' /tmp/snapshot
          grep -q '"cryptoUniverse"' /tmp/snapshot
          grep -q '"researchLanes"' /tmp/snapshot
          grep -q '"siCryptoV0"' /tmp/snapshot
          grep -q '"siCryptoV0A"' /tmp/snapshot
          grep -q '"HISTORICAL / DIAGNOSTIC CONFIGURATION — CURRENT VALUES COME FROM D1"' /tmp/snapshot && echo "VERIFY lower V0-A diagnostic labeling PASS"
          grep -q '"credential": "NONE"' /tmp/snapshot
          grep -q '"executionAuthority": "NONE"' /tmp/snapshot
          grep -q '"NO CURRENT CANDIDATE-SPECIFIC STRUCTURED NFE/UMEO BUNDLE FOUND"' /tmp/snapshot && echo "VERIFY N evidence inventory fail-closed truth PASS"
          grep -q '"DISARMED / FIRE BLOCKED"' /tmp/snapshot
          grep -q '"qualificationThreshold": null' /tmp/snapshot
          grep -q '"MCP ACTIVE MARKET SURFACE NOT CURRENTLY EXPOSED"' /tmp/snapshot
          grep -qi '^content-security-policy:.*connect-src '\''self'\''' /tmp/headers
          grep -qi '^x-content-type-options: nosniff' /tmp/headers
          grep -qi '^x-frame-options: DENY' /tmp/headers
          echo "PUBLIC_LOAD_PASS $LIVE_URL"
          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/execution/state" --output /tmp/rh-execution-state.json
          cat /tmp/rh-execution-state.json
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/rh-execution-state.json','utf8'));
          const s=x.state||{};
          if(x.liveWritesEnabled!==true) throw new Error('LIVE_WRITE_CAPABILITY_NOT_ENABLED');
          if(x.execution!=='DISARMED') throw new Error('EXECUTION_NOT_DISARMED');
          if(s.armed!==false) throw new Error('ARMED_STATE_NOT_FALSE');
          if(s.state!=='DISARMED') throw new Error('DURABLE_STATE_NOT_DISARMED');
          if(s.owned!==null) throw new Error('OWNED_POSITION_PRESENT');
          if(s.reconciliation!=='FLAT') throw new Error('RECONCILIATION_NOT_FLAT');
          if(s.entryIntent!==null) throw new Error('ENTRY_INTENT_PRESENT');
          if(s.exitIntent!==null) throw new Error('EXIT_INTENT_PRESENT');
          console.log('VERIFY governed live-write capability enabled while DISARMED PASS',JSON.stringify({liveWritesEnabled:x.liveWritesEnabled,execution:x.execution,armed:s.armed,state:s.state,owned:s.owned,reconciliation:s.reconciliation,entryIntent:s.entryIntent,exitIntent:s.exitIntent}));
          NODE
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/ledger-status" --output /tmp/v0a-ledger-status
          grep -q '"database": "nfe-os-robinhood-si-v0a-ledger"' /tmp/v0a-ledger-status && echo "VERIFY dedicated D1 binding PASS"
          grep -q '"authority": "RESEARCH_ONLY"' /tmp/v0a-ledger-status && echo "VERIFY D1 research-only authority PASS"
          grep -q '"robinhoodExecution": "DISARMED"' /tmp/v0a-ledger-status && echo "VERIFY Robinhood execution disarmed PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/ping" --output /tmp/v0a-ping
          grep -q '"status": "PASS"' /tmp/v0a-ping && echo "VERIFY Binance.US public ping PASS"
          grep -q '"credential": "NONE"' /tmp/v0a-ping && echo "VERIFY Binance.US no credential PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/mapping" --output /tmp/v0a-mapping
          grep -q '"mappingStatus": "MAPPED"' /tmp/v0a-mapping && echo "VERIFY symbol mapping PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/momentum?symbol=BTC-USD&bars=1000" --output /tmp/v0a-momentum
          grep -q '"researchSource": "Binance.US"' /tmp/v0a-momentum && echo "VERIFY momentum provenance PASS"
          grep -q '"M": ' /tmp/v0a-momentum && echo "VERIFY M payload PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/features?symbol=BTC-USD&featureInterval=1h&lookbackDays=30" --output /tmp/v0a-features
          grep -q '"T": ' /tmp/v0a-features && grep -q '"V": ' /tmp/v0a-features && grep -q '"F": ' /tmp/v0a-features && echo "VERIFY T/V/F payload PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/book?symbol=BTC-USD" --output /tmp/v0a-book
          grep -q '"qSpread": null' /tmp/v0a-book && echo "VERIFY standalone book endpoint remains diagnostic; authoritative current Q comes from D1 history PASS"
          grep -q '"fireAuthority": "ZERO"' /tmp/v0a-momentum && grep -q '"fireAuthority": "ZERO"' /tmp/v0a-features && grep -q '"fireAuthority": "ZERO"' /tmp/v0a-book && echo "VERIFY zero FIRE authority PASS"
          grep -q 'SAME AUTHORITATIVE D1 VALUE AS TOP SI' /tmp/app-js && echo "VERIFY one authoritative current SI component state PASS"
          grep -q 'LIVE QUALIFICATION THRESHOLD: NOT YET FOUNDER APPROVED' /tmp/app-js && echo "VERIFY no qualification threshold invention PASS"
          grep -q 'Fresh live execution connectivity' /tmp/app-js && echo "VERIFY research/provider freshness separation PASS"
          grep -q 'Start provider scan' /tmp/app-js && grep -q 'Run fresh order preview' /tmp/app-js && echo "VERIFY governed button behavior wiring PASS"
          grep -q 'STALE / SNAPSHOT' /tmp/app-js && grep -q 'FRESH LOCK REQUIRED' /tmp/app-js && echo "VERIFY crypto radar stale-provider semantics PASS"
          for i in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/provider-capability?action=fire_readiness" --output /tmp/rh-capability; then break; fi
            sleep 5
          done
          cat /tmp/rh-capability
          node - <<'NODE'
          const fs=require('fs');
          const x=JSON.parse(fs.readFileSync('/tmp/rh-capability','utf8'));
          if(x.status!=='CONNECTED_FRESH') throw new Error('ROBINHOOD_PROVIDER_SCAN_NOT_CONNECTED');
          if(x.publicWorkerLiveRead!==true) throw new Error('ROBINHOOD_LIVE_READ_NOT_ENABLED');
          if(x.providerState!=='FRESH') throw new Error('ROBINHOOD_PROVIDER_STATE_NOT_FRESH');
          if(x.executionSurface!=='CONNECTED') throw new Error('ROBINHOOD_EXECUTION_SURFACE_NOT_CONNECTED');
          if(x.robinhoodExecution!=='DISARMED'||x.fireAuthority!=='ZERO') throw new Error('ROBINHOOD_EXECUTION_AUTHORITY_EXPANDED');
          if(!x.freshProviderTimestamp) throw new Error('ROBINHOOD_FRESH_PROVIDER_TIMESTAMP_MISSING');
          if(!x.account||!x.account.account_number_masked) throw new Error('ROBINHOOD_FRESH_ACCOUNT_STATE_MISSING');
          if(!x.quote||!x.quote.symbol||x.quote.bid==null||x.quote.ask==null) throw new Error('ROBINHOOD_FRESH_QUOTE_MISSING');
          if(x.credentialBindings?.apiKeyPresent!==true||x.credentialBindings?.privateKeyPresent!==true) throw new Error('ROBINHOOD_CREDENTIAL_BINDINGS_NOT_PRESENT');
          console.log('VERIFY Robinhood production connector FRESH PASS',JSON.stringify({status:x.status,providerState:x.providerState,executionSurface:x.executionSurface,freshProviderTimestamp:x.freshProviderTimestamp,symbol:x.quote.symbol,bid:x.quote.bid,ask:x.quote.ask,account:x.account.account_number_masked,execution:x.robinhoodExecution,fireAuthority:x.fireAuthority}));
          NODE
          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/status" --output /tmp/rh-read-status
          cat /tmp/rh-read-status
          grep -q '"readOnlyConnector": true' /tmp/rh-read-status
          grep -q '"writeRoutesPresent": false' /tmp/rh-read-status
          grep -q '"execution": "DISARMED"' /tmp/rh-read-status
          grep -q '"fireAuthority": "ZERO"' /tmp/rh-read-status
          echo "VERIFY Robinhood read-only connector shell PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/mapping" --output /tmp/v0a-mapping.json
          SCORE_SYMBOL="$(node - <<'NODE'
          const fs=require('fs');
          const m=JSON.parse(fs.readFileSync('/tmp/v0a-mapping.json','utf8'));
          const x=(m.rows||[]).find(r=>r.mappingStatus==='MAPPED'&&r.robinhoodTradable);
          if(!x) process.exit(2);
          process.stdout.write(x.robinhoodSymbol);
          NODE
          )"
          curl --fail --silent --show-error --get "$LIVE_URL/api/v0a/score" --data-urlencode "symbol=$SCORE_SYMBOL" --output /tmp/v0a-score.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/v0a-score.json','utf8'));
          if(!['VALID','INCOMPLETE'].includes(s.status)) throw new Error('Unexpected score status '+s.status);
          if(s.qualificationThreshold!=='NOT SET'||s.fireAuthority!=='ZERO') throw new Error('Score endpoint authority boundary mismatch');
          if(!s.symbol) throw new Error('Score specimen symbol missing');
          console.log('VERIFY read-only SI score endpoint PASS',JSON.stringify({symbol:s.symbol,status:s.status,score:s.score?.value??null,qualificationThreshold:s.qualificationThreshold,fireAuthority:s.fireAuthority}));
          NODE
          if grep -q 'INCOMPLETE — SPREAD HISTORY REQUIRED' /tmp/app-js; then echo "Stale conflicting Q presentation remains"; exit 1; fi
          echo "V0A_MAPPING_SUMMARY"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/v0a-mapping'));const mo=JSON.parse(fs.readFileSync('/tmp/v0a-momentum'));const f=JSON.parse(fs.readFileSync('/tmp/v0a-features'));const b=JSON.parse(fs.readFileSync('/tmp/v0a-book'));console.log(JSON.stringify({robinhoodPairs:m.robinhoodPairs,mapped:m.mapped,unmapped:m.unmapped,mappedAssets:m.rows.filter(x=>x.mappingStatus==='MAPPED').map(x=>x.robinhoodSymbol),unmappedAssets:m.rows.filter(x=>x.mappingStatus!=='MAPPED').map(x=>x.robinhoodSymbol)}));console.log(JSON.stringify({mapping:mo.mapping,M:mo.M,T:f.T,V:f.V,F:f.F,qLiquidity:f.qLiquidity,Q:b.Q,researchBook:b.researchBook,depthSummary:b.depthSummary,featureConfig:f.configuration,momentumConfig:mo.configuration}))"


      - name: Verify authenticated Robinhood Crypto read surfaces
        shell: bash
        env:
          LIVE_URL: ${{ steps.deploy.outputs.live_url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/status" --output /tmp/rh-status.json
          node - <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync('/tmp/rh-status.json','utf8'));
          if(s.apiKeyPresent!==true||s.privateKeyPresent!==true) throw new Error('Robinhood Crypto Worker secrets not both present');
          if(s.readOnlyConnector!==true||s.writeRoutesPresent!==false) throw new Error('Connector authority boundary mismatch');
          if(s.execution!=='DISARMED'||s.fireAuthority!=='ZERO') throw new Error('Execution authority expanded');
          console.log('VERIFY Robinhood encrypted credential bindings present PASS',JSON.stringify({apiKeyPresent:s.apiKeyPresent,privateKeyPresent:s.privateKeyPresent,readOnlyConnector:s.readOnlyConnector,writeRoutesPresent:s.writeRoutesPresent,execution:s.execution,fireAuthority:s.fireAuthority}));
          NODE

          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/accounts" --output /tmp/rh-accounts.json
          cat /tmp/rh-accounts.json
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('/tmp/rh-accounts.json','utf8'));
          const rows=a.results||[];
          if(rows.length<1) throw new Error('No Robinhood crypto accounts returned');
          for(const x of rows){
            if(!/^••••\d{4}$/.test(String(x.account_number_masked||''))) throw new Error('Masked account proof missing');
            if('account_number' in x) throw new Error('Raw account number exposed');
          }
          const matches=rows.filter(x=>Array.isArray(x.bound_lanes)&&x.bound_lanes.includes('crypto'));
          if(matches.length!==1) throw new Error('CRYPTO_BINDING_NOT_UNIQUE matchCount='+matches.length);
          const x=matches[0];
          if(x.account_number_masked!=='••••4142') throw new Error('CRYPTO_BINDING_MASK_MISMATCH '+x.account_number_masked);
          if(a.accountRegistry?.cryptoBinding?.account_number_masked!=='••••4142') throw new Error('Registry crypto binding mismatch');
          console.log('VERIFY Robinhood multi-account discovery + explicit crypto binding PASS',JSON.stringify({accountCount:rows.length,cryptoBinding:x.account_number_masked,status:x.status,buying_power:x.buying_power,buying_power_currency:x.buying_power_currency,account_type:x.account_type,is_api_tradable:x.is_api_tradable,otherAccounts:rows.filter(v=>v!==x).map(v=>v.account_number_masked)}));
          NODE

          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/pairs" --output /tmp/rh-pairs.json
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('/tmp/rh-pairs.json','utf8'));
          const rows=p.results||[];
          const tradable=rows.find(x=>x.is_api_tradable===true && x.symbol && x.asset_increment);
          if(!tradable) throw new Error('No API-tradable pair with provider asset_increment');
          fs.writeFileSync('/tmp/rh-pair-proof.json',JSON.stringify({symbol:tradable.symbol,asset_code:tradable.asset_code,asset_increment:tradable.asset_increment,max_order_size:tradable.max_order_size,min_order_amount:tradable.min_order_amount,status:tradable.status,is_api_tradable:tradable.is_api_tradable}));
          console.log('VERIFY Robinhood trading-pair discovery PASS',JSON.stringify({pairCount:rows.length,proofPair:tradable.symbol,status:tradable.status,is_api_tradable:tradable.is_api_tradable,asset_increment:tradable.asset_increment}));
          NODE

          SYMBOL="$(node -e "const x=require('/tmp/rh-pair-proof.json');process.stdout.write(String(x.symbol))")"
          QUANTITY="$(node -e "const x=require('/tmp/rh-pair-proof.json');process.stdout.write(String(x.asset_increment))")"

          curl --fail --silent --show-error --get "$LIVE_URL/api/robinhood/crypto/quote" --data-urlencode "symbol=$SYMBOL" --output /tmp/rh-quote.json
          cat /tmp/rh-quote.json
          node - <<'NODE'
          const fs=require('fs');
          const q=JSON.parse(fs.readFileSync('/tmp/rh-quote.json','utf8'));
          const x=(q.results||[])[0];
          if(!x||!x.symbol||x.bid==null||x.ask==null) throw new Error('Best bid/ask proof missing');
          console.log('VERIFY Robinhood best bid/ask PASS',JSON.stringify({symbol:x.symbol,bid:x.bid,ask:x.ask}));
          NODE

          curl --fail --silent --show-error --get "$LIVE_URL/api/robinhood/crypto/estimate" --data-urlencode "symbol=$SYMBOL" --data-urlencode "side=both" --data-urlencode "quantity=$QUANTITY" --output /tmp/rh-estimate.json
          cat /tmp/rh-estimate.json
          node - <<'NODE'
          const fs=require('fs');
          const e=JSON.parse(fs.readFileSync('/tmp/rh-estimate.json','utf8'));
          const x=(e.results||[])[0];
          if(!x||!x.symbol||x.quantity==null) throw new Error('Estimated-price proof missing');
          console.log('VERIFY Robinhood estimated price PASS',JSON.stringify({symbol:x.symbol,side:x.side,quantity:x.quantity,timestamp:x.timestamp,bid:x.bid,ask:x.ask,fee_ratio:x.fee_ratio,est_fee:x.est_fee,est_total_cost:x.est_total_cost,est_total_credit:x.est_total_credit}));
          NODE

          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/holdings" --output /tmp/rh-holdings.json
          cat /tmp/rh-holdings.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/rh-holdings.json','utf8'));
          if(!h.account||h.account.account_number_masked!=='••••4142'||h.account.binding?.lane!=='crypto') throw new Error('Bound holdings account proof missing or wrong lane');
          for(const x of (h.results||[])) if(x.account_number) throw new Error('Raw holdings account number exposed');
          console.log('VERIFY Robinhood holdings PASS',JSON.stringify({account_number_masked:h.account.account_number_masked,holdingCount:(h.results||[]).length,holdings:(h.results||[]).map(x=>({asset_code:x.asset_code,total_quantity:x.total_quantity,quantity_available_for_trading:x.quantity_available_for_trading}))}));
          NODE

          curl --fail --silent --show-error --location "$LIVE_URL/api/robinhood/crypto/orders" --output /tmp/rh-orders.json
          cat /tmp/rh-orders.json
          node - <<'NODE'
          const fs=require('fs');
          const o=JSON.parse(fs.readFileSync('/tmp/rh-orders.json','utf8'));
          if(!o.account||o.account.account_number_masked!=='••••4142'||o.account.binding?.lane!=='crypto') throw new Error('Bound order-history account proof missing or wrong lane');
          for(const x of (o.results||[])) if(x.account_number) throw new Error('Raw order account number exposed');
