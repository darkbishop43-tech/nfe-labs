name: Deploy Robinhood Observatory Cloudflare

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-robinhood-observatory-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: robinhood-observatory-cloudflare
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout accepted Robinhood Observatory branch
        uses: actions/checkout@v4
        with:
          ref: robinhood-observatory-v0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate existing Cloudflare deployment credentials are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: V0 read-only firewall
        working-directory: robinhood-observatory-v0
        run: npm test

      - name: Cloudflare compile proof
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy dedicated Robinhood Observatory Worker
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DEPLOY_OUTPUT="$(npx --yes wrangler@4 deploy 2>&1)"
          printf '%s\n' "$DEPLOY_OUTPUT"
          LIVE_URL="$(printf '%s\n' "$DEPLOY_OUTPUT" | grep -Eo 'https://[^[:space:]]+\.workers\.dev' | tail -n 1)"
          test -n "$LIVE_URL" || { echo "Cloudflare live URL not found in Wrangler output"; exit 1; }
          echo "live_url=$LIVE_URL" >> "$GITHUB_OUTPUT"

      - name: Verify public shell and security headers
        shell: bash
        env:
          LIVE_URL: ${{ steps.deploy.outputs.live_url }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --dump-header /tmp/headers "$LIVE_URL/" --output /tmp/body
          grep -q 'NFE-OS Robinhood Observatory' /tmp/body && echo "VERIFY title PASS"
          grep -q 'EXECUTION DISARMED' /tmp/body && echo "VERIFY execution badge PASS"
          grep -q 'Live Trader Cockpit' /tmp/body && echo "VERIFY cockpit PASS"
          grep -q 'Crypto Radar Universe' /tmp/body && echo "VERIFY universe PASS"
          grep -q 'NFE-OS SI Crypto V0' /tmp/body && echo "VERIFY SI Crypto V0 PASS"
          grep -q 'SI Crypto V0-A Instrumentation' /tmp/body && echo "VERIFY V0-A PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/data/snapshot.json" --output /tmp/snapshot
          grep -q '"operationalCockpit"' /tmp/snapshot
          grep -q '"cryptoUniverse"' /tmp/snapshot
          grep -q '"researchLanes"' /tmp/snapshot
          grep -q '"siCryptoV0"' /tmp/snapshot
          grep -q '"siCryptoV0A"' /tmp/snapshot
          grep -q '"GOVERNED HOLD — OFFICIAL ROBINHOOD DATA INSUFFICIENT' /tmp/snapshot
          grep -q '"DISARMED / FIRE BLOCKED"' /tmp/snapshot
          grep -q '"qualificationThreshold": null' /tmp/snapshot
          grep -q '"MCP ACTIVE MARKET SURFACE NOT CURRENTLY EXPOSED"' /tmp/snapshot
          grep -qi '^content-security-policy:.*connect-src '\''self'\''' /tmp/headers
          grep -qi '^x-content-type-options: nosniff' /tmp/headers
          grep -qi '^x-frame-options: DENY' /tmp/headers
          echo "PUBLIC_LOAD_PASS $LIVE_URL"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/ping" --output /tmp/v0a-ping
          grep -q '"status": "PASS"' /tmp/v0a-ping && echo "VERIFY Binance.US public ping PASS"
          grep -q '"credential": "NONE"' /tmp/v0a-ping && echo "VERIFY Binance.US no credential PASS"
          curl --fail --silent --show-error --location "$LIVE_URL/api/v0a/mapping" --output /tmp/v0a-mapping
          grep -q '"mappingStatus": "MAPPED"' /tmp/v0a-mapping && echo "VERIFY symbol mapping PASS"
          RESEARCH_HTTP="$(curl --silent --show-error --location --write-out '%{http_code}' "$LIVE_URL/api/v0a/research?symbol=BTC-USD&featureInterval=1h&lookbackDays=30" --output /tmp/v0a-research)"
          echo "V0A_RESEARCH_HTTP $RESEARCH_HTTP"
          cat /tmp/v0a-research
          test "$RESEARCH_HTTP" = "200"
          grep -q '"source": "Binance.US"' /tmp/v0a-research && echo "VERIFY V0-A Binance component provenance PASS"
          grep -q '"M": {' /tmp/v0a-research && grep -q '"T": {' /tmp/v0a-research && grep -q '"V": {' /tmp/v0a-research && grep -q '"F": {' /tmp/v0a-research && echo "VERIFY M/T/V/F component payload PASS"
          grep -q '"qSpread": null' /tmp/v0a-research && echo "VERIFY Q spread-history blocker PASS"
          grep -q '"fireAuthority": "ZERO"' /tmp/v0a-research && echo "VERIFY zero FIRE authority PASS"
          echo "V0A_MAPPING_SUMMARY"
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('/tmp/v0a-mapping'));console.log(JSON.stringify({robinhoodPairs:m.robinhoodPairs,mapped:m.mapped,unmapped:m.unmapped}));const r=JSON.parse(fs.readFileSync('/tmp/v0a-research'));console.log(JSON.stringify({status:r.status,mapping:r.mapping,configuration:r.configuration,components:Object.fromEntries(Object.entries(r.components||{}).map(([k,v])=>[k,v.value])),scores:r.scores,raw:{ema9:r.raw?.ema9,ema20:r.raw?.ema20,ema50:r.raw?.ema50,atr14:r.raw?.atr14,atrPercentile:r.raw?.atrPercentile,volume:r.raw?.volume,relativeVolume:r.raw?.relativeVolume,quoteVolume:r.raw?.quoteVolume,tradeCount:r.raw?.tradeCount,researchBook:r.raw?.researchBook,depthSummary:r.raw?.depthSummary}}))"
