name: PAYNE Credential Auth Read Only 20261013
on:
  push:
    branches: [payne-legacy-first-arm-offline-proof-20261012]
    paths: ['.github/workflows/payne-credential-auth-readonly-20261013.yml']
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - name: Auth evidence via existing PAYNE GET paths
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          for path in cockpit-data 'real-history?view=audit&seriesId=2d5fc45d-25fd-4923-bb1f-b9e361fbaa25'; do
            status=$(curl -sS --max-time 40 -o /tmp/payne-auth-observation.json -w '%{http_code}' "$base/$path")
            echo "OBSERVED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ) ENDPOINT=$path HTTP=$status"
            if [ "$status" != 200 ]; then echo "ENDPOINT_FAILURE_HTTP=$status";continue;fi
            if [ "$path" = 'cockpit-data' ]; then
              jq -c '{authentication,balanceHttpStatus,providerGets,providerWrites,error,errorClass}' /tmp/payne-auth-observation.json
            else
              jq -c '{schema,attempts:[(.attempts // [])[]|{attemptNo,httpStatus,providerResponseAt,providerErrorMessage,terminalClassification}]}' /tmp/payne-auth-observation.json
            fi
          done
          echo ZERO_ORDER_POSTS_FROM_THIS_CHECK=PASS
