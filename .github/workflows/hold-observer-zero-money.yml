name: Hold Observer Zero Money
on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - 'market-edge-lab/real/hold-observer/**'
      - '.github/workflows/hold-observer-zero-money.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Zero-money observability proof
        run: |
          set -euo pipefail
          node market-edge-lab/real/hold-observer/test.mjs | tee /tmp/hold-proof.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/hold-proof.json','utf8').trim().split('\n').at(-1));
          for(const k of ['livePositionPanelModel','defaultFiveMinutes','entryCheckpoint','checkpoint5m','checkpoint5m30','checkpoint6m','actualExitRetention','settlementRetention','postExitObservationModel'])if(x[k]!=='PASS')throw new Error(k+'_FAIL');
          if(x.realDeadlineMutation!==0||x.providerTradingWrites!==0||x.executionStateWrites!==0||x.capitalMovedUsd!==0||x.ordersSubmitted!==0)throw new Error('ZERO_AUTHORITY_FAIL');
          console.log('STATUS=GREEN');
          console.log('LIVE_POSITION_PANEL_MODEL=PASS');
          console.log('COUNTDOWN_SOURCE='+x.countdownSource);
          console.log('DEFAULT_5_MINUTE=PASS');
          console.log('ENTRY_CHECKPOINT=PASS');
          console.log('5_00_CHECKPOINT=PASS');
          console.log('5_30_CHECKPOINT=PASS');
          console.log('6_00_CHECKPOINT=PASS');
          console.log('POST_EXIT_OBSERVATION=PASS');
          console.log('ACTUAL_EXIT_RETENTION=PASS');
          console.log('SETTLEMENT_RETENTION=PASS');
          console.log('REAL_DEADLINE_MUTATION=0');
          console.log('PROVIDER_WRITES=0');
          console.log('EXECUTION_STATE_WRITES=0');
          console.log('CAPITAL_MOVED_USD=0');
          console.log('ORDERS_SUBMITTED=0');
          console.log('ARM_DISARM=UNCHANGED');
          console.log('EXIT_SCORE=.20_UNCHANGED');
          NODE
