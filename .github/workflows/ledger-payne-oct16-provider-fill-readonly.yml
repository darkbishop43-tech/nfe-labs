name: Ledger Oct16 AUTO Provider Fill Read Only
on:
  push:
    branches: [kalshi-ledger-lab-v1]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Pull provider fill and settlement evidence for AUTO Oct16
        run: |
          set -euo pipefail
          AUTO=https://market-edge-baseline-real.darkbishop43.workers.dev
          curl -fsS --retry 3 --connect-timeout 15 --max-time 180 "$AUTO/forensic-provider-history?limit=200" -o history.json
          echo "=== AUTO_FILLS ==="
          jq -c '[
            ((.fills//[]) + (.historicalFills//[]))[] |
            select((.orderId//"") as $id |
              ["01a146bc-b658-7db6-9195-aae05e43b101",
               "01a146e4-fed8-762f-ae9d-4da9917a7b98",
               "01a14701-6848-7008-831d-ad71bdfd4ceb",
               "01a1470b-7680-7c25-afee-14b3a2be367c",
               "01a14705-11c8-7b31-9471-57c2043fe2e1"] | index($id)
            )
          ] | unique_by(.fillId)' history.json
          echo "=== AUTO_SETTLEMENTS ==="
          jq -c '[
            (.settlements//[])[] |
            select((.ticker//"") as $t |
              ["KXZEC15M-26OCT161815-15",
               "KXZEC15M-26OCT161900-00",
               "KXZEC15M-26OCT161930-30",
               "KXNEAR15M-26OCT161930-30"] | index($t)
            )
          ]' history.json
          echo "=== ENDPOINTS ==="
          jq -c '.endpointFamilies' history.json
          echo "=== SAFETY ==="
          echo '{"providerWrites":0,"ordersSubmittedByThisRead":0,"capitalMovedUsd":0,"armDisarm":"UNCHANGED"}'
