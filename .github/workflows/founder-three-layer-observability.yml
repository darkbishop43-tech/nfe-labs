name: Founder Three Layer Observability
on:
  push:
    branches: [market-edge-observability-ledger-v1]
    paths:
      - '.github/workflows/founder-three-layer-observability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-observability-ledger-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution source
        run: sha256sum market-edge-lab/real/baseline/src/index.js | tee /tmp/execution-before.sha
      - name: Apply cockpit-only observability
        run: python3 market-edge-lab/real/baseline/apply-three-layer-observability.py
      - name: Verify zero-authority boundary
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/execution-after.sha
          diff -u /tmp/execution-before.sha /tmp/execution-after.sha
          test -z "$(git diff --name-only -- market-edge-lab/real/baseline/src/index.js)"
          test "$(git diff --name-only | tr -d '\r')" = "market-edge-lab/real/baseline/founder-terminal.html"
          grep -q 'THREE_LAYER_OBSERVABILITY_V1_SCRIPT' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'EXACT-TICKER SETTLEMENT ONLY' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'FOUNDER HEADS-UP ONLY' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'data-tab="triage"' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'CURRENT SAME-SIDE SCORE UNAVAILABLE' market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'OPPOSITE SIDE NOW STRONGER' market-edge-lab/real/baseline/founder-terminal.html
          grep -q '.20 EXIT CONDITION MET' market-edge-lab/real/baseline/founder-terminal.html
      - name: Syntax check inline JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess, tempfile
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          scripts=re.findall(r'<script>(.*?)</script>',s,re.S)
          for src in scripts:
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False)
            f.write(src);f.close()
            subprocess.run(['node','--check',f.name],check=True)
          print('INLINE_SCRIPTS_OK',len(scripts))
          PY
      - name: Commit cockpit-only change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-edge-lab/real/baseline/founder-terminal.html
          test "$(git diff --cached --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          git commit -m 'Add Founder three-layer observability ledger and thesis light'
          git push origin HEAD:market-edge-observability-ledger-v1
