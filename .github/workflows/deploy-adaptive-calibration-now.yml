name: Deploy Adaptive Calibration Now

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-adaptive-calibration-now.yml'

permissions:
  contents: read

jobs:
  deploy-and-start:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: adaptive-market-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Compile Adaptive paper sibling worker
        working-directory: market-edge-lab/siblings/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run
      - name: Deploy Adaptive paper calibration
        working-directory: market-edge-lab/siblings/cloud
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Start one calibration observation and print state
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://market-edge-siblings.darkbishop43.workers.dev'
          echo '=== START CALIBRATION ==='
          curl --fail --silent --show-error "$BASE/api/calibration/run"
          echo
          echo '=== CALIBRATION STATE ==='
          curl --fail --silent --show-error "$BASE/api/calibration/state"
