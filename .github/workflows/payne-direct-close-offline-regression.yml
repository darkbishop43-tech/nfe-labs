name: PAYNE Direct Writer Closure Offline Regression
on:
  push:
    branches:
      - payne-closure-maintenance-exception-offline-20261013
    paths:
      - .github/workflows/payne-direct-close-offline-regression.yml
      - .github/scripts/payne-closure-maintenance-offline.mjs
      - .github/tests/payne-closure-maintenance-offline.test.mjs
      - .github/tests/payne-closure-full-chain.test.mjs
      - .github/scripts/payne-maintenance-decision.mjs
      - .github/scripts/payne-kv-deployment-safety-maintenance.sh
      - market-edge-lab/real/payne-kalshi-real/src/payne-closure-evidence.js
      - market-edge-lab/real/payne-kalshi-real/src/index.js
      - market-edge-lab/real/payne-kalshi-real/test/direct-writer-closure-offline.test.mjs
permissions:
  contents: read
jobs:
  offline-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact approved repaired PAYNE source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:market-edge-lab/real/payne-kalshi-real/src/index.js)" = 8094c492fcb290c84db7a0347bd4b5aeb123d18a
          node --check market-edge-lab/real/payne-kalshi-real/src/index.js
          echo "TESTED_SOURCE_COMMIT=7b42db3e1699933d8fe981e7f2d709ab4e454671"
          echo "TESTED_SOURCE_BLOB=76c6ff7a2f7f6967def859012b2fcf3b66f7b2f9"
      - name: Run existing PAYNE executable offline tests
        working-directory: market-edge-lab/real/payne-kalshi-real
        shell: bash
        run: |
          set -euo pipefail
          npm test
          echo "PRODUCTION_MUTATIONS=NONE"

      - name: Execute one-time maintenance exception offline fixtures
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/tests/payne-closure-maintenance-offline.test.mjs
          echo MAINTENANCE_EXCEPTION_OFFLINE_ONLY=PASS

      - name: Execute authenticated bridge and actual gate end-to-end offline
        shell: bash
        run: |
          set -euo pipefail
          node --test .github/tests/payne-closure-full-chain.test.mjs
          echo FULL_MAINTENANCE_CHAIN_OFFLINE=PASS

      - name: Validate staged PAYNE promotion workflow YAML offline
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/payne-grok-exact-production-promotion.yml")'
          echo STAGED_PROMOTION_WORKFLOW_SYNTAX=PASS
