name: PAYNE Disarm Audit Read Only Postdeploy Verification
on:
  push:
    branches: [payne-disarm-accountability-isolated-20261015]
    paths: [".github/workflows/payne-disarm-audit-verify-only.yml"]
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check exact GET endpoints independently
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          for path in / /control /disarm-audit-status /shadow-staircase/top3-v2; do
            file="/tmp/payne-endpoint-$(echo "$path" | tr / _).body"
            status=$(curl --silent --show-error --max-time 25 -o "$file" -w '%{http_code}' "$base$path") || status=CURL_ERROR
            type=$(file -b --mime-type "$file" 2>/dev/null || echo UNKNOWN)
            printf 'PAYNE_ENDPOINT path=%s status=%s body_type=%s\n' "$path" "$status" "$type"
            head -c 320 "$file" 2>/dev/null | tr '\n' ' '; echo
          done
      - name: Verify current Cloudflare Worker traffic read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --max-time 25 \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/market-edge-payne-kalshi-real/deployments" \
            -o /tmp/payne-verify-deploy.json
          jq -c '{success,deployments:[.result.deployments[]?|{versions:[.versions[]?|{version_id,percentage}]}]}' /tmp/payne-verify-deploy.json
          jq -e '.success==true' /tmp/payne-verify-deploy.json >/dev/null
