name: Predeploy Kalshi Discovery Query Proof

on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/predeploy-kalshi-discovery-query-proof.yml'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - name: Query new bounded public Kalshi discovery shape
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://api.elections.kalshi.com/trade-api/v2/markets'
          NOW="$(date +%s)"
          python - <<'PY'
          import json, urllib.request, urllib.parse, time
          base='https://api.elections.kalshi.com/trade-api/v2/markets'
          now=int(time.time())
          for series in ['KXBTC15M','KXETH15M','KXSOL15M','KXXRP15M','KXHYPE15M']:
              q=urllib.parse.urlencode({'series_ticker':series,'min_close_ts':now,'limit':200})
              url=base+'?'+q
              try:
                  with urllib.request.urlopen(url, timeout=20) as r:
                      data=json.load(r)
                      rows=data.get('markets') or []
                      print(json.dumps({
                          'series':series,
                          'http':r.status,
                          'count':len(rows),
                          'sample':[{
                              'ticker':m.get('ticker'),
                              'status':m.get('status'),
                              'open_time':m.get('open_time'),
                              'close_time':m.get('close_time'),
                              'yes_bid_dollars':m.get('yes_bid_dollars'),
                              'yes_ask_dollars':m.get('yes_ask_dollars'),
                              'no_bid_dollars':m.get('no_bid_dollars'),
                              'no_ask_dollars':m.get('no_ask_dollars'),
                          } for m in rows[:5]]
                      }, indent=2))
              except Exception as e:
                  print(json.dumps({'series':series,'error':repr(e)}))
          PY
