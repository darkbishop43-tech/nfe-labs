name: Probe Forensic Order Field Names

on:
  push:
    branches: [market-edge-baseline-real]
    paths: ['.github/workflows/probe-forensic-order-fields.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
      - name: Read provider order schema only
        run: |
          set -euo pipefail
          base='https://market-edge-founder-read.darkbishop43.workers.dev'
          curl --fail --silent --show-error "$base/forensic-historical-orders?limit=200" -o /tmp/orders.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/orders.json','utf8'));
          const orders=Array.isArray(x.orders)?x.orders:[];
          console.log('ORDER_COUNT='+orders.length);
          if(orders.length){
            console.log('ORDER_KEYS='+Object.keys(orders[0]).sort().join(','));
            const union=[...new Set(orders.slice(0,20).flatMap(o=>Object.keys(o)))].sort();
            console.log('ORDER_KEY_UNION='+union.join(','));
          }
          console.log('PROVIDER_WRITES=0');
          console.log('CAPITAL_MOVED_USD=0');
          console.log('ORDERS_SUBMITTED=0');
          NODE
