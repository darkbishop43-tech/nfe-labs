name: Deploy Provider History Read Only

on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/deploy-provider-history-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-and-probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reverify read-only route isolation before deploy
        run: |
          set -euo pipefail
          grep -q 'NFE_PROVIDER_HISTORY_READ_V1' market-edge-lab/real/baseline/src/index.js
          python - <<'PY'
          from pathlib import Path
          s=Path('market-edge-lab/real/baseline/src/index.js').read_text()
          start=s.index('    // NFE_PROVIDER_HISTORY_READ_V1')
          end=s.index('    if (request.method === "GET" && url.pathname === "/forensic-historical-orders") {',start)
          b=s[start:end]
          assert 'request.method === "GET"' in b
          assert 'kalshiExecutionGet' in b
          for x in ['kalshiExecutionPost','kalshiExecutionDelete','saveExecutionTestState','saveRealTradeState','/execution-test-arm','/execution-test-disarm']:
              assert x not in b, x
          print('READ_ONLY_ROUTE_VERIFIED=YES')
          PY

      - name: Deploy Baseline Worker with additive read-only route
        working-directory: market-edge-lab/real/baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm install --no-audit --no-fund
          npx --yes wrangler@4 deploy

      - name: Deploy GET-only Founder read bridge
        working-directory: market-edge-lab/real/founder-read-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy

      - name: Live read-only provider history probe
        run: |
          set -euo pipefail
          direct='https://market-edge-baseline-real.darkbishop43.workers.dev/forensic-provider-history?limit=200'
          bridge='https://market-edge-founder-read.darkbishop43.workers.dev/forensic-provider-history?limit=200'
          ok=0
          for i in $(seq 1 20); do
            d=$(curl --silent --output /tmp/direct.json --write-out '%{http_code}' "$direct" || true)
            b=$(curl --silent --output /tmp/bridge.json --write-out '%{http_code}' "$bridge" || true)
            echo "attempt=$i direct=$d bridge=$b"
            if [ "$d" = 200 ] && [ "$b" = 200 ]; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          post=$(curl --silent --output /tmp/post.json --write-out '%{http_code}' -X POST 'https://market-edge-founder-read.darkbishop43.workers.dev/forensic-provider-history' || true)
          test "$post" = 405
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const x=JSON.parse(readFileSync('/tmp/bridge.json','utf8'));
          const arr=v=>Array.isArray(v)?v:[];
          const fills=[...arr(x.fills),...arr(x.historicalFills)];
          const settlements=arr(x.settlements),positions=arr(x.positions);
          const t=v=>{const n=Date.parse(v||'');return Number.isFinite(n)?n:null};
          const a=Date.parse('2026-09-27T04:00:00Z'),z=Date.parse('2026-09-28T04:00:00Z');
          const sf=fills.filter(r=>{const q=t(r.createdAt);return q!==null&&q>=a&&q<z});
          const ss=settlements.filter(r=>{const q=t(r.settledTime);return q!==null&&q>=a&&q<z});
          const e=x.endpointFamilies||{};
          console.log('FILLS_SOURCE='+(e.fills?.ok||e.historicalFills?.ok?'FOUND':'NOT_FOUND'));
          console.log('TRADES_SOURCE='+(fills.some(r=>r.tradeId)?'FOUND':'NOT_FOUND'));
          console.log('SETTLEMENT_SOURCE='+(e.settlements?.ok?'FOUND':'NOT_FOUND'));
          console.log('FILLS_HTTP='+(e.fills?.httpStatus??'NA'));
          console.log('HISTORICAL_FILLS_HTTP='+(e.historicalFills?.httpStatus??'NA'));
          console.log('SETTLEMENTS_HTTP='+(e.settlements?.httpStatus??'NA'));
          console.log('POSITIONS_HTTP='+(e.positions?.httpStatus??'NA'));
          console.log('FILLS_ROWS='+fills.length);
          console.log('SETTLEMENT_ROWS='+settlements.length);
          console.log('POSITIONS_ROWS='+positions.length);
          console.log('ROWS_RETURNED='+(fills.length+settlements.length));
          console.log('SEP27_FILL_ROWS='+sf.length);
          console.log('SEP27_SETTLEMENT_ROWS='+ss.length);
          console.log('SEP27_ROWS_RETURNED='+(sf.length+ss.length));
          console.log('SEP27_DISTINCT_TICKERS='+new Set([...sf,...ss].map(r=>r.ticker).filter(Boolean)).size);
          const keys=[...new Set([...fills.slice(0,30),...settlements.slice(0,30),...positions.slice(0,30)].flatMap(r=>Object.keys(r).filter(k=>r[k]!=null)))].sort();
          console.log('AUTHORITATIVE_FIELDS='+keys.join(','));
          console.log('PROVIDER_WRITES='+Number(x?.safety?.providerTradingWrites??0));
          console.log('EXECUTION_STATE_WRITES='+Number(x?.safety?.executionStateWrites??0));
          console.log('CAPITAL_MOVED_USD='+Number(x?.safety?.capitalMovedUsd??0));
          console.log('ORDERS_SUBMITTED='+Number(x?.safety?.ordersSubmitted??0));
          NODE
          echo 'ARM_DISARM=UNCHANGED'
          echo 'EXECUTION_LOGIC=UNCHANGED_EXCEPT_ADDITIVE_GET_READ_ROUTE'
