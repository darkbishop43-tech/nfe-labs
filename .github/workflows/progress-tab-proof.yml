name: Progress Tab Proof
on:
  push:
    branches: [market-edge-progress-tab]
    paths:
      - '.github/workflows/progress-tab-proof.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-progress-tab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution source
        run: sha256sum market-edge-lab/real/baseline/src/index.js | tee /tmp/before.sha
      - name: Apply cockpit include
        run: python3 market-edge-lab/real/baseline/apply-progress-include.py
      - name: Verify read-only boundary
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          test "$(git diff --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          grep -q '<script src="./progress-analytics.js"></script>' market-edge-lab/real/baseline/founder-terminal.html
          grep -q "method:'GET'" market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'SIGNAL QUALITY' market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'CAPTURE QUALITY' market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'MANAGEMENT QUALITY' market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'PROVIDER FINANCIAL HISTORY' market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'MARKET EDGE RUN-BY-RUN' market-edge-lab/real/baseline/progress-analytics.js
          grep -q 'DISTINCT SERIES IDs NEVER MERGED' market-edge-lab/real/baseline/progress-analytics.js
          ! grep -Eq "fetch\([^\n]*method:'POST'|fetch\([^\n]*method:\"POST\"" market-edge-lab/real/baseline/progress-analytics.js
      - name: JavaScript syntax check
        run: node --check market-edge-lab/real/baseline/progress-analytics.js
      - name: Commit cockpit include
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-edge-lab/real/baseline/founder-terminal.html
          test "$(git diff --cached --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          git commit -m 'Wire read-only progress analytics tab'
          git push origin HEAD:market-edge-progress-tab
