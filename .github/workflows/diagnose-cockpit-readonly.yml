name: Diagnose Cockpit Read Only Endpoints

on:
  push:
    branches: [founder-cockpit-phase2]
    paths:
      - '.github/workflows/diagnose-cockpit-readonly.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Probe detail endpoint statuses
        shell: bash
        run: |
          set -u
          C='https://market-edge-founder-cockpit.darkbishop43.workers.dev'
          curl -sS "$C/api/runtime" -o /tmp/r.json
          ASSET=$(python - <<'PY'
          import json
          r=json.load(open('/tmp/r.json'));print(r['shadow']['opportunities'][0]['asset'])
          PY
          )
          TICKER=$(python - <<'PY'
          import json
          r=json.load(open('/tmp/r.json'));print(r['shadow']['opportunities'][0]['marketTicker'])
          PY
          )
          echo "ASSET=$ASSET TICKER=$TICKER"
          n=0
          for url in "$C/api/ticker?asset=$ASSET" "$C/api/candles?asset=$ASSET&granularity=60" "$C/api/market?ticker=$TICKER" "$C/api/orderbook?ticker=$TICKER"; do
            n=$((n+1)); file="/tmp/d$n"
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url")
            echo "=== HTTP=$code URL=$url BYTES=$(wc -c < "$file")"
            cat "$file" | head -c 2500; echo
          done
