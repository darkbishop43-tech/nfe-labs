name: Deploy NO_FILL Forensic Read Only

on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/deploy-nofill-forensic-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
      - name: Install
        working-directory: market-edge-lab/real/baseline
        run: npm install --no-audit --no-fund
      - name: Deploy existing worker source
        working-directory: market-edge-lab/real/baseline
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Read forensic endpoint
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS 'https://market-edge-baseline-real.darkbishop43.workers.dev/execution-test-nofill-forensic' | python -m json.tool
