name: PAYNE Staircase Graph UI Offline
on:
  push:
    branches: [payne-staircase-graph-ui-isolated-20261015]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test graph with synthetic observations and existing regressions
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --check src/cockpit-html.js
          node --test test/staircase-graph-ui-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
