name: PAYNE NEAR authority forensic read only

on:
  push:
    branches:
      - payne-near-authority-forensic
    paths:
      - ".github/workflows/payne-near-authority-forensic.yml"

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read exact NEAR DOWN authority evidence
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl --max-time 20 -fsS "$base/evidence/events?limit=500" -o /tmp/events.json
          echo 'NEAR_DOWN_075_EVENTS='
          jq '[.events[]? | select((.asset=="NEAR" or ((.ticker // "")|startswith("KXNEAR15M"))) and (.direction=="DOWN" or .outcomeSide=="NO") and ((.score // 0) >= 0.745) and ((.score // 0) <= 0.755))]' /tmp/events.json
          echo 'NEAR_DOWN_FIRE_PLANS='
          jq '[.events[]? | select(.type=="ZERO_MONEY_FIRE_PLAN_RECORDED" and .asset=="NEAR" and .direction=="DOWN" and ((.score // 0) >= 0.745) and ((.score // 0) <= 0.755))]' /tmp/events.json
          echo 'PROVIDER_WRITES=0'
          echo 'ORDERS=0'
          echo 'CAPITAL_MOVED_USD=0'
