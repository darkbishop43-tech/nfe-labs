name: PAYNE Current Production Readback (GET Only)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: payne-current-production-readback
  cancel-in-progress: false
jobs:
  verify-traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read current PAYNE deployment and traffic (no writes)
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          umask 077
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          curl --fail --silent --show-error --max-time 25 \
            --request GET \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header "Accept: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/market-edge-payne-kalshi-real/deployments" \
            --output "$response"
          jq -e '
            .success == true
            and (.result.deployments | type == "array" and length > 0)
            and (.result.deployments[0].id | type == "string" and length > 0)
            and (.result.deployments[0].created_on | type == "string" and length > 0)
            and (.result.deployments[0].versions | type == "array" and length > 0)
            and all(.result.deployments[0].versions[];
              (.version_id | type == "string" and length > 0)
              and (.percentage | type == "number" and . >= 0 and . <= 100))
            and (([.result.deployments[0].versions[].percentage] | add) == 100)
          ' "$response" >/dev/null || {
            echo 'PAYNE_CURRENT_DEPLOYMENT_READBACK_INVALID'
            exit 1
          }
          jq -c '{
            deployment_id: .result.deployments[0].id,
            deployment_timestamp: .result.deployments[0].created_on,
            versions: [.result.deployments[0].versions[] | {
              version_id: .version_id,
              traffic_percentage: .percentage
            }]
          }' "$response"
          echo 'PAYNE_CURRENT_DEPLOYMENT_READBACK=PASS'
