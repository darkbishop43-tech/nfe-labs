name: PAYNE Coordinator Claims Read Only
on:
  workflow_dispatch:
  push:
    branches: [payne-direct-pull-fire-isolated-20261018, payne-ledger-bounded-history-v10-20261021]
    paths: [".github/workflows/payne-coordinator-claims-readonly.yml"]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read series claims diagnostic
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN: ${{ secrets.PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?MISSING}"
          : "${CLOUDFLARE_ACCOUNT_ID:?MISSING}"
          : "${PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN:?MISSING}"
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values"
          code="$(curl --silent --show-error --max-time 25 --output "$tmp/series.json" --write-out '%{http_code}' --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/payne-kalshi%3Areal-series%3Av1")"
          test "$code" = 200
          seriesId="$(jq -r '.seriesId' "$tmp/series.json")"
          echo "SERIES_ID=$seriesId"
          jq -c '{seriesId,status,attemptsStarted,positionTicker:(.position.marketTicker//null),positionStatus:(.position.status//null)}' "$tmp/series.json"
          url="https://market-edge-payne-kalshi-real.darkbishop43.workers.dev/internal/series-claims-diagnostic?seriesId=$(printf %s "$seriesId" | jq -sRr @uri)"
          code="$(curl --silent --show-error --max-time 25 --output "$tmp/claims.json" --write-out '%{http_code}' --header "x-payne-diagnostic-token: $PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN" "$url")"
          echo "CLAIMS_HTTP=$code"
          jq -c '{claims:[(.claims//[])[]|{kind,key,state,seriesId,attemptNo,clientOrderId}],activeClaims,unknownRecords}' "$tmp/claims.json"
          jq -c '{ok,complete,status,activeClaims,unknownRecords,reason,claimCount:(.claims//[]|length)}' "$tmp/claims.json" || cat "$tmp/claims.json"
          echo "READ_ONLY_CLAIMS_DIAGNOSTIC_COMPLETE"
          # Read existing authenticated exact current-attempt claim only; no writes.
          attemptNo="$(jq -r '.currentAttempt.providerAttemptNoCandidate // .currentAttempt.providerAttemptNo // .currentAttempt.attemptNo // empty' "$tmp/series.json")"
          echo "CLAIM_LOOKUP_ATTEMPT_NO=$attemptNo"
          echo "CURRENT_ATTEMPT_ID=$(jq -r '.currentAttempt.attemptId // ""' "$tmp/series.json")"
          echo "CURRENT_ATTEMPT_TICKER=$(jq -r '.currentAttempt.marketTicker // ""' "$tmp/series.json")"
          echo "CURRENT_ATTEMPT_ORDER=$(jq -r '.currentAttempt.providerOrderId // ""' "$tmp/series.json")"
          jq -c '{fireLatchState:(.fireLatch.state//null),fireLatchSpecimen:(.fireLatch.specimenId//null),fireLatchAttemptNo:(.fireLatch.attemptNo//null),unresolvedEntry,positionOwner:(.position.owner//null),positionStatus:(.position.status//null),positionOrder:(.position.entryOrderId//null),positionAttempt:(.position.attemptId//null)}' "$tmp/series.json"
          if [[ -n "$attemptNo" && "$attemptNo" != null ]]; then
            atomic="https://market-edge-payne-kalshi-real.darkbishop43.workers.dev/internal/atomic-claim-diagnostic?seriesId=$(printf %s "$seriesId" | jq -sRr @uri)&attemptNo=$(printf %s "$attemptNo" | jq -sRr @uri)"
            atomicCode="$(curl --silent --show-error --max-time 25 --output "$tmp/atomic.json" --write-out '%{http_code}' --header "x-payne-diagnostic-token: $PAYNE_COORDINATOR_DIAGNOSTIC_TOKEN" "$atomic")"
            echo "ATOMIC_CLAIM_HTTP=$atomicCode"
            jq -c '{ok,status,reason,exists,claim:(.claim//null)}' "$tmp/atomic.json" || true
          fi
          echo 'READ_ONLY_INTENT3_EVIDENCE_COMPLETE'
