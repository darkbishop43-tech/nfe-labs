name: Deploy PAYNE-KALSHI REAL disarmed execution capability

# Successor recovery validation trigger — presentation/validation only

# Baseline economic fill price normalization redeploy trigger

# Forensic timing normalization redeploy trigger

# Forensic-only redeploy trigger: PAYNE WOULD-FIRE analysis

# Presentation-only redeploy trigger: final master clock / icon polish

on:
  push:
    branches:
      - market-edge-payne-kalshi-real-step1
    paths:
      - ".github/workflows/deploy-payne-kalshi-real-zero-money.yml"
      - ".github/scripts/payne-kv-deployment-safety.sh"
      - "market-edge-lab/real/payne-kalshi-real/src/**"
      - "market-edge-lab/real/payne-kalshi-real/test/**"
      - "market-edge-lab/real/payne-kalshi-real/wrangler.toml"
      - "market-edge-lab/real/payne-kalshi-real/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-payne-kalshi-real-zero-money
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/payne-kalshi-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check PAYNE cockpit JavaScript syntax before tests
        run: node --check src/cockpit-html.js

      - name: Re-run complete zero-money suite before deploy
        run: npm test

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Pre-deploy PAYNE live safety gate (authoritative Cloudflare KV GET only)
        working-directory: .
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bash .github/scripts/payne-kv-deployment-safety.sh pre
          date -u +%s%3N > /tmp/payne-preflight-ms

      - name: Deploy PAYNE Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy | tee /tmp/payne-deploy.txt

      - name: Verify persisted PAYNE safety, scheduler and feature collection (Cloudflare KV GET)
        working-directory: .
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Same authoritative persisted PAYNE control/series gate, with post-deploy
          # equality assertions. Never call the timed-out public Worker hostname.
          bash .github/scripts/payne-kv-deployment-safety.sh post
          deployed_ms="$(date -u +%s%3N)"
          resumed=0
          for i in $(seq 1 24); do
            bash .github/scripts/payne-kv-deployment-safety.sh post
            scan_at="$(jq -r '.at' /tmp/payne-kv-gate/current.json)"
            scan_ms="$(date -u -d "$scan_at" +%s%3N)"
            if [[ "$scan_ms" -gt "$deployed_ms" ]]; then resumed=1; break; fi
            sleep 10
          done
          test "$resumed" = 1 || { echo 'BLOCKED: SCHEDULED_CRON_NOT_VERIFIED_AFTER_DEPLOY'; exit 1; }
          # Existing persisted feature source, read-only through the same
          # approved KV namespace. Missing market data remains unavailable.
          source_key="$(jq -nr --arg v 'payne-kalshi:feature-shadow:v2-paper-brain' '$v|@uri')"
          kv_url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values/$source_key"
          curl --fail --silent --show-error --max-time 25 --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv_url" -o /tmp/payne-feature-state.json
          jq -e '
            .featureState.source=="PAYNE_PAPER_BRAIN_ON_KALSHI_REALITY" and
            .featureState.transport=="PAYNE_KALSHI_READ" and
            .featureState.spotTransport=="PAYNE_DIRECT_SPOT_READ" and
            .featureState.baselineStateRead==false and
            .featureState.providerWrites==0 and
            .featureState.orders==0 and .featureState.capitalMovedUsd==0
          ' /tmp/payne-feature-state.json >/dev/null || { echo 'BLOCKED: AUTHORITATIVE_FEATURE_SOURCE_INVALID';exit 1; }
          jq -c '{source:.featureState.source,observedAt:.featureState.calculationAt,coveredAssets:(.featureState.opportunities|map(.asset)|unique),spotFailures:.featureState.spotReadFailures}' /tmp/payne-feature-state.json
          echo 'PAYNE_POSTDEPLOY_CLOUDFLARE_KV_SAFETY_PASS'
          grep 'Current Version ID:' /tmp/payne-deploy.txt || true
