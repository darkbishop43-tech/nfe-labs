name: Deploy PAYNE-KALSHI REAL disarmed execution capability

# Successor recovery validation trigger — presentation/validation only

# Baseline economic fill price normalization redeploy trigger

# Forensic timing normalization redeploy trigger

# Forensic-only redeploy trigger: PAYNE WOULD-FIRE analysis

# Presentation-only redeploy trigger: final master clock / icon polish

on:
  push:
    branches:
      - market-edge-payne-kalshi-real-step1
    paths:
      - ".github/workflows/deploy-payne-kalshi-real-zero-money.yml"
      - "market-edge-lab/real/payne-kalshi-real/src/**"
      - "market-edge-lab/real/payne-kalshi-real/test/**"
      - "market-edge-lab/real/payne-kalshi-real/wrangler.toml"
      - "market-edge-lab/real/payne-kalshi-real/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-payne-kalshi-real-zero-money
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/payne-kalshi-real
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Re-run complete zero-money suite before deploy
        run: npm test

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Deploy PAYNE Worker only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy | tee /tmp/payne-deploy.txt

      - name: Verify live disarmed Payne real capability
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'

          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/status.json -w '%{http_code}' "$base/status" || true)
            [ "$code" = "200" ] && break
            sleep 5
          done
          test "$code" = "200"

          curl -fsS "$base/real-state" -o /tmp/real-state.json
          curl -fsS "$base/ui-state" -o /tmp/ui-state.json
          curl -fsS "$base/cockpit-data" -o /tmp/cockpit.json
          curl -fsS "$base/" -o /tmp/cockpit.html

          curl -fsS "https://market-edge-baseline-real.darkbishop43.workers.dev/founder-capital-ledger" -o /tmp/capital-ledger.json
          echo "PRE_MOVE_PROVIDER_BALANCES="
          jq '{readOnly,state,provider:{cashUsd:.provider.cashUsd,balanceBreakdown:.provider.balanceBreakdown},safety}' /tmp/capital-ledger.json

          echo "LIVE_SHARD_AUDIT="
          jq '{
            observedAt:.updatedAt,
            requiredFundingIndex:.control.requiredExchangeIndex,
            fundingBalanceUsd:.index2.balance,
            markets:[.markets[]|{
              asset,ticker,status,exchangeIndex,timeRemainingMs,
              executionEligible,
              eligibleApartFromShard:(.executionEligible==true and (.ticker|length)>0 and (.timeRemainingMs>390000))
            }],
            shardCounts:{
              index0:([.markets[]|select(.exchangeIndex==0)]|length),
              index1:([.markets[]|select(.exchangeIndex==1)]|length),
              index2:([.markets[]|select(.exchangeIndex==2)]|length),
              index3:([.markets[]|select(.exchangeIndex==3)]|length),
              otherOrNull:([.markets[]|select((.exchangeIndex!=0) and (.exchangeIndex!=1) and (.exchangeIndex!=2) and (.exchangeIndex!=3))]|length)
            },
            index2Assets:[.markets[]|select(.exchangeIndex==2)|.asset]
          }' /tmp/cockpit.json

          echo "LIVE_UI_STATE_SAFE="
          jq '{schema,uiPollAuthority,providerGets,providerWrites,orders,capitalMovedUsd,control,realExecution:{schema:.realExecution.schema,seriesId:.realExecution.seriesId,armed:.realExecution.armed,attempted:.realExecution.attempted,target:.realExecution.target,remaining:.realExecution.remaining,filled:.realExecution.filled,noFill:.realExecution.noFill,unknown:.realExecution.unknown,status:.realExecution.status,rawSeriesStatus:.realExecution.rawSeriesStatus,unresolvedEntry:.realExecution.unresolvedEntry,ownedPositions:.realExecution.ownedPositions,lastAttempt:.realExecution.lastAttempt,latestLedgerEvent:.realExecution.latestLedgerEvent}}' /tmp/ui-state.json

          echo "LIVE_REAL_STATE_SAFE="
          jq '{schema,control:{armed:.control.armed,attempts:.control.attempts,attemptTarget:.control.attemptTarget,maxEntryDebitUsd:.control.maxEntryDebitUsd,activeThreshold:.control.activeThreshold,requiredExchangeIndex:.control.requiredExchangeIndex,providerWriteAuthority:.control.providerWriteAuthority,realExecution:.control.realExecution},series:{seriesId:.series.seriesId,status:.series.status,attemptsStarted:.series.attemptsStarted,attemptTarget:.series.attemptTarget,maxEntryDebitUsd:.series.maxEntryDebitUsd,threshold:.series.threshold,requiredExchangeIndex:.series.requiredExchangeIndex,unresolvedEntry:.series.unresolvedEntry,positionStatus:.series.position.status},providerWrites,ordersSubmittedByThisRead,capitalMovedUsd}' /tmp/real-state.json

          jq -e '
            .schema == "PAYNE_FAST_UI_STATE_V1" and
            .uiPollAuthority == "PERSISTED_STATE_ONLY" and
            .providerGets == 0 and
            .providerWrites == 0 and
            .orders == 0 and
            .capitalMovedUsd == 0 and
            .control.armed == false and
            .realExecution.schema == "PAYNE_REAL_OBSERVABILITY_V1" and
            .realExecution.armed == false and
            (.realExecution.attempted >= 0) and
            (.realExecution.remaining >= 0) and
            (.realExecution.filled >= 0) and
            (.realExecution.noFill >= 0) and
            (.realExecution.unknown >= 0)
          ' /tmp/ui-state.json >/dev/null

          grep -q 'CURRENT RUN' /tmp/cockpit.html
          grep -q 'LAST ATTEMPT' /tmp/cockpit.html
          grep -q 'BASELINE AGE' /tmp/cockpit.html
          grep -q 'LAST UI UPDATE' /tmp/cockpit.html
          grep -q 'setInterval(loadFastState,5000)' /tmp/cockpit.html
          grep -q 'setInterval(load,60000)' /tmp/cockpit.html
          grep -q 'PRE-SUBMIT LATCHED' /tmp/cockpit.html
          grep -q 'FILLED / MANAGING' /tmp/cockpit.html
          grep -q 'NO_PROVIDER_ATTEMPT' /tmp/cockpit.html
          grep -q "BTC:'<svg" /tmp/cockpit.html
          grep -q "NEAR:'<svg" /tmp/cockpit.html

          jq -e '
            .schema == "PAYNE_REAL_STATE_V1" and
            .control.armed == false and
            ([1,5,10,30] | index(.control.attemptTarget)) != null and
            .control.maxEntryDebitUsd == 1 and
            .control.activeThreshold == 0.70 and
            .control.requiredExchangeIndex == 2 and
            .control.providerWriteAuthority == "BUILT_INACTIVE_DISARMED" and
            .control.realExecution == "BUILT_INACTIVE_DISARMED" and
            .series.attemptTarget == 1 and
            .series.maxEntryDebitUsd == 1 and
            .series.threshold == 0.70 and
            .series.requiredExchangeIndex == 2 and
            .writeContract.requiredExchangeIndex == 2 and
            .providerWrites == 0 and
            .ordersSubmittedByThisRead == 0 and
            .capitalMovedUsd == 0
          ' /tmp/real-state.json >/dev/null

          jq -e '
            .providerWrites == 0 and
            .orders == 0 and
            .capitalMovedUsd == 0 and
            .safety.payneArmed == false and
            .safety.realExecution == "BUILT_INACTIVE_DISARMED" and
            .safety.fundingAuthority == "INDEX2_ONLY_INACTIVE_DISARMED" and
            .safety.providerPost == "BUILT_INACTIVE_DISARMED" and
            .safety.zeroMoneyProviderPost == "HARD_DISABLED" and
            .safety.secondIoc == "HOLD" and
            .featureProvenance.transport == "SERVICE_BINDING" and
            .featureProvenance.binding == "BASELINE_REAL_READ" and
            .clocks.consistency.standard == "NFE_OS_UNIVERSAL_MARKET_CLOCK_V1"
          ' /tmp/cockpit.json >/dev/null

          # A browser refresh may legitimately land between Baseline observations.
          # Require the binding itself to be live now, then prove authentic features
          # from an unattended persisted SCHEDULED_CRON observation.
          jq -e '
            .featureProvenance.source == "BASELINE_REAL_SERVICE_BINDING_READ_ONLY" and
            .featureProvenance.transport == "SERVICE_BINDING" and
            .featureProvenance.binding == "BASELINE_REAL_READ" and
            .featureProvenance.httpStatus == 200
          ' /tmp/cockpit.json >/dev/null

          scheduled=0
          for i in $(seq 1 24); do
            curl -fsS "$base/evidence/latest" -o /tmp/latest.json || true
            if jq -e '
              .source == "SCHEDULED_CRON" and
              .providerWrites == 0 and
              .orders == 0 and
              .capitalMovedUsd == 0 and
              .selected.payne.source == "BASELINE_REAL_SERVICE_BINDING_READ_ONLY" and
              (.selected.payne.move != null) and
              (.selected.payne.fair != null) and
              (.selected.payne.edge != null) and
              (.selected.payne.score != null) and
              (.selected.payne.state != "UNKNOWN") and
              .clocks.consistency.standard == "NFE_OS_UNIVERSAL_MARKET_CLOCK_V1"
            ' /tmp/latest.json >/dev/null 2>&1; then scheduled=1; break; fi
            sleep 5
          done
          test "$scheduled" = "1"

          curl -fsS "$base/export?range=current&format=json" -o /tmp/export.json
          jq -e '
            .schema == "PAYNE_KALSHI_EXPORT_V1" and
            .providerWrites == 0 and
            .orders == 0 and
            .capitalMovedUsd == 0 and
            (.eventCount >= 0) and
            (.events | type == "array")
          ' /tmp/export.json >/dev/null

          curl -fsS "$base/export?range=current&format=csv" -o /tmp/export.csv
          grep -q 'observationAt,scanSource,asset,direction,outcomeSide,ticker' /tmp/export.csv

          curl -fsS "$base/evidence/events?limit=200" -o /tmp/events.json
          jq -e '
            .schema == "PAYNE_RESEARCH_EVENT_LEDGER_V1" and
            .providerWrites == 0 and
            .orders == 0 and
            .capitalMovedUsd == 0 and
            (.events | type == "array")
          ' /tmp/events.json >/dev/null

          echo "LIVE_STATUS=GREEN_REAL_CAPABILITY_DISARMED"
          echo "FEATURE_HTTP=$(jq -r '.featureProvenance.httpStatus' /tmp/cockpit.json)"
          echo "PAYNE_STATE=$(jq -r '.payne.state' /tmp/cockpit.json)"
          echo "WINDOW_CONSISTENCY=$(jq -r '.clocks.consistency.windowConsistency' /tmp/cockpit.json)"
          echo "BASELINE_ACTUAL_LANE=$(jq -r '.comparison.baselineReal.lane' /tmp/cockpit.json)"
          echo "PAYNE_PAPER_STATUS=$(jq -r '.comparison.paynePaper.reason' /tmp/cockpit.json)"
          echo "SCHEDULED_SOURCE=$(jq -r '.source' /tmp/latest.json)"
          echo "PAYNE_REAL_ARMED=$(jq -r '.control.armed' /tmp/real-state.json)"
          echo "PAYNE_ATTEMPTS=$(jq -r '(.control.attempts|tostring) + "/" + (.control.attemptTarget|tostring)' /tmp/real-state.json)"
          echo "PAYNE_SERIES_ATTEMPTS_STARTED=$(jq -r '.series.attemptsStarted' /tmp/real-state.json)"
          echo "PAYNE_SERIES_STATUS=$(jq -r '.series.status' /tmp/real-state.json)"
          echo "PAYNE_INDEX=$(jq -r '.control.requiredExchangeIndex' /tmp/real-state.json)"
          echo "FAST_UI_AUTHORITY=$(jq -r '.uiPollAuthority' /tmp/ui-state.json)"
          echo "FAST_UI_PROVIDER_GETS=$(jq -r '.providerGets' /tmp/ui-state.json)"
          echo "CURRENT_RUN_STATUS=$(jq -r '.realExecution.status' /tmp/ui-state.json)"
          echo "CURRENT_RUN_ATTEMPTED=$(jq -r '.realExecution.attempted' /tmp/ui-state.json)"
          echo "CURRENT_RUN_NO_FILL=$(jq -r '.realExecution.noFill' /tmp/ui-state.json)"
          echo "CURRENT_RUN_FILLED=$(jq -r '.realExecution.filled' /tmp/ui-state.json)"
          echo "CURRENT_RUN_UNKNOWN=$(jq -r '.realExecution.unknown' /tmp/ui-state.json)"
          echo "providerWrites=0"
          echo "orders=0"
          echo "capitalMovedUsd=0"
