name: Deploy Hold Observer Observability
on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/deploy-hold-observer-observability.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
          fetch-depth: 4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Freeze production execution source and apply observability-only patch
        run: |
          set -euo pipefail
          git hash-object market-edge-lab/real/baseline/src/index.js > /tmp/baseline.sha
          python - <<'PY'
          from pathlib import Path
          p=Path('market-edge-lab/real/hold-observer/src/index.js')
          s=p.read_text()
          old="function entryFill(history,p){const oid=String(p?.entryOrderId||'');const fs=providerFills(history).filter(f=>tickerOf(f)===tickerOf(p));return fs.find(f=>oid&&String(f?.orderId||f?.order_id||'')===oid)||fs.sort((a,b)=>(ms(a?.createdAt||a?.created_time)||0)-(ms(b?.createdAt||b?.created_time)||0))[0]||null}"
          new="function entryFill(history,p){const oid=String(p?.entryOrderId||'');if(!oid)return null;return providerFills(history).find(f=>tickerOf(f)===tickerOf(p)&&String(f?.orderId||f?.order_id||'')===oid)||null}"
          if old in s:p.write_text(s.replace(old,new,1))
          elif new not in s:raise SystemExit('ENTRY_FILL_ANCHOR_MISSING')
          PY
          python market-edge-lab/real/hold-observer/patch-cockpit.py
          test "$(git hash-object market-edge-lab/real/baseline/src/index.js)" = "$(cat /tmp/baseline.sha)"
          echo 'PRODUCTION_EXECUTION_SOURCE_UNCHANGED=YES'
      - name: Repeat zero-money proof after cockpit/source hardening
        run: |
          set -euo pipefail
          node market-edge-lab/real/hold-observer/test.mjs | tee /tmp/proof.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';const x=JSON.parse(fs.readFileSync('/tmp/proof.json','utf8').trim().split('\n').at(-1));
          for(const k of ['livePositionPanelModel','defaultFiveMinutes','entryCheckpoint','checkpoint5m','checkpoint5m30','checkpoint6m','postExitObservationModel','actualExitRetention','settlementRetention'])if(x[k]!=='PASS')throw new Error(k+'_FAIL');
          if(x.realDeadlineMutation||x.providerTradingWrites||x.executionStateWrites||x.capitalMovedUsd||x.ordersSubmitted)throw new Error('ZERO_AUTHORITY_FAIL');
          console.log('ZERO_MONEY_OBSERVABILITY=GREEN');
          NODE
      - name: Verify cockpit controls are display-only
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          h=Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          assert 'id="holdObsPanel"' in h
          assert 'market-edge-hold-observer.darkbishop43.workers.dev/current' in h
          assert 'FOUNDER HOLD EXTENSIONS — NOT YET ACTIVE' in h
          assert '<button disabled>+30 SEC</button>' in h
          assert '<button disabled>+1 MIN</button>' in h
          assert '<button disabled>+5 MIN</button>' in h
          assert '<button disabled>HOLD TO CLOSE</button>' in h
          src=Path('market-edge-lab/real/hold-observer/src/index.js').read_text()
          for bad in ['execution-test-arm','execution-test-disarm','kalshiExecutionPost','kalshiExecutionDelete','saveExecutionTestState','saveRealTradeState']:
              assert bad not in src,bad
          assert "if(request.method!=='GET')" in src
          assert 'holdExtensionMutationEnabled:false' in src
          assert 'realDeadlineMutation:0' in src
          print('HOLD_BUTTONS_VISIBLE_DISABLED=YES')
          print('REAL_DEADLINE_MUTATION=0')
          print('ARM_DISARM_UNCHANGED=YES')
          PY
      - name: Commit cockpit and strict observer source only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-edge-lab/real/hold-observer/src/index.js market-edge-lab/real/baseline/founder-terminal.html
          if git diff --cached --quiet; then echo 'ALREADY_APPLIED=YES'; else git commit -m 'Activate hold observability and checkpoint display'; git push origin HEAD:market-edge-baseline-real; fi
      - name: Create or reuse isolated evidence KV namespace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          title='market-edge-hold-observer-evidence'
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces?per_page=100" > /tmp/ns.json
          id=$(jq -r --arg t "$title" '.result[]|select(.title==$t)|.id' /tmp/ns.json | head -1)
          if [ -z "$id" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "{\"title\":\"$title\"}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" > /tmp/create.json
            id=$(jq -r '.result.id' /tmp/create.json)
          fi
          test -n "$id" && test "$id" != null
          echo "HOLD_KV_ID=$id" >> "$GITHUB_ENV"
          echo 'ISOLATED_EVIDENCE_KV=READY'
      - name: Generate isolated Worker config
        run: |
          cat > market-edge-lab/real/hold-observer/wrangler.toml <<EOF
          name = "market-edge-hold-observer"
          main = "src/index.js"
          compatibility_date = "2026-09-27"
          workers_dev = true

          [[services]]
          binding = "READ"
          service = "market-edge-founder-read"

          [[kv_namespaces]]
          binding = "HOLD_EVIDENCE"
          id = "$HOLD_KV_ID"

          [[durable_objects.bindings]]
          name = "HOLD_TIMER"
          class_name = "HoldTimer"

          [[migrations]]
          tag = "v1"
          new_sqlite_classes = ["HoldTimer"]

          [triggers]
          crons = ["* * * * *"]
          EOF
      - name: Deploy isolated hold observer
        working-directory: market-edge-lab/real/hold-observer
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee /tmp/deploy.txt
      - name: Verify live read-only observer and scheduled snapshot
        run: |
          set -euo pipefail
          base='https://market-edge-hold-observer.darkbishop43.workers.dev'
          code=000
          for i in $(seq 1 20); do code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$base/health" || true); [ "$code" = 200 ] && break; sleep 3; done
          test "$code" = 200
          post=$(curl -sS -o /tmp/post.json -w '%{http_code}' -X POST "$base/current" || true)
          test "$post" = 405
          current=000
          for i in $(seq 1 28); do current=$(curl -sS -o /tmp/current.json -w '%{http_code}' "$base/current" || true); if [ "$current" = 200 ] && jq -e '.updatedAt != null' /tmp/current.json >/dev/null; then break; fi; sleep 3; done
          test "$current" = 200
          jq -e '.safety.realDeadlineMutation == 0 and .safety.providerTradingWrites == 0 and .safety.executionStateWrites == 0 and .safety.capitalMovedUsd == 0 and .safety.ordersSubmitted == 0 and .safety.defaultHoldMs == 300000 and .safety.exitScore == 0.20' /tmp/current.json >/dev/null
          echo "LIVE_POSITIONS=$(jq '.positions|length' /tmp/current.json)"
          echo "OBSERVER_UPDATED_AT=$(jq -r '.updatedAt' /tmp/current.json)"
          echo 'REAL_DEADLINE_MUTATION=0'
          echo 'PROVIDER_WRITES=0'
          echo 'EXECUTION_STATE_WRITES=0'
          echo 'CAPITAL_MOVED_USD=0'
          echo 'ORDERS_SUBMITTED=0'
          echo 'DEFAULT_5_MINUTE=UNCHANGED'
          echo 'EXIT_SCORE=.20_UNCHANGED'
          echo 'ARM_DISARM=UNCHANGED'
