name: Provider Ledger Archive Read Only

on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/provider-ledger-archive-readonly.yml'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: provider-ledger-archive-readonly
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Capture GET-only provider accounting evidence
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-founder-read.darkbishop43.workers.dev'
          curl --fail --silent --show-error "$base/health" -o /tmp/provider-health.json
          curl --fail --silent --show-error "$base/forensic-provider-history?limit=200" -o /tmp/provider-history.json
          curl --fail --silent --show-error "$base/founder-capital-ledger" -o /tmp/founder-capital.json

      - name: Validate zero-authority read contract and persist raw snapshots
        shell: python
        run: |
          import hashlib, json
          from decimal import Decimal, InvalidOperation
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          raw_path=Path('/tmp/provider-history.json')
          raw=raw_path.read_bytes()
          data=json.loads(raw)
          health=json.loads(Path('/tmp/provider-health.json').read_text())
          capital=json.loads(Path('/tmp/founder-capital.json').read_text())

          if health.get('writes') not in (0, None):
              raise SystemExit('READ_BRIDGE_WRITES_NONZERO')
          if data.get('readOnly') is not True:
              raise SystemExit('PROVIDER_HISTORY_NOT_READ_ONLY')
          safety=data.get('safety') or {}
          required={
              'providerTradingWrites':0,
              'executionStateWrites':0,
              'capitalMovedUsd':0,
              'ordersSubmitted':0,
          }
          for key, expected in required.items():
              if safety.get(key) != expected:
                  raise SystemExit(f'SAFETY_CONTRACT_FAIL_{key}={safety.get(key)!r}')

          now=datetime.now(timezone.utc)
          et=now.astimezone(ZoneInfo('America/New_York'))
          day=et.strftime('%Y-%m-%d')
          stamp=now.strftime('%Y%m%dT%H%M%SZ')
          root=Path('market-edge-lab/real/provider-history/archive')/day
          root.mkdir(parents=True, exist_ok=True)

          # Preserve every live provider-history response byte-for-byte.
          snapshot=root/f'provider-history-{stamp}.json'
          snapshot.write_bytes(raw)
          (root/f'founder-capital-{stamp}.json').write_text(json.dumps(capital,indent=2,sort_keys=True)+'\n')

          def row_ts(row):
              value=row.get('createdAt') or row.get('settledTime') or row.get('created_time') or row.get('created_at') or row.get('timestamp')
              if value is None:
                  return None
              try:
                  if isinstance(value,(int,float)):
                      n=float(value)
                      return datetime.fromtimestamp(n/1000 if n>1e12 else n,tz=timezone.utc)
                  return datetime.fromisoformat(str(value).replace('Z','+00:00'))
              except Exception:
                  return None

          def stable_identity(row):
              typ=str(row.get('recordType') or '').upper()
              raw=row.get('providerRaw') if isinstance(row.get('providerRaw'),dict) else {}
              if typ == 'FILL':
                  fid=row.get('fillId') or raw.get('fill_id') or row.get('tradeId') or raw.get('trade_id')
                  if fid:
                      return 'FILL|'+str(fid)
              if typ == 'SETTLEMENT':
                  ticker=row.get('ticker') or raw.get('ticker')
                  settled=row.get('settledTime') or raw.get('settled_time')
                  result=row.get('marketResult') or raw.get('market_result')
                  if ticker and settled:
                      return f'SETTLEMENT|{ticker}|{settled}|{result or ""}'
              # Last-resort identity is stable across projection enrichment because providerRaw is excluded.
              base={k:v for k,v in row.items() if k not in ('providerRaw','evidenceHash','providerIdentity','firstSeenSnapshot')}
              return 'FALLBACK|'+hashlib.sha256(json.dumps(base,sort_keys=True,separators=(',',':')).encode()).hexdigest()

          def richness(row):
              raw=row.get('providerRaw') if isinstance(row.get('providerRaw'),dict) else {}
              return (1 if raw else 0, len(raw), len(json.dumps(row,sort_keys=True)))

          # Build a non-destructive daily index from all preserved snapshots.
          # Raw snapshots are NEVER deduplicated. The index collapses only records with
          # the same stable provider identity and keeps the richest observed projection.
          unique={}
          source_count=0
          for snap in sorted(root.glob('provider-history-*.json')):
              try:
                  body=json.loads(snap.read_text())
              except Exception:
                  continue
              rows=body.get('providerRows') if isinstance(body.get('providerRows'),list) else []
              for row in rows:
                  ts=row_ts(row)
                  if ts is None or ts.astimezone(ZoneInfo('America/New_York')).strftime('%Y-%m-%d') != day:
                      continue
                  source_count += 1
                  key=stable_identity(row)
                  candidate={**row,'providerIdentity':key,'firstSeenSnapshot':snap.name}
                  prior=unique.get(key)
                  if prior is None or richness(candidate) > richness(prior):
                      if prior is not None:
                          candidate['firstSeenSnapshot']=prior.get('firstSeenSnapshot',snap.name)
                      unique[key]=candidate

          rows=list(unique.values())
          rows.sort(key=lambda r: str(r.get('createdAt') or r.get('settledTime') or ''))
          times=[row_ts(r) for r in rows]
          times=[t for t in times if t is not None]

          # Fees are surfaced descriptively, with fill and settlement fee fields kept
          # separate to avoid silently double-counting two provider accounting concepts.
          def dec(v):
              try: return Decimal(str(v))
              except (InvalidOperation,ValueError,TypeError): return Decimal('0')
          fill_fee=sum((dec((r.get('providerRaw') or {}).get('fee_cost',r.get('feeCost'))) for r in rows if r.get('recordType')=='FILL'),Decimal('0'))
          settlement_fee=sum((dec((r.get('providerRaw') or {}).get('fee_cost',r.get('feeCost'))) for r in rows if r.get('recordType')=='SETTLEMENT'),Decimal('0'))

          manifest={
              'dateET':day,
              'timezone':'America/New_York',
              'generatedAt':now.isoformat().replace('+00:00','Z'),
              'source':'GET /forensic-provider-history?limit=200 via Founder read bridge',
              'rawSnapshotsPreserved':len(list(root.glob('provider-history-*.json'))),
              'rawRowsObservedAcrossSnapshots':source_count,
              'uniqueProviderRowsByStableIdentity':len(rows),
              'groupedLifecycles':'UNKNOWN',
              'earliestProviderRowET':min(times).astimezone(ZoneInfo('America/New_York')).isoformat() if times else None,
              'latestProviderRowET':max(times).astimezone(ZoneInfo('America/New_York')).isoformat() if times else None,
              'descriptiveFees':{
                  'fillFeeCostUsd':str(fill_fee),
                  'settlementFeeCostUsd':str(settlement_fee),
                  'combinedNotReportedBecausePotentialOverlap':True
              },
              'netRealizedPnlUsd':None,
              'netRealizedPnlStatus':'UNKNOWN_UNTIL_DETERMINISTIC_FILL_SETTLEMENT_LIFECYCLE_ACCOUNTING',
              'providerRows':rows,
              'safety':{
                  'providerWrites':0,
                  'executionStateWrites':0,
                  'capitalMovedUsd':0,
                  'ordersSubmitted':0,
                  'ordersCancelled':0,
                  'positionsClosed':0,
              }
          }
          (root/'daily-provider-ledger.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          print('ARCHIVE_DATE_ET='+day)
          print('RAW_SNAPSHOT='+str(snapshot))
          print('RAW_ROWS_CURRENT_RESPONSE='+str(len(data.get('providerRows') or [])))
          print('UNIQUE_PROVIDER_ROWS_TODAY='+str(len(rows)))
          print('EARLIEST_PROVIDER_ROW_ET='+str(manifest['earliestProviderRowET']))
          print('LATEST_PROVIDER_ROW_ET='+str(manifest['latestProviderRowET']))
          print('FILL_FEE_COST_USD='+str(fill_fee))
          print('SETTLEMENT_FEE_COST_USD='+str(settlement_fee))
          print('NET_REALIZED_PNL=UNKNOWN_UNTIL_DETERMINISTIC_LIFECYCLE_ACCOUNTING')
          print('PROVIDER_WRITES=0')
          print('EXECUTION_STATE_WRITES=0')
          print('CAPITAL_MOVED_USD=0')
          print('ORDERS_SUBMITTED=0')
          print('ORDERS_CANCELLED=0')
          print('POSITIONS_CLOSED=0')

      - name: Commit observability archive only
        shell: bash
        run: |
          set -euo pipefail
          git add market-edge-lab/real/provider-history/archive
          if git diff --cached --quiet; then
            echo 'ARCHIVE_CHANGE=NONE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Archive read-only provider ledger snapshot"
          git push origin HEAD:market-edge-baseline-real

      - name: Prove execution source untouched
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code HEAD~1 -- market-edge-lab/real/baseline/src/index.js
          git diff --exit-code HEAD~1 -- market-edge-lab/real/baseline/wrangler.toml
          echo 'EXECUTION_LOGIC_CHANGED=NO'
          echo 'SECOND_IOC=HOLD'
