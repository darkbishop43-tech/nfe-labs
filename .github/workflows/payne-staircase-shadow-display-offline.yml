name: PAYNE Staircase Shadow Display Offline
on:
  push:
    branches: [payne-staircase-shadow-display-isolated-20261015]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test staircase and protected PAYNE regression
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --check src/cockpit-html.js
          node --test test/staircase-shadow-display-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
