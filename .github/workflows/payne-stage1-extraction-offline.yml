name: PAYNE Stage 1 Extraction Offline Tests
on:
  push:
    branches: [payne-profit-intelligence-stage1-extraction-isolated-20261016]
    paths:
      - ".github/scripts/payne-stage1-extract.mjs"
      - ".github/scripts/test/payne-stage1-extract.test.mjs"
      - ".github/workflows/payne-stage1-extraction-offline.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate extractor syntax and mocked pagination
        run: |
          node --check .github/scripts/payne-stage1-extract.mjs
          node --test .github/scripts/test/payne-stage1-extract.test.mjs
          node --test market-edge-lab/real/payne-kalshi-real/test/payne-provider-history-enrichment.test.mjs
          node --test market-edge-lab/real/payne-kalshi-real/test/disarm-accountability-v1.test.mjs market-edge-lab/real/payne-kalshi-real/test/disarm-accountability-runtime.test.mjs
      - name: Preserve disarm audit source behavior
        run: |
          grep -Fq 'PAYNE_ARM_TRANSITION_V1' .github/workflows/payne-disarm-ledger-read-only.yml
          grep -Fq 'c0c78742-2819-49e1-9025-ec0d67013aed' .github/workflows/payne-disarm-ledger-read-only.yml
          grep -Fq 'No credentials, no POST' .github/scripts/payne-stage1-extract.mjs
          ! grep -Eiq 'method:.*(POST|PUT|PATCH|DELETE)' .github/scripts/payne-stage1-extract.mjs
