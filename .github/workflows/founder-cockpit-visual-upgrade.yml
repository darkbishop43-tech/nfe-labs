name: Founder Cockpit Visual Upgrade
on:
  push:
    branches:
      - market-edge-founder-hold-live
    paths:
      - .github/workflows/founder-cockpit-visual-upgrade.yml
      - market-edge-lab/real/baseline/founder-terminal-upgrade.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-upgrade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-founder-hold-live
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution source
        shell: bash
        run: |
          set -euo pipefail
          sha256sum market-edge-lab/real/baseline/src/index.js | tee /tmp/execution-before.sha
      - name: Apply presentation-only upgrade
        shell: bash
        run: |
          set -euo pipefail
          python3 market-edge-lab/real/baseline/founder-terminal-upgrade.py
      - name: Verify visual boundary and controls
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/execution-before.sha
          test -z "$(git diff --name-only -- market-edge-lab/real/baseline/src/index.js)"
          test "$(git diff --name-only | grep -v '^market-edge-lab/real/baseline/founder-terminal.html$' | wc -l)" -eq 0
          f=market-edge-lab/real/baseline/founder-terminal.html
          grep -q 'FOUNDER VISUAL TOOLS · NOT USED BY AUTO' "$f"
          grep -q 'data-tf="1m"' "$f"
          grep -q 'data-tf="5m"' "$f"
          grep -q 'data-tf="15m"' "$f"
          grep -q 'data-tf="1h"' "$f"
          grep -q 'EMA 9' "$f"
          grep -q 'EMA 12' "$f"
          grep -q 'EMA 26' "$f"
          grep -q 'EMA 200' "$f"
          grep -q 'CANDLES' "$f"
          grep -q 'nfeFounderWatchWidth' "$f"
          grep -q 'nfeFounderInspectorWidth' "$f"
          grep -q 'nfeFounderWorkspaceHeight' "$f"
          grep -q '<button disabled>+30 SEC</button>' "$f"
          grep -q '<button disabled>+1 MIN</button>' "$f"
          grep -q '<button disabled>+5 MIN</button>' "$f"
          grep -q '<button disabled>HOLD TO CLOSE</button>' "$f"
      - name: Syntax check inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('market-edge-lab/real/baseline/founder-terminal.html','utf8');
          const scripts=[...s.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(x=>x[1]);
          for(const [i,x] of scripts.entries()){
            try{new Function(x)}catch(e){console.error('INLINE_SCRIPT_SYNTAX_FAIL',i,e.message);process.exit(1)}
          }
          console.log('INLINE_SCRIPT_SYNTAX=PASS',scripts.length);
          NODE
      - name: Commit cockpit-only change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-edge-lab/real/baseline/founder-terminal.html
          if git diff --cached --quiet; then
            echo NO_CHANGE
            exit 0
          fi
          git commit -m 'Upgrade Founder cockpit chart and layout visuals'
          git push origin HEAD:market-edge-founder-hold-live
