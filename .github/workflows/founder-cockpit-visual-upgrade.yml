name: Founder Cockpit Visual Upgrade
on:
  push:
    branches: [market-edge-founder-hold-live]
    paths:
      - '.github/workflows/founder-cockpit-visual-upgrade.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  visual-upgrade:
    runs-on: ubuntu-24.04
