name: PAYNE Founder Session Restart Offline
on:
  push:
    branches: [payne-founder-disarm-new-session-offline-20261012]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline-only full PAYNE regression
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          npm test
          node --check src/index.js
          echo NO_LIVE_PROVIDER_WRITES=PASS
          echo NO_DEPLOYMENT=PASS
