name: PAYNE Founder Exact NEAR Maintenance Promotion
on:
  push:
    branches: [payne-grok-exact-deployment-package-20261011]
    paths: [".github/workflows/payne-founder-exact-near-maintenance-promotion.yml"]
permissions:
  contents: read
concurrency:
  group: deploy-payne-kalshi-real-zero-money
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f243f7de350f5081a79cf628f0c715bc0bfb2537
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 6d42bd01cc4fc1f131bf7313a9f9d3dac9c77f4b
          path: reviewed-maintenance-gate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact approved source and isolated gate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = f243f7de350f5081a79cf628f0c715bc0bfb2537
          test "$(git rev-parse HEAD:market-edge-lab/real/payne-kalshi-real/src/index.js)" = e964586d6a38b9a4467486ec37ce395018681535
          grep -q '^name = "market-edge-payne-kalshi-real"$' market-edge-lab/real/payne-kalshi-real/wrangler.toml
          bash -n reviewed-maintenance-gate/.github/scripts/payne-exact-near-maintenance-gate.sh
          node --check market-edge-lab/real/payne-kalshi-real/src/index.js
          echo 'PINNED_GROK_RELEASE_VERIFIED'
      - name: Founder authorized limited maintenance pre-gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYNE_APPROVED_RECOVERY_RELEASE_SHA: f243f7de350f5081a79cf628f0c715bc0bfb2537
        run: bash reviewed-maintenance-gate/.github/scripts/payne-exact-near-maintenance-gate.sh pre
      - name: Live Founder ARM remains DISARMED
        run: |
          set -euo pipefail
          base=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev
          curl --fail --silent --show-error --max-time 25 "$base/control" -o /tmp/ctl.json
          jq -e '.ok==true and .control.armed==false and .control.openPositions==0 and .control.maxPositions==3 and .control.attemptTarget==5' /tmp/ctl.json >/dev/null || { echo 'BLOCKED: CONTROL_OR_POSITION_STATE_CHANGED';exit 1; }
          curl --fail --silent --show-error --max-time 25 "$base/real-state" -o /tmp/state.json
          jq -e '.series.unresolvedEntry==true and .series.currentAttempt.marketTicker=="KXNEAR15M-26OCT110600-00" and .series.currentAttempt.providerPostStarted==false and .series.currentAttempt.writerInvoked==false and (.series.positions//[]|length)==0' /tmp/state.json >/dev/null || { echo 'BLOCKED: LIVE_NEAR_STATE_CHANGED';exit 1; }
      - name: Build exact approved Grok release
        working-directory: market-edge-lab/real/payne-kalshi-real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/payne-identity-grok
      - name: Deploy exact approved source to existing PAYNE Worker
        working-directory: market-edge-lab/real/payne-kalshi-real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee /tmp/payne-grok-identity-deploy.log
          grep 'Current Version ID:' /tmp/payne-grok-identity-deploy.log
      - name: Verify exact config and series preserved after deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAYNE_APPROVED_RECOVERY_RELEASE_SHA: f243f7de350f5081a79cf628f0c715bc0bfb2537
        run: bash reviewed-maintenance-gate/.github/scripts/payne-exact-near-maintenance-gate.sh post
