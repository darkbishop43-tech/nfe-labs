name: Ledger Yesterday AUTO PAYNE Read Only
on:
  push:
    branches: [kalshi-ledger-lab-v1]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Extract PAYNE Oct 16 attempts
        run: |
          set -euo pipefail
          PAYNE=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev
          for i in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 15 --max-time 180 "$PAYNE/real-ledger?limit=1000" -o payne-ledger.json; then break; fi
            sleep 3
          done
          test -s payne-ledger.json

          echo "=== ENTRY_ATTEMPTS ==="
          jq -c '[.rows[] |
            select((((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) >= "2026-10-16T04:00:00Z") and (((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) < "2026-10-17T04:00:00Z")) |
            select(.type=="ENTRY_PROVIDER_POST_STARTED" or .type=="POSITION_OWNERSHIP_ESTABLISHED" or .type=="ENTRY_NO_FILL" or .type=="ENTRY_PRE_SUBMIT_LATCHED") |
            {type,at,seriesId,attemptNo:(.attemptNo//.attempt//null),asset:(.asset//null),ticker:(.ticker//.marketTicker//null),side:(.side//.outcomeSide//null),score:(.score//.entryScore//null),entryOrderId:(.entryOrderId//.providerOrderId//.orderId//null),filledCount:(.filledCount//.fillCount//null),result:(.result//null)}
          ]' payne-ledger.json

          echo "=== CLOSED_POSITIONS ==="
          jq -c '[.rows[] |
            select((((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) >= "2026-10-16T04:00:00Z") and (((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) < "2026-10-17T04:00:00Z")) |
            select(.type=="PROVIDER_RECONCILED_FLAT" or .type=="PAYNE_PAPER_BRAIN_EXIT_CLOSED") |
            {type,at,seriesId,ticker:(.ticker//.marketTicker//null),side:(.side//.outcomeSide//null),realizedPnlUsd:(.realizedPnlUsd//null)}
          ]' payne-ledger.json

          echo "=== SAFETY ==="
          echo '{"providerWrites":0,"ordersSubmittedByThisRead":0,"capitalMovedUsd":0,"armDisarm":"UNCHANGED"}'
