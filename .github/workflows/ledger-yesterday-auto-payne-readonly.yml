name: Ledger Yesterday AUTO PAYNE Read Only
on:
  push:
    branches: [kalshi-ledger-lab-v1]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Oct 16 evidence
        run: |
          set -euo pipefail
          AUTO=https://market-edge-baseline-real.darkbishop43.workers.dev
          PAYNE=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev

          echo "=== AUTO EXECUTION TEST STATE ==="
          curl -fsS --retry 2 --connect-timeout 10 --max-time 90 "$AUTO/execution-test-state" -o auto.json
          jq -c '{state:.state,queue:.queue,funding:.funding,safety:.safety}' auto.json

          echo "=== PAYNE HISTORY ==="
          curl -fsS --retry 2 --connect-timeout 10 --max-time 90 "$PAYNE/real-history" -o payne-history.json
          jq -c '.' payne-history.json

          echo "=== PAYNE LEDGER ==="
          curl -fsS --retry 2 --connect-timeout 10 --max-time 90 "$PAYNE/real-ledger?limit=1000" -o payne-ledger.json
          jq -c '{count,complete,omittedOlderKeys,rows:[.rows[]|select(((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) >= "2026-10-16T04:00:00Z" and ((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//"")|tostring) < "2026-10-17T04:00:00Z")]}' payne-ledger.json

          echo "=== PROVIDER HISTORICAL ORDERS OCT16 ET ==="
          curl -fsS --retry 2 --connect-timeout 10 --max-time 90 "$AUTO/forensic-historical-orders?min_ts=1792123200&max_ts=1792209600&limit=200" -o provider.json
          jq -c '{orderCount:((.orders//[])|length),cursor:(.cursor//null),orders:(.orders//[])}' provider.json

          echo "=== PROVIDER OWNERSHIP PREFIX SUMMARY ==="
          jq -c '{
            auto:[(.orders//[])[]|select((((.client_order_id//.clientOrderId//"")|tostring)|startswith("nfe-test-")) or ((((.client_order_id//.clientOrderId//"")|tostring)|startswith("baseline-real-"))))],
            payne:[(.orders//[])[]|select((((.client_order_id//.clientOrderId//"")|tostring)|startswith("payne-real-")))]
          }' provider.json

          echo "=== SAFETY ==="
          echo '{"providerWrites":0,"ordersSubmittedByThisRead":0,"capitalMovedUsd":0,"armDisarm":"UNCHANGED"}'
