name: Ledger Yesterday AUTO PAYNE Read Only
on:
  push:
    branches: [kalshi-ledger-lab-v1]
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Oct 16 PAYNE trade evidence only
        run: |
          set -euo pipefail
          PAYNE=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev
          for i in 1 2 3 4 5; do
            if curl -fsS --connect-timeout 15 --max-time 180 "$PAYNE/real-ledger?limit=1000" -o payne-ledger.json; then break; fi
            sleep 3
          done
          test -s payne-ledger.json

          echo "=== TYPES ==="
          jq -c '[.rows[] | select((((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) >= "2026-10-16T04:00:00Z") and (((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) < "2026-10-17T04:00:00Z")) | .type] | group_by(.) | map({type:.[0],count:length})' payne-ledger.json

          echo "=== TRADE_ROWS ==="
          jq -c '[.rows[] | select((((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) >= "2026-10-16T04:00:00Z") and (((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) < "2026-10-17T04:00:00Z")) | select((.type|tostring|test("ATTEMPT|ENTRY|EXIT|FILL|POSITION|RECON|CLOSE|ARM_TRANSITION|FIRE|PROVIDER";"i"))) | {type,recordId,at,eventTimestamp,seriesId,attemptNo,attempt,asset,ticker,marketTicker,side,outcomeSide,score,entryScore,result,terminalStatus,status,providerOrderId,orderId,entryOrderId,exitOrderId,fillCount,filledCount,entryAverageFillPrice,exitAverageFillPrice,entryAverageFeePaid,exitAverageFeePaid,realizedPnlUsd,entryPrice,exitPrice,openedAt,closedAt,reasonCode,reconciliationStatus,reconciliationClassification,reconciliationReason}]' payne-ledger.json

          echo "=== SERIES ==="
          jq -c '[.rows[] | select((((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) >= "2026-10-16T04:00:00Z") and (((.eventTimestamp//.at//.timestamp//.createdAt//.openedAt//.closedAt//.providerResponseAt//"")|tostring) < "2026-10-17T04:00:00Z")) | select(.seriesId!=null) | .seriesId] | unique' payne-ledger.json

          echo "=== SAFETY ==="
          echo '{"providerWrites":0,"ordersSubmittedByThisRead":0,"capitalMovedUsd":0,"armDisarm":"UNCHANGED"}'
