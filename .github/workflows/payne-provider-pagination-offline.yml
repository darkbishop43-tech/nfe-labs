name: PAYNE Provider Cursor Pagination Offline
on:
  push:
    branches: [payne-provider-order-fill-pagination-isolated-20261015]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cursors and unchanged FIRE guard
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --check src/index.js
          node --test test/provider-identity-pagination-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
