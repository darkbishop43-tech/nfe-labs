name: Verify Queue Persistence After Worker Restart

on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - '.github/workflows/verify-queue-persistence-after-restart.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read persisted queue proof after Worker redeploy
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://market-edge-baseline-real.darkbishop43.workers.dev'
          curl --fail --silent --show-error "$BASE/execution-test-queue-persistence-proof" -o /tmp/proof.json
          curl --fail --silent --show-error "$BASE/execution-test-regression-proof" -o /tmp/regression.json
          curl --fail --silent --show-error "$BASE/execution-test-state" -o /tmp/state.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/proof.json'))
          g=json.load(open('/tmp/regression.json'))
          s=json.load(open('/tmp/state.json'))
          out={
            'persisted_after_worker_restart':p,
            'regression':g,
            'execution_test_status':s.get('state',{}).get('status'),
            'execution_test_armed':s.get('state',{}).get('armed'),
            'historical_attempts':s.get('state',{}).get('attempts'),
            'real_order_submitted_by_validation':False
          }
          print(json.dumps(out,indent=2))
          assert p.get('persisted') is True
          assert p.get('proof',{}).get('proofId')=='unattended-proof-20260924'
          assert p.get('proof',{}).get('writtenAt')=='2026-09-24T10:06:46.476Z'
          assert p.get('proof',{}).get('queue',{}).get('completedAttempts')==2
          assert p.get('proof',{}).get('queue',{}).get('currentIndex')==1
          assert p.get('productionExecutionStateTouched') is False
          assert p.get('realOrderSubmitted') is False
          assert g.get('workerRestartFailClosed') is True
          assert g.get('singleSeriesArmRoutePreserved') is True
          assert g.get('schedulerOwnsExecution') is True
          assert g.get('browserRequired') is False
          PY
