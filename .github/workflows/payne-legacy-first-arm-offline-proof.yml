name: PAYNE Legacy First ARM Offline Proof
on:
  push:
    branches: [payne-legacy-first-arm-offline-proof-20261012]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify pinned deployed source and run legacy offline fixture
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:market-edge-lab/real/payne-kalshi-real/src/index.js)" = 6dee1e93154d54eb80aa41164649f1dfccb20336
          npm test
          echo NO_PRODUCTION_MUTATION=PASS
