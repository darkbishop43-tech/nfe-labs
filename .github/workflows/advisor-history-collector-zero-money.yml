name: Advisor History Collector Zero Money

on:
  workflow_dispatch:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - 'market-edge-lab/real/baseline/advisor-history/collect.mjs'
      - '.github/workflows/advisor-history-collector-zero-money.yml'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/baseline
    env:
      ADVISOR_KV_NAMESPACE_ID: d110292129c94b26942c25d0c462a17b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-baseline-real

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect completed Coinbase 1-minute OHLC evidence
        run: |
          set -euo pipefail
          node advisor-history/collect.mjs | tee /tmp/advisor-history-collector.log

      - name: Verify data quality and zero-execution authority
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const s=JSON.parse(readFileSync('advisor-history/out/summary.json','utf8'));
          const fail=(m)=>{console.error('FAIL '+m);process.exit(1)};
          if(s.assetsAttempted!==9) fail('assetsAttempted='+s.assetsAttempted);
          if(s.safety?.providerTradingWrites!==0) fail('providerTradingWrites');
          if(s.safety?.capitalMovedUsd!==0) fail('capitalMovedUsd');
          if(s.safety?.ordersSubmitted!==0) fail('ordersSubmitted');
          if(s.safety?.executionStateTouched!==false) fail('executionStateTouched');
          if(s.safety?.armDisarmTouched!==false) fail('armDisarmTouched');
          if(s.safety?.fabricatedCandles!==0||s.safety?.interpolatedCandles!==0) fail('fabricated/interpolated candles');
          if(s.authority?.canModifyExecution!==false||s.authority?.canSubmitOrders!==false||s.authority?.canArm!==false||s.authority?.canDisarm!==false||s.authority?.canWriteSeriesState!==false) fail('authority wall');
          if(!s.allQualityValid) fail('quality validation');
          for(const r of s.results){
            if(r.barCount>0){
              if(!r.quality?.timestampsMonotonic) fail(r.asset+' timestamps');
              if(!r.quality?.uniqueTimestamps) fail(r.asset+' duplicates');
              if(!r.quality?.ohlcFiniteAndConsistent) fail(r.asset+' OHLC');
              if(!r.quality?.noFutureBars) fail(r.asset+' future bar');
              if(!r.quality?.completedOnly) fail(r.asset+' incomplete bar');
            }
          }
          console.log('assetsAttempted='+s.assetsAttempted);
          console.log('ready='+s.ready);
          console.log('partial='+s.partial);
          console.log('unavailable='+s.unavailable);
          console.log('providerTradingWrites=0');
          console.log('capitalMovedUsd=0');
          console.log('ordersSubmitted=0');
          console.log('ARM_DISARM_TOUCHED=NO');
          console.log('EXECUTION_STATE_TOUCHED=NO');
          for(const r of s.results) console.log(`RESULT ${r.asset} | ${r.source} | ${r.barCount} | ${r.firstBar||'—'} | ${r.latestCompletedBar||'—'} | gaps=${r.gaps} | ${r.status}${r.reason?' | '+r.reason:''}`);
          NODE

      - name: Validate Cloudflare persistence credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Persist isolated Advisor history keys only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          put_kv(){
            local key="$1" file="$2"
            case "$key" in
              advisor:history:v1:*) ;;
              *) echo "REFUSING_NON_ADVISOR_KEY $key"; exit 1;;
            esac
            local enc
            enc="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$key")"
            local response
            response="$(curl --silent --show-error --fail-with-body \
              -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary "@$file" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$ADVISOR_KV_NAMESPACE_ID/values/$enc")"
            node -e 'const x=JSON.parse(process.argv[1]);if(x.success!==true){console.error(x);process.exit(1)}' "$response"
            echo "PERSISTED $key"
          }
          for asset in BTC ETH SOL XRP HYPE ZEC DOGE BNB NEAR; do
            put_kv "advisor:history:v1:$asset" "advisor-history/out/$asset.json"
          done
          put_kv "advisor:history:v1:summary" "advisor-history/out/summary.json"
          echo 'advisorKvWrites=10'
          echo 'executionStateKvWrites=0'
          echo 'providerTradingWrites=0'
          echo 'capitalMovedUsd=0'
          echo 'ordersSubmitted=0'

      - name: Upload collector evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: advisor-history-v1
          path: market-edge-lab/real/baseline/advisor-history/out/*.json
          if-no-files-found: error
          retention-days: 14
