name: Micro Lifecycle Preflight Read Only
on:
  push:
    branches: [market-edge-baseline-real]
    paths: ['.github/workflows/micro-lifecycle-preflight-read-only.yml']
permissions: {contents: read}
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Fresh deployed preflight
        run: |
          set -euo pipefail
          curl -fsS https://market-edge-baseline-real.darkbishop43.workers.dev/execution-test-state | tee /tmp/preflight.json
          node <<'NODE'
          const p=require('/tmp/preflight.json');
          const required=p?.state?.armed===false&&p?.state?.openPositions===0&&p?.queue?.active===false&&Number(p?.funding?.index2)>=1;
          if(!required)throw Error('MICRO_PREFLIGHT_FAILED');
          console.log('MICRO_PREFLIGHT_PASS='+JSON.stringify(p));
          console.log('SAFETY='+JSON.stringify({providerWrites:0,capitalMovedUsd:0,ordersSubmitted:0,newQueueArmed:false}));
          NODE

# retry after deployment propagation

# fallback live-state preflight after dedicated route 404
