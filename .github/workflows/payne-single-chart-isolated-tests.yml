name: PAYNE Single Chart Isolated Validation
on:
  push:
    branches: [payne-single-chart-display-20261011]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and complete PAYNE suite
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          node --check src/live-chart-panel.js
          node --check src/cockpit-html.js
          npm test
