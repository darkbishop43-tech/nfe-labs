name: Founder Authorized PAYNE V6 Pinned Production Installation
on:
  push:
    branches: [payne-v6-prod-deploy-authorized-20261012]
    paths: ['.github/workflows/payne-v6-founder-production-install.yml']
permissions:
  contents: read
concurrency:
  group: deploy-payne-kalshi-real-zero-money
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3b2394e9559a77c0f8106d462ae3e3a0d1d0b7c3
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact pinned validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3b2394e9559a77c0f8106d462ae3e3a0d1d0b7c3
          git diff --exit-code ed131c056a2f0b446a94c01af1554f11f9fa930a HEAD -- market-edge-lab/real/payne-kalshi-real/src/index.js market-edge-lab/real/payne-kalshi-real/src/payne-execution-coordinator.js
          git diff --exit-code d5d92a39361c8eec464ff3b60c4d8f16e44bcbfd HEAD -- market-edge-lab/real/payne-kalshi-real/src/payne-paper-brain.js market-edge-lab/real/payne-kalshi-real/src/payne-kalshi-features.js market-edge-lab/real/payne-kalshi-real/src/kalshi-real-write.js market-edge-lab/real/baseline market-edge-lab/real/shared
          grep -q '^name = "market-edge-payne-kalshi-real"$' market-edge-lab/real/payne-kalshi-real/wrangler.toml
          node --check market-edge-lab/real/payne-kalshi-real/src/index.js
          echo PINNED_SOURCE_PASSED
      - name: Verify current Founder control and retain original state snapshot
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl --fail --show-error --silent --max-time 25 "$base/control" -o /tmp/payne-pre-control.json
          curl --fail --show-error --silent --max-time 25 "$base/real-state" -o /tmp/payne-pre-state.json
          jq -e '.ok==true and .control.armed==false and .control.openPositions==0' /tmp/payne-pre-control.json
          jq -e '.ok==true and .control.armed==false and .series.unresolvedEntry==true' /tmp/payne-pre-state.json
          echo FOUNDER_DISARM_AND_HISTORICAL_STATE_READ=PASS
      - name: Authenticated Kalshi account-wide GET verification
        shell: bash
        env:
          KALSHI_EXECUTION_KEY_ID: ${{ secrets.KALSHI_EXECUTION_KEY_ID }}
          KALSHI_EXECUTION_PRIVATE_KEY: ${{ secrets.KALSHI_EXECUTION_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {kalshiGetOnly} from './market-edge-lab/real/payne-kalshi-real/src/kalshi-get-only.js';
          const env={KALSHI_EXECUTION_KEY_ID:process.env.KALSHI_EXECUTION_KEY_ID,
                     KALSHI_EXECUTION_PRIVATE_KEY:process.env.KALSHI_EXECUTION_PRIVATE_KEY};
          if(!env.KALSHI_EXECUTION_KEY_ID||!env.KALSHI_EXECUTION_PRIVATE_KEY){
            console.error('BLOCKED: GITHUB_ACTIONS_KALSHI_EXECUTION_READ_CREDENTIALS_MISSING');
            process.exit(47);
          }
          const get=async(path)=>{
            let response;
            try {response=await kalshiGetOnly(env,path);}
            catch(e){console.error('BLOCKED: AUTHENTICATED_GET_EXCEPTION path='+path+' code='+String(e?.message||'UNKNOWN'));process.exit(48);}
            console.log('KALSHI_GET '+path+' HTTP_'+response.status);
            if(!response.ok){console.error('BLOCKED: KALSHI_GET_HTTP_'+response.status+' path='+path);process.exit(49);}
            const body=await response.json().catch(()=>null);
            if(!body||typeof body!=='object'){console.error('BLOCKED: KALSHI_GET_INVALID_JSON path='+path);process.exit(50);}
            return body;
          };
          const collect=async(endpoint,key,extra='')=>{
            let cursor='',rows=[],page=0;
            do {
              if(++page>50){console.error('BLOCKED: PROVIDER_PAGINATION_INCOMPLETE '+endpoint);process.exit(51);}
              const path='/trade-api/v2/'+endpoint+'?limit=200&subaccount=0'+extra+(cursor?'&cursor='+encodeURIComponent(cursor):'');
              const body=await get(path);
              if(!Array.isArray(body[key])){console.error('BLOCKED: PROVIDER_SCHEMA_UNKNOWN '+endpoint);process.exit(52);}
              rows.push(...body[key]);cursor=String(body.cursor||'');
            }while(cursor);
            console.log('KALSHI_VERIFIED_ROWS '+endpoint+'='+rows.length);
            return rows;
          };
          const orders=await collect('portfolio/orders','orders');
          const positions=await collect('portfolio/positions','market_positions');
          const fills=await collect('portfolio/fills','fills');
          const historic=await collect('historical/fills','fills');
          const settlements=await collect('portfolio/settlements','settlements');
          const active=orders.filter(o=>!['canceled','cancelled','executed','filled','rejected','expired','settled'].includes(String(o.status||o.order_status||'').toLowerCase()));
          const exposure=positions.filter(p=>Number(p.position??p.position_count??p.total_traded??0)!==0);
          console.log('EVIDENCE_COUNTS active_or_unknown_orders='+active.length+
                      ' nonzero_or_uncertain_positions='+exposure.length+
                      ' current_fills='+fills.length+' historical_fills='+historic.length+
                      ' settlements='+settlements.length);
          if(active.length||exposure.length){
            console.error('BLOCKED: PROVIDER_OPEN_OR_UNMANAGED_EXPOSURE');
            console.error('ORDER_IDENTITIES '+JSON.stringify(active.map(x=>({ticker:x.ticker,order_id:x.order_id,status:x.status})).slice(0,20)));
            console.error('POSITION_IDENTITIES '+JSON.stringify(exposure.map(x=>({ticker:x.ticker,position:x.position})).slice(0,20)));
            process.exit(53);
          }
          console.log('ACCOUNT_WIDE_PROVIDER_GET_EVIDENCE_CLEAN');
          NODE
      - name: Execute Wrangler installation only after verified exposure
        working-directory: market-edge-lab/real/payne-kalshi-real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee /tmp/payne-v6-install.txt
          grep 'Current Version ID:' /tmp/payne-v6-install.txt
      - name: Read back control and state after deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl --fail --silent --show-error "$base/control" -o /tmp/payne-post-control.json
          curl --fail --silent --show-error "$base/real-state" -o /tmp/payne-post-state.json
          jq -e '.ok==true and .control.armed==false' /tmp/payne-post-control.json
          jq -S '.control' /tmp/payne-pre-control.json > /tmp/pre.json
          jq -S '.control' /tmp/payne-post-control.json > /tmp/post.json
          cmp /tmp/pre.json /tmp/post.json
          jq -S '.series' /tmp/payne-pre-state.json > /tmp/series-pre.json
          jq -S '.series' /tmp/payne-post-state.json > /tmp/series-post.json
          cmp /tmp/series-pre.json /tmp/series-post.json
          echo CONTROL_AND_HISTORICAL_SERIES_PRESERVED
