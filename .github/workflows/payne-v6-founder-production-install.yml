name: Founder Authorized PAYNE V6 Pinned Production Installation
on:
  push:
    branches: [payne-v6-prod-deploy-authorized-20261012]
    paths: ['.github/workflows/payne-v6-founder-production-install.yml']
permissions:
  contents: read
concurrency:
  group: deploy-payne-kalshi-real-zero-money
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 66cedcadda4b02ac378d630c8f70764d8c2be060
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact pinned validated build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 66cedcadda4b02ac378d630c8f70764d8c2be060
          git diff --exit-code d5d92a39361c8eec464ff3b60c4d8f16e44bcbfd HEAD -- market-edge-lab/real/payne-kalshi-real/src/payne-paper-brain.js market-edge-lab/real/payne-kalshi-real/src/payne-kalshi-features.js market-edge-lab/real/payne-kalshi-real/src/kalshi-real-write.js
          git diff --exit-code d5d92a39361c8eec464ff3b60c4d8f16e44bcbfd HEAD -- market-edge-lab/real/payne-kalshi-real/src/payne-paper-brain.js market-edge-lab/real/payne-kalshi-real/src/payne-kalshi-features.js market-edge-lab/real/payne-kalshi-real/src/kalshi-real-write.js market-edge-lab/real/baseline market-edge-lab/real/shared
          grep -q '^name = "market-edge-payne-kalshi-real"$' market-edge-lab/real/payne-kalshi-real/wrangler.toml
          node --check market-edge-lab/real/payne-kalshi-real/src/index.js
          echo PINNED_SOURCE_PASSED
      - name: Snapshot current Founder controls and exposure with no mutation
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl --fail --show-error --silent --max-time 25 "$base/control" -o /tmp/payne-pre-control.json
          curl --fail --show-error --silent --max-time 25 "$base/real-state" -o /tmp/payne-pre-state.json
          jq -e '.ok==true and (.control.armed|type=="boolean")' /tmp/payne-pre-control.json
          jq -e '.ok==true and (.control.armed|type=="boolean") and (.series.seriesId|type=="string")' /tmp/payne-pre-state.json
          echo 'CROSS_ENDPOINT_WHOLE_OBJECT_ASSERTION_REMOVED; authoritative KV comparison remains in predeployment exposure step'
          echo FOUNDER_CONTROL_READ_ONLY_SNAPSHOT=PASS
      - name: Checkout exact V5 authenticated Cloudflare KV gate
        uses: actions/checkout@v4
        with:
          ref: 09709b828bd0072115265ca202d89d1b23e5a464
          path: existing-approved-gate
          persist-credentials: false
      - name: Existing Cloudflare KV predeployment exposure and state read
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          namespace=03352b0ccb034f1bb8206f663a04b125
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$namespace/values"
          for item in 'control|payne-kalshi:control:v1' 'series|payne-kalshi:real-series:v1' 'current|payne-kalshi:current:v1'; do
            label="${item%%|*}"; key="${item#*|}"
            encoded="$(jq -nr --arg x "$key" '$x|@uri')"
            code="$(curl --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "/tmp/payne-pre-$label-kv.json" -w '%{http_code}' "$base/$encoded")"
            test "$code" = 200 || { echo "BLOCKED: KV_$label HTTP_$code"; exit 1; }
          done
          jq -e '.realControlSchema=="PAYNE_REAL_CONTROL_V2_PAPER_BRAIN" and (.armed|type=="boolean") and .requiredExchangeIndex==2 and (.activeThreshold|type=="number") and (.maxEntryDebitUsd|type=="number") and (.attemptTarget|type=="number")' /tmp/payne-pre-control-kv.json >/dev/null
          jq -e '.schema=="PAYNE_REAL_SERIES_V1" and .owner=="PAYNE_KALSHI_REAL" and .requiredExchangeIndex==2' /tmp/payne-pre-series-kv.json >/dev/null
          jq -e --slurpfile c /tmp/payne-pre-control-kv.json '.control.armed==$c[0].armed and .control.activeThreshold==$c[0].activeThreshold and .control.maxEntryDebitUsd==$c[0].maxEntryDebitUsd and .control.attemptTarget==$c[0].attemptTarget' /tmp/payne-pre-state.json >/dev/null
          jq -e --slurpfile c /tmp/payne-pre-control-kv.json '
            (.position==null or ((.position.owner//"")=="PAYNE_KALSHI_REAL" and (.position.status//""|IN("FLAT","CLOSED","SETTLED")))) and
            ((.fireLatch.state//"NONE")|IN("LATCHED","PROVIDER_POST_UNKNOWN","PRE_PROVIDER_VALIDATION","PROVIDER_POST_STARTED","PROVIDER_POST_CREATED")|not) and
            (.unresolvedEntry!=true or
              ($c[0].armed==false and .currentAttempt.writerInvoked==false and
              .currentAttempt.providerPostStarted==false and .currentAttempt.providerOrderId==null)) and
            (.currentAttempt.providerPostStarted!=true or
              (.currentAttempt.status|IN("NO_FILL","FILLED","CLOSED","SETTLED","NO_PROVIDER_EXECUTION"))) and
            (.currentAttempt.status//""|IN("PROVIDER_REJECTED_OR_UNKNOWN","WRITE_ERROR_UNKNOWN","RESULT_UNKNOWN","ENTRY_RECONCILIATION_REQUIRED")|not)
          ' /tmp/payne-pre-series-kv.json >/dev/null || { echo 'BLOCKED: ACTIVE_OR_UNKNOWN_PROVIDER_EXPOSURE';exit 1; }
          jq -e '.source=="SCHEDULED_CRON" and (.at|type=="string")' /tmp/payne-pre-current-kv.json >/dev/null
          observed="$(date -u -d "$(jq -r '.at' /tmp/payne-pre-current-kv.json)" +%s)"
          now="$(date -u +%s)"
          age=$((now-observed))
          if ((age<0 || age>300)); then echo 'BLOCKED: STALE_SCHEDULER_OBSERVATION';exit 1;fi
          echo 'PREDEPLOY_LIVE_STATE_EXPOSURE_CHECK=PASS'
          jq -c '{armed,threshold:.activeThreshold,stake:.maxEntryDebitUsd,attemptTarget,openPositions}' /tmp/payne-pre-control-kv.json
          jq -c '{seriesId,status,unresolvedEntry,attemptsStarted,fireLatchState:.fireLatch.state}' /tmp/payne-pre-series-kv.json
      - name: Existing Cloudflare Worker authenticated proof
        shell: bash
        run: |
          set -euo pipefail
          base=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev
          curl --fail --silent --show-error --max-time 35 "$base/proof" -o /tmp/payne-provider-proof.json
          jq -e '.kalshi.authenticatedGet=="PROVEN"' /tmp/payne-provider-proof.json >/dev/null || { echo 'BLOCKED: EXISTING_PROVIDER_AUTHENTICATION_NOT_PROVEN'; exit 1; }
          echo 'CLOUDFLARE_KALSHI_AUTHENTICATED_GET=PASS'
      - name: Execute Wrangler installation only after verified exposure
        working-directory: market-edge-lab/real/payne-kalshi-real
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy | tee /tmp/payne-v6-install.txt
          grep 'Current Version ID:' /tmp/payne-v6-install.txt
      - name: Read existing Cloudflare KV state and preserve Founder settings
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values"
          for item in 'control|payne-kalshi:control:v1' 'series|payne-kalshi:real-series:v1'; do
            label="${item%%|*}"; key="${item#*|}"
            encoded="$(jq -nr --arg x "$key" '$x|@uri')"
            code="$(curl --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -o "/tmp/payne-post-$label-kv.json" -w '%{http_code}' "$base/$encoded")"
            test "$code" = 200 || { echo "POST_KV_$label HTTP_$code";exit 1; }
          done
          jq -S -c . /tmp/payne-pre-control-kv.json > /tmp/a.json
          jq -S -c . /tmp/payne-post-control-kv.json > /tmp/b.json
          cmp /tmp/a.json /tmp/b.json || { echo 'FOUNDER_CONTROL_CHANGED';exit 1; }
          jq -S -c '{seriesId,unresolvedEntry,position,currentAttempt,fireLatch,configFrozen,attemptsStarted}' /tmp/payne-pre-series-kv.json > /tmp/a-series.json
          jq -S -c '{seriesId,unresolvedEntry,position,currentAttempt,fireLatch,configFrozen,attemptsStarted}' /tmp/payne-post-series-kv.json > /tmp/b-series.json
          cmp /tmp/a-series.json /tmp/b-series.json || { echo 'SERIES_STATE_CHANGED_DURING_INSTALL';exit 1; }
          echo 'POSTDEPLOY_FOUNDER_STATE_PRESERVED=PASS'
      - name: Read back control and state after deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl --fail --silent --show-error "$base/control" -o /tmp/payne-post-control.json
          curl --fail --silent --show-error "$base/real-state" -o /tmp/payne-post-state.json
          jq -e '.ok==true and (.control.armed|type=="boolean")' /tmp/payne-post-control.json
          jq -S '.control' /tmp/payne-pre-control.json > /tmp/pre.json
          jq -S '.control' /tmp/payne-post-control.json > /tmp/post.json
          cmp /tmp/pre.json /tmp/post.json
          jq -e --slurpfile pre /tmp/payne-pre-state.json '
            .series.seriesId==$pre[0].series.seriesId and
            .series.unresolvedEntry==$pre[0].series.unresolvedEntry and
            .series.currentAttempt.attemptId==$pre[0].series.currentAttempt.attemptId and
            .series.currentAttempt.clientOrderId==$pre[0].series.currentAttempt.clientOrderId and
            .series.currentAttempt.providerOrderId==$pre[0].series.currentAttempt.providerOrderId and
            .series.currentAttempt.terminalClassification==$pre[0].series.currentAttempt.terminalClassification
          ' /tmp/payne-post-state.json >/dev/null
          curl --fail --silent --show-error --max-time 25 "$base/" -o /tmp/payne-live-cockpit.html
          grep -q 'PAYNE EXECUTION AUDIT' /tmp/payne-live-cockpit.html
          grep -q 'LIVE ORDER WATCH' /tmp/payne-live-cockpit.html
          curl --fail --silent --show-error --max-time 25 "$base/real-history?view=audit" -o /tmp/payne-live-audit.json
          jq -e '.ok==true and .readOnly==true' /tmp/payne-live-audit.json >/dev/null
          echo CONTROL_AND_AUDIT_PANEL_PRESERVED
