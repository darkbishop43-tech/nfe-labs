name: PAYNE FIRE Timing Isolated Zero-Money
on:
  push:
    branches: [payne-fire-timing-isolated-20261009]
    paths:
      - .github/workflows/payne-fire-timing-test-only.yml
      - market-edge-lab/real/payne-kalshi-real/src/index.js
      - market-edge-lab/real/payne-kalshi-real/src/payne-execution-timing.js
      - market-edge-lab/real/payne-kalshi-real/test/payne-execution-timing.test.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  zero-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          node --check src/index.js
          node --check src/payne-execution-timing.js
      - name: Full PAYNE regressions
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: npm test
