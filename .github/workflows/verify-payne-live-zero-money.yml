name: Verify PAYNE live zero-money observer

on:
  push:
    branches:
      - market-edge-payne-kalshi-real-step1
    paths:
      - ".github/workflows/verify-payne-live-zero-money.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: GET PAYNE research evidence bodies
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p /tmp/payne-research-evidence
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          echo 'EVENTS_GET'
          curl -sS --max-time 900 -o /tmp/payne-research-evidence/payne-events-1000.json -w 'HTTP=%{http_code}\n' "$base/evidence/events?limit=1000"
          echo 'EVENTS_BODY_META'
          jq '{ok,schema,count,providerWrites,orders,capitalMovedUsd,error}' /tmp/payne-research-evidence/payne-events-1000.json 2>/dev/null || true
          echo 'WEEKLY_EXPORT_GET'
          curl -sS --max-time 900 -o /tmp/payne-research-evidence/payne-export-weekly.json -w 'HTTP=%{http_code}\n' "$base/export?range=weekly&format=json"
          echo 'WEEKLY_EXPORT_BODY_META'
          jq '{schema,exportedAt,range,observationCount,eventCount,rowCount,providerWrites,orders,capitalMovedUsd,error}' /tmp/payne-research-evidence/payne-export-weekly.json 2>/dev/null || true

      - name: Upload bounded PAYNE research evidence
        uses: actions/upload-artifact@v4
        with:
          name: payne-v5-readonly-research-evidence
          path: /tmp/payne-research-evidence/
          if-no-files-found: error
          retention-days: 1

  gate1_preview:
    runs-on: ubuntu-latest
    steps:
      - name: Build current PAYNE execution-plumbing specimen preview with GET only
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          curl -fsS "$base/real-state" -o /tmp/real-state.json
          curl -fsS "$base/cockpit-data" -o /tmp/cockpit.json

          python - <<'PY'
          import json, math
          real=json.load(open('/tmp/real-state.json'))
          cockpit=json.load(open('/tmp/cockpit.json'))

          def fail(msg):
              raise SystemExit("GATE1_BLOCKER="+msg)

          control=real.get('control') or {}
          series=real.get('series') or {}
          re=(cockpit.get('realExecution') or {})
          if control.get('armed') is not False: fail('PAYNE_NOT_DISARMED')
          if series.get('unresolvedEntry') is not False: fail('UNRESOLVED_ENTRY_NOT_FALSE')
          if int(re.get('ownedPositions') or 0) != 0: fail('PAYNE_OWNED_POSITIONS_NONZERO')

          if int(real.get('providerWrites') or 0) != 0: fail('REAL_STATE_PROVIDER_WRITES_NONZERO')
          if int(real.get('ordersSubmittedByThisRead') or 0) != 0: fail('REAL_STATE_ORDERS_NONZERO')
          if float(real.get('capitalMovedUsd') or 0) != 0: fail('REAL_STATE_CAPITAL_MOVED_NONZERO')
          if int(cockpit.get('providerWrites') or 0) != 0: fail('COCKPIT_PROVIDER_WRITES_NONZERO')
          if int(cockpit.get('orders') or 0) != 0: fail('COCKPIT_ORDERS_NONZERO')
          if float(cockpit.get('capitalMovedUsd') or 0) != 0: fail('COCKPIT_CAPITAL_MOVED_NONZERO')

          if cockpit.get('authentication') != 'PROVEN': fail('KALSHI_AUTH_NOT_PROVEN')
          idx=cockpit.get('index2') or {}
          balance=idx.get('balance')
          if idx.get('status') != 'READ-PROVEN AVAILABLE': fail('INDEX2_NOT_READ_PROVEN')
          if balance is None or float(balance) < 1.0: fail('INDEX2_BALANCE_BELOW_1_USD')

          def fee_safe(p, cap=1.0):
              if not (isinstance(p,(int,float)) and 0 < p < 1): return None
              for count in range(int(cap//p),0,-1):
                  premium=round(count*p,4)
                  raw=0.07*count*p*(1-p)
                  fee=math.ceil((raw-1e-12)*100)/100
                  total=round(premium+fee,4)
                  if total <= cap + 1e-9:
                      return {'count':count,'premiumUsd':premium,'feeUsd':fee,'totalDebitUsd':total}
              return None

          choices=[]
          for m in cockpit.get('markets') or []:
              if str(m.get('status') or '').lower() not in ('open','active'): continue
              if m.get('executionEligible') is not True: continue
              if int(m.get('exchangeIndex') if m.get('exchangeIndex') is not None else -1) != 2: continue
              rem=m.get('timeRemainingMs')
              if not isinstance(rem,(int,float)) or rem <= 390000: continue
              if not m.get('ticker') or not m.get('asset'): continue
              for outcome,key in [('YES','yesAsk'),('NO','noAsk')]:
                  ask=m.get(key)
                  if not isinstance(ask,(int,float)) or not (0 < ask < 1): continue
                  sizing=fee_safe(float(ask))
                  if not sizing: continue
                  choices.append({
                      'ticker':m['ticker'],'asset':m['asset'],'outcomeSide':outcome,
                      'currentExecutableAsk':round(float(ask),4),'timeRemainingMs':int(rem),
                      'exchangeIndex':2,'providerReadAt':m.get('providerReadAt'),
                      'sizing':sizing,'providerSide':'bid' if outcome=='YES' else 'ask',
                      'providerPrice':round(float(ask) if outcome=='YES' else 1.0-float(ask),4),
                  })

          if not choices: fail('NO_CURRENT_SAFE_INDEX2_SPECIMEN')
          choices.sort(key=lambda x:(-x['timeRemainingMs'],x['currentExecutableAsk'],x['ticker'],x['outcomeSide']))
          pick=choices[0]
          payload={
              'ticker':pick['ticker'],
              'client_order_id':'<FRESH_PAYNE_DIAGNOSTIC_ID_AT_GATE2>',
              'side':pick['providerSide'],
              'count':f"{pick['sizing']['count']:.2f}",
              'price':f"{pick['providerPrice']:.4f}",
              'time_in_force':'immediate_or_cancel',
              'self_trade_prevention_type':'taker_at_cross',
              'post_only':False,'cancel_order_on_pause':True,'reduce_only':False,
          }
          out={
              'schema':'PAYNE_PROVIDER_POST_GATE1_PREVIEW_V1',
              'gate':'READ_PREVIEW_ONLY',
              'strategyQualificationUsed':False,
              'strategyBypass':'AUTHORIZED_FOR_SINGLE_FOUNDER_APPROVED_DIAGNOSTIC_ONLY',
              'payne':{'armed':False,'unresolvedEntry':False,'ownedPositions':0},
              'kalshi':{'authentication':cockpit.get('authentication'),'index2Status':idx.get('status'),'index2BalanceUsd':balance},
              'specimen':pick,
              'expectedIocPayload':payload,
              'safetyGates':{
                  'payneDisarmed':'PASS','ownedPositionsZero':'PASS','unresolvedEntryFalse':'PASS',
                  'currentlyOpenTradable':'PASS','index2':'PASS','timeGate6_5m':'PASS',
                  'realExecutableAsk':'PASS','feeSafeUnder1Usd':'PASS','sharedWriterPayloadShape':'PASS',
                  'payneOwnershipConflict':'NONE','providerWrites':0,'orders':0,'capitalMovedUsd':0,
                  'normalStrategyPipelineChanged':False,'autoTouched':False
              }
          }
          print('GATE1_PREVIEW='+json.dumps(out,separators=(',',':')))
          PY
