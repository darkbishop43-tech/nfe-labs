name: PAYNE Live Readiness Authenticated GET Only
on:
  push:
    branches: [payne-readonly-promotion-workflow-isolated-20261018]
    paths: [".github/workflows/payne-live-readiness-get-only-20261018.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticated Cloudflare deployment and KV GETs, no writes
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --fail --silent --show-error --max-time 25 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$root/workers/scripts/market-edge-payne-kalshi-real/deployments" -o /tmp/p-deploy.json
          jq -e '.success==true and (.result.deployments|type)=="array"' /tmp/p-deploy.json >/dev/null
          jq -c '{latestDeployment:(.result.deployments[0]|{created_on,versions:[.versions[]?|{version_id,percentage}]})}' /tmp/p-deploy.json
          kv="$root/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125/values"
          for item in control series current; do
            case "$item" in
              control) key='payne-kalshi:control:v1';;
              series) key='payne-kalshi:real-series:v1';;
              current) key='payne-kalshi:current:v1';;
            esac
            encoded=$(jq -rn --arg v "$key" '$v|@uri')
            status=$(curl --silent --show-error --max-time 25 --output "/tmp/p-$item.json" --write-out '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$kv/$encoded")
            test "$status" = 200
            jq -e 'type=="object"' "/tmp/p-$item.json" >/dev/null
          done
          jq -c '{realControlSchema,armed,openPositions,activeThreshold,attemptTarget,maxEntryDebitUsd,scanEnabled,requiredExchangeIndex}' /tmp/p-control.json
          jq -c '{schema,owner,seriesId,status,configFrozen,threshold,attemptTarget,maxEntryDebitUsd,attemptsStarted,executionIntentsStarted,unresolvedEntry,currentAttempt:(if has("currentAttempt") then (if .currentAttempt==null then null else {status:.currentAttempt.status,providerPostStarted:.currentAttempt.providerPostStarted} end) else "MISSING" end),position:(if has("position") then (if .position==null then null else {status:.position.status,owner:.position.owner} end) else "MISSING" end),positionsCount:(if (.positions|type)=="array" then (.positions|length) else null end),fireLatch,providerPostStarted,providerOpenOrders,providerOpenPositions,unknownProviderObligations,coordinatorActiveClaims,providerExposureStatus,providerReconciliationStatus}' /tmp/p-series.json
          jq -c '{source,at}' /tmp/p-current.json
          jq -n --slurpfile c /tmp/p-control.json --slurpfile s /tmp/p-series.json --slurpfile d /tmp/p-deploy.json '
             {version:(. as $unused|$d[0].result.deployments[0].versions),
              disarmed:($c[0].armed==false),
              exactSeries:($s[0].seriesId=="bd881b11-b130-491f-a75f-a98425b92fd9"),
              recoveredSoftwareConfigCandidate:($c[0].armed==false and $c[0].openPositions==0 and $s[0].seriesId=="bd881b11-b130-491f-a75f-a98425b92fd9" and $s[0].configFrozen==true and $s[0].attemptsStarted==0 and $s[0].executionIntentsStarted==0 and $s[0].unresolvedEntry==false and $s[0].currentAttempt==null and $s[0].position==null and ($s[0].positions|type)=="array" and ($s[0].positions|length)==0 and ($s[0].fireLatch==null or $s[0].fireLatch.state=="NONE") and $s[0].providerPostStarted==false),
              providerFlatProof:"NOT_OBTAINED_BY_KV_GET",
              coordinatorCoverage:"NOT_OBTAINED_BY_KV_GET"}'
          echo 'LIVE_READINESS_GET_ONLY=FINISHED_NO_PRODUCTION_MUTATION'

      - name: Read exact existing DOGE disarm audit using bounded Cloudflare KV GETs
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,urllib.error
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          root=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125'
          target_series='02809a98-c978-4ef4-992e-ebb894243a1a'
          target_time='2026-10-19T04:41:06.587Z'
          prefix='payne:disarm-audit:v1:'
          def get(url):
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token},method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as response:
                      return response.status,json.loads(response.read(1500000))
              except urllib.error.HTTPError as e:
                  print('CLOUDFLARE_READ_HTTP_STATUS='+str(e.code))
                  raise
          cursor=None
          found=[]
          total=0
          # Never scan or emit unrelated KV values; fail closed if key list is too large.
          for page in range(1,6):
              params={'prefix':prefix,'limit':'100'}
              if cursor:params['cursor']=cursor
              status,body=get(root+'/keys?'+urllib.parse.urlencode(params))
              print('AUDIT_KEY_LIST_PAGE='+str(page)+' HTTP='+str(status))
              if not body.get('success') or not isinstance(body.get('result'),list):
                  raise RuntimeError('KV_KEY_LIST_INVALID')
              keys=[x.get('name') for x in body['result'] if isinstance(x,dict)]
              total+=len(keys)
              for key in keys:
                  if not isinstance(key,str) or not key.startswith(prefix):continue
                  record_status,rec=get(root+'/values/'+urllib.parse.quote(key,safe=''))
                  if record_status!=200 or not isinstance(rec,dict):raise RuntimeError('KV_AUDIT_VALUE_INVALID')
                  p=rec.get('payload') if isinstance(rec.get('payload'),dict) else rec
                  if p.get('seriesId')==target_series and p.get('eventTimestamp')==target_time:
                      fields=['transitionId','seriesId','eventTimestamp','previousArmed','newArmed','actor','triggeringFunction','reasonCode','failClosedReason','attemptsStarted','attemptTarget','ownedPositions','unresolvedEntry','completedAt']
                      evidence={k:({'exists':True,'type':'null' if p[k] is None else type(p[k]).__name__,'value':p[k]} if k in p else {'exists':False,'type':'ABSENT'}) for k in fields}
                      found.append({'auditState':rec.get('state','NOT_EXPOSED'),'eventType':'PAYNE_ARM_TRANSITION_V1 (ledger type; audit payload)','evidence':evidence})
              info=body.get('result_info') or {}
              cursor=info.get('cursor')
              if not cursor:
                  print('AUDIT_PREFIX_SCAN_COMPLETE=true')
                  break
          else:
              print('AUDIT_PREFIX_SCAN_COMPLETE=false BOUNDED_LIMIT_REACHED')
          print('AUDIT_KEYS_CHECKED='+str(total))
          print('EXACT_DISARM_MATCH_COUNT='+str(len(found)))
          for entry in found:print('EXACT_DISARM_AUDIT='+json.dumps(entry,separators=(',',':')))
          if not found:print('DISARM_AUDIT_VERDICT=NOT_FOUND_WITHIN_SCANNED_PREFIX')
          PY
