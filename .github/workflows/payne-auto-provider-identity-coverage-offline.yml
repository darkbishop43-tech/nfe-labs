name: PAYNE AUTO Provider Identity Coverage Audit
on:
  push:
    branches: [payne-auto-ownership-provider-audit-20261015]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify coverage gaps and retain existing trading regressions
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --test test/auto-provider-identity-coverage-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
