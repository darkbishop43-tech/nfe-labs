name: PAYNE Top Three Staircase V2 Offline
on:
  push:
    branches: [payne-staircase-top3-v2-isolated-20261015]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify direct read-only V2 and all trading regressions
        working-directory: market-edge-lab/real/payne-kalshi-real
        run: |
          set -euo pipefail
          node --check src/index.js
          node --check src/cockpit-html.js
          node --test test/staircase-top3-v2-offline.test.mjs
          npm test
          echo PRODUCTION_MUTATIONS=NONE
