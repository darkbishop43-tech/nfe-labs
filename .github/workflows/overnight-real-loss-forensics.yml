name: Overnight Real Loss Forensics
on:
  push:
    branches: [market-edge-baseline-real]
    paths: ['.github/workflows/overnight-real-loss-forensics.yml']
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Read-only persisted and authenticated Worker evidence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 kv key get 'baseline-real-execution-test-v1' --namespace-id d110292129c94b26942c25d0c462a17b --remote > /tmp/state.json
          echo "=== AUTHENTICATED LIVE READ ==="
          curl -fsS 'https://market-edge-baseline-real.darkbishop43.workers.dev/execution-test-state' | tee /tmp/live.json
          echo
          node <<'NODE'
          const fs=require('fs');
          const st=JSON.parse(fs.readFileSync('/tmp/state.json','utf8')), live=JSON.parse(fs.readFileSync('/tmp/live.json','utf8'));
          const qid=st.queue?.queueId, all=[];
          const add=(stage,a)=>all.push({queueId:qid,stage,...a});
          for(const cs of st.queue?.completedStages||[]) for(const a of cs.attempts||[]) add(cs.threshold,a);
          for(const a of st.attempts||[]) add(st.threshold,a);
          const seen=new Set(), aa=all.filter(a=>{const k=[a.stage,a.attemptNo,a.orderId||a.clientOrderId].join('|');if(seen.has(k))return false;seen.add(k);return true});
          console.log('LIVE='+JSON.stringify(live));
          console.log('STATE_META='+JSON.stringify({status:st.status,armed:st.armed,threshold:st.threshold,attemptsStarted:st.attemptsStarted,queue:st.queue,updatedAt:st.updatedAt}));
          console.log('ATTEMPTS='+JSON.stringify(aa));
          console.log('POSITIONS='+JSON.stringify(st.positions||[]));
          console.log('LEDGER='+JSON.stringify(st.ledger||[]));
          console.log('HISTORY='+JSON.stringify(st.queueHistory||[]));
          NODE
