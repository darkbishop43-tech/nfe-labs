name: Deploy Founder Cockpit Phase 2

on:
  push:
    branches: [founder-cockpit-phase2]
    paths:
      - 'market-edge-lab/real/baseline/founder-terminal.html'
      - 'market-edge-lab/real/cockpit/**'
      - '.github/workflows/deploy-founder-cockpit-phase2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/cockpit
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static cockpit asset
        run: |
          mkdir -p public
          cp ../baseline/founder-terminal.html public/index.html
      - name: Verify Cloudflare credentials are present
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Deploy isolated cockpit Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
