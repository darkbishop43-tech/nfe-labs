name: Deploy Baseline Real Worker

# NFE-OS deployment trigger: compact control-page source commit 1d023fd
on:
  push:
    branches:
      - market-edge-baseline-real
    paths:
      - 'market-edge-lab/real/baseline/**'
      - '.github/workflows/deploy-baseline-real.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-baseline-real-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Baseline Real dependencies
        run: npm install --no-audit --no-fund
      - name: Validate required Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
      - name: Ensure Web Push VAPID secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          names="$(npx wrangler secret list --format json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{for(const x of JSON.parse(s)) console.log(x.name)})')"
          if ! grep -qx 'NFE_PUSH_VAPID_PUBLIC_KEY' <<<"$names" || ! grep -qx 'NFE_PUSH_VAPID_PRIVATE_KEY' <<<"$names"; then
            node --input-type=module -e 'import {generateVapidKeys} from "@mmmike/web-push/vapid"; const k=await generateVapidKeys(); await import("node:fs").then(fs=>fs.writeFileSync("/tmp/nfe-vapid.json",JSON.stringify(k),{mode:0o600}));'
            node -e 'const k=require("/tmp/nfe-vapid.json");process.stdout.write(k.publicKey)' | npx wrangler secret put NFE_PUSH_VAPID_PUBLIC_KEY
            node -e 'const k=require("/tmp/nfe-vapid.json");process.stdout.write(k.privateKey)' | npx wrangler secret put NFE_PUSH_VAPID_PRIVATE_KEY
            rm -f /tmp/nfe-vapid.json
          fi
      - name: Deploy Baseline Real only
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
      - name: Verify zero-money Founder Funding return path
        shell: bash
        working-directory: .
        run: |
          set -euo pipefail
          B='https://market-edge-baseline-real.darkbishop43.workers.dev'
          curl -fsS "$B/founder-funding-zero-money-proof" -o /tmp/funding-proof.json
          jq -e '.ok==true and .state=="FOUNDER_FUNDING_3_TO_2_ZERO_MONEY_PROOF" and .providerTransferPosts==0 and .orders==0 and .capitalMovedUsd==0 and .reviewOk.ok==true and .confirmOk.ok==true and .reviewWrongSource.ok==false and .reviewWrongDestination.ok==false and .reviewArmed.ok==false and .reviewOpen.ok==false and .confirmStale.ok==false and .confirmChanged.ok==false and .confirmReplay.ok==false' /tmp/funding-proof.json >/dev/null
          echo "FUNDING_ZERO_MONEY_PROOF=$(jq -c . /tmp/funding-proof.json)"
