name: One-shot PAYNE unresolved-entry reconciliation

on:
  push:
    branches: [market-edge-payne-kalshi-real-step1]
    paths:
      - '.github/workflows/reconcile-payne-unresolved-once.yml'

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Verify stale PAYNE attempt, reconcile from provider truth, verify ledger
        shell: bash
        run: |
          set -euo pipefail
          P='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          EXPECT_SERIES='bf895286-a6b1-4330-8e20-68f5d53030f5'
          EXPECT_TICKER='KXNEAR15M-26OCT031515-15'

          curl -fsS "$P/real-state" -o /tmp/before.json
          jq -e --arg s "$EXPECT_SERIES" --arg t "$EXPECT_TICKER" '
            .schema=="PAYNE_REAL_STATE_V1" and
            .control.armed==false and
            .control.maxEntryDebitUsd==1 and
            .control.activeThreshold==0.70 and
            .control.requiredExchangeIndex==2 and
            .control.providerWriteAuthority=="BUILT_INACTIVE_DISARMED" and
            .series.seriesId==$s and
            .series.status=="ENTRY_RECONCILIATION_REQUIRED" and
            .series.attemptsStarted==1 and
            .series.attemptTarget==1 and
            .series.unresolvedEntry==true and
            .series.position==null and
            .series.currentAttempt.marketTicker==$t and
            .series.currentAttempt.providerHttpStatus==403 and
            .providerWrites==0 and
            .ordersSubmittedByThisRead==0 and
            .capitalMovedUsd==0
          ' /tmp/before.json >/dev/null
          echo "PRE_RECONCILE=$(jq -c '{control:{armed:.control.armed,attemptTarget:.control.attemptTarget,stake:.control.maxEntryDebitUsd,threshold:.control.activeThreshold,index:.control.requiredExchangeIndex},series:{seriesId:.series.seriesId,status:.series.status,attemptsStarted:.series.attemptsStarted,unresolvedEntry:.series.unresolvedEntry,position:.series.position,ticker:.series.currentAttempt.marketTicker,httpStatus:.series.currentAttempt.providerHttpStatus}}' /tmp/before.json)"

          curl -fsS -X POST "$P/control"             -H 'content-type: application/json'             --data '{"action":"RECONCILE_UNRESOLVED_ENTRY"}'             -o /tmp/reconcile.json

          jq -e --arg t "$EXPECT_TICKER" '
            .ok==true and
            .classification=="NO_FILL" and
            .reason=="PROVIDER_REJECTED_NO_EXECUTION_CONFIRMED" and
            .ticker==$t and
            .providerHttpStatus==403 and
            .exactTickerFillCount==0 and
            .exactTickerSettlementCount==0 and
            ((.providerPositionClassification=="ABSENT") or (.providerPositionClassification=="FLAT")) and
            .series.unresolvedEntry==false and
            .series.position==null and
            .series.status=="COMPLETE_NO_FILL_RECONCILED" and
            .control.armed==false and
            .control.openPositions==0 and
            .providerWrites==0 and
            .orders==0 and
            .capitalMovedUsd==0
          ' /tmp/reconcile.json >/dev/null
          echo "RECONCILE_RESULT=$(jq -c '{classification,reason,ticker,providerHttpStatus,exactTickerFillCount,exactTickerSettlementCount,providerPositionClassification,series:{status:.series.status,unresolvedEntry:.series.unresolvedEntry,position:.series.position},control:{armed:.control.armed,openPositions:.control.openPositions,attempts:.control.attempts},providerWrites,orders,capitalMovedUsd}' /tmp/reconcile.json)"

          curl -fsS "$P/real-state" -o /tmp/after.json
          curl -fsS "$P/real-ledger?limit=500" -o /tmp/ledger.json

          jq -e --arg s "$EXPECT_SERIES" --arg t "$EXPECT_TICKER" '
            .control.armed==false and
            .control.openPositions==0 and
            .control.requiredExchangeIndex==2 and
            .series.seriesId==$s and
            .series.status=="COMPLETE_NO_FILL_RECONCILED" and
            .series.unresolvedEntry==false and
            .series.position==null and
            .series.currentAttempt.status=="NO_FILL" and
            .series.currentAttempt.marketTicker==$t and
            .providerWrites==0 and
            .ordersSubmittedByThisRead==0 and
            .capitalMovedUsd==0
          ' /tmp/after.json >/dev/null

          jq -e --arg s "$EXPECT_SERIES" --arg t "$EXPECT_TICKER" '
            [.rows[]|select(.type=="ENTRY_RECONCILED_NO_EXECUTION" and .seriesId==$s and .ticker==$t)] | length >= 1
          ' /tmp/ledger.json >/dev/null

          echo "POST_RECONCILE=$(jq -c '{control:{armed:.control.armed,attempts:.control.attempts,attemptTarget:.control.attemptTarget,openPositions:.control.openPositions,stake:.control.maxEntryDebitUsd,threshold:.control.activeThreshold,index:.control.requiredExchangeIndex,fundingAuthority:.control.fundingAuthority},series:{seriesId:.series.seriesId,status:.series.status,attemptsStarted:.series.attemptsStarted,attemptTarget:.series.attemptTarget,unresolvedEntry:.series.unresolvedEntry,position:.series.position,currentAttemptStatus:.series.currentAttempt.status},providerWrites,ordersSubmittedByThisRead,capitalMovedUsd}' /tmp/after.json)"
          echo "LEDGER_RECONCILE_ROWS=$(jq -c --arg s "$EXPECT_SERIES" '[.rows[]|select(.type=="ENTRY_RECONCILED_NO_EXECUTION" and .seriesId==$s)]' /tmp/ledger.json)"
