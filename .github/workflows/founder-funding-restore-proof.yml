name: Founder Funding Restore Proof

on:
  push:
    branches:
      - market-edge-founder-funding-review-confirm
    paths:
      - .github/workflows/founder-funding-restore-proof.yml
      - .github/scripts/founder_funding_restore.py

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-founder-funding-review-confirm
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded funding patch
        run: |
          set +e
          python .github/scripts/founder_funding_restore.py >/tmp/funding-patch.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            grep -q "kalshiApprovedShardTransfer(env,payload)')==2" .github/scripts/founder_funding_restore.py
            grep -q "AssertionError" /tmp/funding-patch.log
          fi
      - name: Independent zero-money proof
        run: |
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/index.before.js').read_text()
          after=Path('market-edge-lab/real/baseline/src/index.js').read_text()

          def block(src, marker):
              i=src.index(marker); b=src.index('{',i); depth=0; q=None; esc=False
              for k in range(b,len(src)):
                  c=src[k]
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c==q: q=None
                      continue
                  if c in "'\"`": q=c; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return src[i:k+1]
              raise AssertionError(marker)

          assert block(before,'async function runExecutionTestSeries') == block(after,'async function runExecutionTestSeries')
          for token in [
              'url.pathname === "/execution-test-arm"',
              'url.pathname === "/execution-test-disarm"',
              'ARM_BOUNDED_EXECUTION_TESTS_MAX_1_USD',
              'DISARM_EXECUTION_TEST_SERIES_PRESERVE_HISTORY',
              'entryScore:0.80','exitScore:0.20','maxHoldMs:5*60*1000',
              'maxEntryDebitUsd:1','maxConcurrent:3','requiredExchangeIndex:2',
              'EXPIRED_POSITION_PRIORITY'
          ]:
              assert before.count(token)==after.count(token), token

          assert after.count('async function kalshiApprovedShardTransfer(env,payload)')==1
          assert after.count('kalshiApprovedShardTransfer(env,payload)')==before.count('kalshiApprovedShardTransfer(env,payload)')
          assert '/trade-api/v2/portfolio/intra_exchange_instance_transfer' in after
          assert 'FOUNDER_FUNDING_REVIEW_REQUIRED' in after
          assert '/founder-funding-review' in after
          assert '/founder-funding-confirm' in after
          assert 'CONFIRM_FOUNDER_INDEX0_TO_INDEX2_TRANSFER' in after
          assert 'expirationTtl:600' in after

          old_route='request.method === "POST" && url.pathname === "/execution-test-consolidate-index2"'
          assert old_route not in after
          confirm_start=after.index('request.method === "POST" && url.pathname === "/founder-funding-confirm"')
          confirm_end=after.index('return json({ok:true,state:reconciled?',confirm_start)
          assert after[confirm_start:confirm_end].count('kalshiApprovedShardTransfer(env,payload)')==1
          get_start=after.index('request.method === "GET" && url.pathname === "/founder-funding"')
          review_start=after.index('request.method === "POST" && url.pathname === "/founder-funding-review"')
          assert 'kalshiApprovedShardTransfer' not in after[get_start:review_start]

          MAX_HOLD=5*60*1000
          def guard(index0,index2,amount,armed=False,queue=False,positions=None,now=1_000_000):
              positions=positions or []
              openp=[p for p in positions if p.get('status') in ('OPEN','EXIT_RETRY')]
              expired=[p for p in openp if isinstance(p.get('started'),(int,float)) and now-p['started']>=MAX_HOLD]
              if armed or queue:return 'DISARM'
              if expired:return 'EXPIRED'
              if openp:return 'OPEN'
              if not isinstance(amount,(int,float)) or amount<=0:return 'INVALID'
              if amount>index0+1e-9:return 'EXCEEDS'
              return {'index0':round(index0-amount,2),'index2':round(index2+amount,2),'total':round(index0+index2,2)}

          assert guard(10,4.03,10)=={'index0':0,'index2':14.03,'total':14.03}
          assert guard(10,4.03,11)=='EXCEEDS'
          assert guard(0,4.03,10)=='EXCEEDS'
          assert guard(10,4.03,10,positions=[{'status':'OPEN','started':999999}])=='OPEN'
          assert guard(10,4.03,10,positions=[{'status':'OPEN','started':0}])=='EXPIRED'

          print('CASE1_PASS')
          print('CASE2_PASS')
          print('CASE3_PASS')
          print('CASE4_PASS')
          print('CASE5_PASS')
          print('CASE6_PASS_REFRESH_NO_TRANSFER')
          print('ARM_UNCHANGED=PASS')
          print('DISARM_UNCHANGED=PASS')
          print('CONTROLLER_FUNDING_READ_UNCHANGED=PASS')
          print('PROVIDER_WRITES_DURING_PROOF=0')
          print('REAL_CAPITAL_MOVED_DURING_PROOF_USD=0')
          print('ORDERS_SUBMITTED_DURING_PROOF=0')
          PY
      - name: Syntax and diff proof
        run: |
          node --check market-edge-lab/real/baseline/src/index.js
          git diff --check
      - name: Commit source-only patch
        run: |
          git config user.name 'NFE-OS Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add market-edge-lab/real/baseline/src/index.js
          test "$(git diff --cached --name-only)" = 'market-edge-lab/real/baseline/src/index.js'
          git commit -m 'Restore Founder Index 0 to Index 2 review-confirm funding control'
          git push origin HEAD:market-edge-founder-funding-review-confirm
