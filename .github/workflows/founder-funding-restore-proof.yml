name: Founder Funding Restore Proof

on:
  push:
    branches:
      - market-edge-founder-funding-review-confirm
    paths:
      - .github/workflows/founder-funding-restore-proof.yml
      - .github/scripts/founder_funding_restore.py

permissions:
  contents: write

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-founder-funding-review-confirm
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply bounded funding patch and zero-money proof
        run: python .github/scripts/founder_funding_restore.py
      - name: Syntax and diff proof
        run: |
          node --check market-edge-lab/real/baseline/src/index.js
          git diff --check
      - name: Commit source-only patch
        run: |
          git config user.name 'NFE-OS Builder'
          git config user.email 'actions@users.noreply.github.com'
          git add market-edge-lab/real/baseline/src/index.js
          test "$(git diff --cached --name-only)" = 'market-edge-lab/real/baseline/src/index.js'
          git commit -m 'Restore Founder Index 0 to Index 2 review-confirm funding control'
          git push origin HEAD:market-edge-founder-funding-review-confirm
