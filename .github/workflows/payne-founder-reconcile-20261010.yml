name: PAYNE Founder Governed Reconciliation Once
on:
  push:
    branches:
      - payne-founder-reconcile-20261010
    paths:
      - ".github/workflows/payne-founder-reconcile-20261010.yml"
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read production PAYNE state and display after deployed maintenance
        shell: bash
        run: |
          set -euo pipefail
          base='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          for p in control ui-state display-market-feed; do
            status=$(curl --connect-timeout 12 --max-time 30 --silent --show-error -o "/tmp/payne-$p.json" -w '%{http_code}' "$base/$p")
            echo "GET_$p=$status"
          done
          jq -c '{armed:.control.armed,attemptTarget:.control.attemptTarget,openPositions:.control.openPositions,maxPositions:.control.maxPositions}' /tmp/payne-control.json
          jq -c '{keys:keys,series:{id:.realExecution.series.seriesId,unresolved:.realExecution.series.unresolvedEntry,latch:.realExecution.series.fireLatch.state,attempt:.realExecution.series.currentAttempt.status}}' /tmp/payne-ui-state.json
          jq -c '{keys:keys}' /tmp/payne-display-market-feed.json
      - name: Invoke existing PAYNE provider and coordinator reconciliation
        shell: bash
        run: |
          set -euo pipefail
          url='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev/control'
          echo 'CONTROL_ACTION=RECONCILE_UNRESOLVED_ENTRY'
          echo 'REQUEST_HOST=market-edge-payne-kalshi-real.darkbishop43.workers.dev'
          if ! getent ahostsv4 market-edge-payne-kalshi-real.darkbishop43.workers.dev >/dev/null; then
            echo 'RECOVERY_FAILED=WORKER_DNS_UNREACHABLE'
            exit 1
          fi
          status=$(curl --retry 0 --connect-timeout 12 --max-time 55 --silent --show-error \
            -o /tmp/payne-reconcile-response.json -w '%{http_code}' \
            -X POST "$url" -H 'content-type: application/json' \
            --data '{"action":"RECONCILE_UNRESOLVED_ENTRY"}')
          echo "PRODUCTION_HTTP_STATUS=$status"
          if ! jq -e 'type=="object"' /tmp/payne-reconcile-response.json >/dev/null; then
            echo 'RECOVERY_FAILED=INVALID_PRODUCTION_RESPONSE'
            exit 1
          fi
          jq -c '{ok,classification,reason,series:{seriesId:.series.seriesId,unresolvedEntry:.series.unresolvedEntry,fireLatch:.series.fireLatch,attempt:{attemptId:.series.currentAttempt.attemptId,marketTicker:.series.currentAttempt.marketTicker,clientOrderId:.series.currentAttempt.clientOrderId,status:.series.currentAttempt.status,reconciliationReason:.series.currentAttempt.reconciliationReason}},control:{armed:.control.armed,openPositions:.control.openPositions}}' /tmp/payne-reconcile-response.json
          if [[ "$status" != 200 ]] || ! jq -e '.ok==true' /tmp/payne-reconcile-response.json >/dev/null; then
            echo 'RECOVERY_FAILED=PRODUCTION_RECONCILIATION_REJECTED'
            exit 1
          fi
          echo 'RECOVERY_ACTION_ACCEPTED_BY_PRODUCTION'
