name: PAYNE Five Attempt Read Only Evidence
on:
  push:
    branches: [payne-five-attempt-readonly-20261012]
    paths: ['.github/workflows/payne-five-attempt-readonly.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing October 12 KV ledger values in parallel read-only
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.parse,concurrent.futures,time
          base=f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/storage/kv/namespaces/03352b0ccb034f1bb8206f663a04b125"
          header={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN']}
          prefix='payne-kalshi:real-ledger:2026-10-12'
          url=base+'/keys?prefix='+urllib.parse.quote(prefix,safe='')+'&limit=1000'
          with urllib.request.urlopen(urllib.request.Request(url,headers=header),timeout=40) as resp: listing=json.load(resp)
          assert listing.get('success'),listing.get('errors')
          keys=[x['name'] for x in listing['result']]
          print('OCT12_KEYS',len(keys),'CURSOR',bool(listing.get('result_info',{}).get('cursor')),flush=True)
          def get(key):
            req=urllib.request.Request(base+'/values/'+urllib.parse.quote(key,safe=''),headers=header)
            try:
              with urllib.request.urlopen(req,timeout=35) as resp:
                return key,json.load(resp),None
            except Exception as e:return key,None,str(e)
          records=[];fail=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
            for key,row,error in pool.map(get,keys):
              if error:fail.append([key,error])
              elif isinstance(row,dict):records.append(row)
          print('VALUES_RECOVERED',len(records),'FAILED',len(fail),flush=True)
          for key,error in fail[:15]:print('KV_VALUE_ERROR',key,error,flush=True)
          records.sort(key=lambda x:x.get('at',''))
          with open('oct12-evidence.json','w') as f:json.dump(records,f)
          important=[r for r in records if any(w in (str(r.get('type',''))) for w in ['ENTRY','FIRE','SERIES','PROVIDER','ATTEMPT','POSITION'])]
          print('IMPORTANT_ROWS',len(important),flush=True)
          for row in important:
            fields=['at','type','seriesId','attemptId','attemptNo','intentNo','ticker','marketTicker','clientOrderId','outcomeSide','writerInvoked','providerPostStarted','httpStatus','providerHttpStatus','providerOrderId','terminalClassification','reconciliationReason','result','reason','status']
            slim={k:row[k] for k in fields if k in row}
            print('EVIDENCE_ROW',json.dumps(slim,separators=(',',':'),default=str),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payne-oct12-kv-evidence
          path: oct12-evidence.json
          retention-days: 1
