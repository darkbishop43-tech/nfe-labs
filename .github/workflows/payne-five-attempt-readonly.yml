name: PAYNE Five Attempt Read Only Evidence
on:
  push:
    branches: [payne-five-attempt-readonly-20261012]
    paths: ['.github/workflows/payne-five-attempt-readonly.yml']
permissions: {contents: read}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing live history ledger and state
        shell: bash
        run: |
          set -euo pipefail
          base=https://market-edge-payne-kalshi-real.darkbishop43.workers.dev
          curl --fail --silent --show-error --retry 0 --max-time 50 "$base/real-state" -o state.json
          curl --fail --silent --show-error --retry 0 --max-time 50 "$base/real-ledger?limit=1000" -o ledger.json
          curl --fail --silent --show-error --retry 0 --max-time 50 "$base/real-history" -o history.json
          python3 - <<'PY'
          import json
          for name in ['state','ledger','history']:
            d=json.load(open(name+'.json'))
            print('DATASET',name,'TYPE',type(d).__name__,'KEYS',list(d) if isinstance(d,dict) else 'array',flush=True)
            if name=='state':
              s=d.get('series') or {}
              print('STATE',json.dumps({'seriesId':s.get('seriesId'),'status':s.get('status'),'attemptsStarted':s.get('attemptsStarted'),'unresolvedEntry':s.get('unresolvedEntry'),'controlArmed':(d.get('control') or {}).get('armed')}),flush=True)
            if name=='ledger':
              rows=d.get('rows') or []
              print('LEDGER_COUNT',len(rows),flush=True)
              for row in rows:
                if not isinstance(row,dict): continue
                t=str(row.get('type') or row.get('event') or '')
                if any(p in t for p in ('ENTRY_','EXECUTION_','PROVIDER_','FIRE_')):
                  print('LEDGER',json.dumps(row,default=str)[:2000],flush=True)
            if name=='history':
              print('HISTORY_DATA',json.dumps(d,default=str)[:18000],flush=True)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: payne-five-attempt-existing-reads
          path: |
            state.json
            ledger.json
            history.json
          retention-days: 1
