name: Fix Three Layer Null Safety
on:
  push:
    branches: [market-edge-observability-ledger-v1]
    paths:
      - '.github/workflows/fix-three-layer-null-safety.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-edge-observability-ledger-v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze execution source
        run: sha256sum market-edge-lab/real/baseline/src/index.js | tee /tmp/before.sha
      - name: Fix null-safe numeric parsing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market-edge-lab/real/baseline/founder-terminal.html')
          s=p.read_text()
          old="const q=id=>document.getElementById(id), A=x=>Array.isArray(x)?x:[], N=v=>Number.isFinite(Number(v))?Number(v):null;"
          new="const q=id=>document.getElementById(id), A=x=>Array.isArray(x)?x:[], N=v=>(v===null||v===undefined||v==='')?null:(Number.isFinite(Number(v))?Number(v):null);"
          if old not in s: raise SystemExit('numeric helper anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify and syntax check
        run: |
          sha256sum market-edge-lab/real/baseline/src/index.js > /tmp/after.sha
          diff -u /tmp/before.sha /tmp/after.sha
          test "$(git diff --name-only)" = "market-edge-lab/real/baseline/founder-terminal.html"
          grep -q "v===null||v===undefined||v===''" market-edge-lab/real/baseline/founder-terminal.html
          python3 - <<'PY'
          import re,pathlib,subprocess,tempfile
          s=pathlib.Path('market-edge-lab/real/baseline/founder-terminal.html').read_text()
          for src in re.findall(r'<script>(.*?)</script>',s,re.S):
            f=tempfile.NamedTemporaryFile('w',suffix='.js',delete=False);f.write(src);f.close();subprocess.run(['node','--check',f.name],check=True)
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add market-edge-lab/real/baseline/founder-terminal.html
          git commit -m 'Fix null-safe observability classifications'
          git push origin HEAD:market-edge-observability-ledger-v1
