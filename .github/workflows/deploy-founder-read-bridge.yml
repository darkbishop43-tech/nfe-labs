name: Deploy Founder Cockpit Read Bridge
on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - 'market-edge-lab/real/founder-read-bridge/**'
      - '.github/workflows/deploy-founder-read-bridge.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-founder-cockpit-read-bridge
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: market-edge-lab/real/founder-read-bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy read-only bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy
