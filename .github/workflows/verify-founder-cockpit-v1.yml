name: Verify Founder Trading Cockpit V1

on:
  push:
    branches: [market-edge-baseline-real]
    paths:
      - '.github/workflows/verify-founder-cockpit-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging cockpit and protected runtime
        shell: bash
        run: |
          set -euo pipefail
          B='https://market-edge-baseline-real.darkbishop43.workers.dev'
          R='https://market-edge-founder-read.darkbishop43.workers.dev'
          U='https://raw.githack.com/darkbishop43-tech/nfe-labs/market-edge-baseline-real/market-edge-lab/real/baseline/founder-terminal.html'
          curl -fsS "$U" -o /tmp/cockpit.html
          for p in shadow-state wide-radar-state execution-test-state real-trade-state; do curl -fsS "$B/$p" -o "/tmp/$p.json"; done
          curl -sSI "$R/shadow-state" > /tmp/headers.txt
          curl -fsS "$R/wide-radar-state" -o /tmp/bridge-radar.json
          curl -fsS "$R/health" -o /tmp/bridge-health.json
          curl -fsS "$B/founder-capital-ledger" -o /tmp/capital.json
          curl -fsS "$B/founder-manual-close-proof" -o /tmp/close-proof.json
          cp /tmp/execution-test-state.json /tmp/exec-before.json
          curl -fsS "$B/execution-test-state" -o /tmp/exec-after.json
          python - <<'PY'
          import json,re,hashlib
          h=open('/tmp/cockpit.html',encoding='utf-8').read()
          src=open('market-edge-lab/real/baseline/src/index.js','rb').read()
          sh=json.load(open('/tmp/shadow-state.json')); wr=json.load(open('/tmp/wide-radar-state.json')); ex=json.load(open('/tmp/execution-test-state.json')); rt=json.load(open('/tmp/real-trade-state.json'))
          hdr=open('/tmp/headers.txt').read().lower(); br=json.load(open('/tmp/bridge-radar.json')); bh=json.load(open('/tmp/bridge-health.json'))
          cap=json.load(open('/tmp/capital.json')); cp=json.load(open('/tmp/close-proof.json')); eb=json.load(open('/tmp/exec-before.json')); ea=json.load(open('/tmp/exec-after.json'))
          s=src.decode('utf-8')
          out={
            'cockpit_title':'Founder Trading Cockpit V1' in h,
            'professional_regions':all(x in h for x in ['MARKET EDGE WATCHLIST','CONTRACT INSPECTOR','FOUNDER MANUAL ORDER','POSITIONS','REAL LEDGER','NO_FILL']),
            'manual_submit_disabled':'SUBMIT FOUNDER ORDER · NOT AUTHORIZED' in h and '<button class="submit" disabled>' in h,
            'no_iframe':'<iframe' not in h.lower(),
            'no_post_method':('method: "POST"' not in h and "method: 'POST'" not in h and 'method="POST"' not in h),
            'mobile_breakpoint':'@media(max-width:520px)' in h,
            'execution_source_sha1':hashlib.sha1(src).hexdigest(),
            'shadow_status':sh.get('status'),
            'shadow_lastRunAt':sh.get('lastRunAt'),
            'entryScore':(wr.get('frozen') or {}).get('productionEntryScore'),
            'exitScore':(wr.get('frozen') or {}).get('exitScore'),
            'opportunities':len((wr.get('live') or {}).get('opportunities') or []),
            'exec_status':(ex.get('state') or {}).get('status'),
            'exec_armed':(ex.get('state') or {}).get('armed'),
            'attemptsStarted':(ex.get('state') or {}).get('attemptsStarted'),
            'cors_header':next((x.strip() for x in hdr.splitlines() if x.startswith('access-control-allow-origin:')),None),
            'providerCashUsd':rt.get('providerCashUsd'),
            'bridge_ok':bh.get('ok'),
            'bridge_writes':bh.get('writes'),
            'bridge_credentials':bh.get('credentials'),
            'bridge_opportunities':len((br.get('live') or {}).get('opportunities') or []),
            'cockpit_uses_bridge':'market-edge-founder-read.darkbishop43.workers.dev' in h,
            'founderAllocationUsd':((cap.get('sleeves') or {}).get('FOUNDER_MANUAL') or {}).get('allocatedCapitalUsd'),
            'manualEntryAuthorized':(cap.get('gates') or {}).get('manualEntryAuthorized'),
            'manualExitAuthorized':(cap.get('gates') or {}).get('manualExitAuthorized'),
            'closeProofOk':cp.get('ok'),
            'closeReduceOnly':((cp.get('assertions') or {}).get('reduceOnly')),
            'closeReverseSide':((cp.get('assertions') or {}).get('reverseBookSide')),
            'closeProviderWrites':((cp.get('assertions') or {}).get('providerWrites')),
            'autoIdentical':eb.get('state')==ea.get('state'),
            'entryFounderCapitalGate':'MANUAL_PREVIEW_FOUNDER_ALLOCATION_INSUFFICIENT' in s,
            'entryAutoGate':'MANUAL_PREVIEW_AUTO_ACTIVE_FAIL_CLOSED' in s,
            'entryOneContract':'MANUAL_V1_ONE_CONTRACT_ONLY' in s,
            'entryIocOnly':'MANUAL_V1_MODE_NOT_PROVEN' in s,
            'entryMaxDebit':'MANUAL_V1_MAX_DEBIT_EXCEEDED' in s,
            'staleEntry':'MANUAL_PREVIEW_PRICE_STALE_REFRESH_REQUIRED' in s,
            'closeUnknown':'FOUNDER_CLOSE_REJECT_PROVIDER_POSITION_UNKNOWN' in s,
            'closeStale':'FOUNDER_CLOSE_REJECT_STALE_QUOTE' in s,
            'closeAmbiguous':'FOUNDER_CLOSE_REJECT_OWNERSHIP_AMBIGUOUS_AUTO_CONFLICT' in s,
            'closeSafeQuantity':'safeQuantity=Math.min(remaining,pq)' in s,
            'manualWriteRouteAbsent':'entryWriteRoutePresent:false' in s and 'providerWriteRoutePresent:false' in s
          }
          print(json.dumps(out,indent=2))
          assert out['cockpit_title'] and out['professional_regions'] and out['manual_submit_disabled']
          assert out['no_iframe'] and out['no_post_method'] and out['mobile_breakpoint']
          assert out['entryScore']==.8 and out['exitScore']==.2
          assert out['shadow_status']=='LIVE_KALSHI_SHADOW'
          assert out['cors_header']=='access-control-allow-origin: https://raw.githack.com'
          assert out['bridge_ok'] and out['bridge_writes']==0 and out['bridge_credentials']==0 and out['cockpit_uses_bridge']
          assert out['founderAllocationUsd']==0 and out['manualEntryAuthorized'] is False and out['manualExitAuthorized'] is False
          assert out['closeProofOk'] and out['closeReduceOnly'] and out['closeReverseSide'] and out['closeProviderWrites']==0
          assert out['autoIdentical']
          assert all(out[k] for k in ['entryFounderCapitalGate','entryAutoGate','entryOneContract','entryIocOnly','entryMaxDebit','staleEntry','closeUnknown','closeStale','closeAmbiguous','closeSafeQuantity','manualWriteRouteAbsent'])
          PY