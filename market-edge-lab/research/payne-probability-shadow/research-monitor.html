<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PAYNE Probability Shadow · Research</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0b1020;color:#f1f5f9}body{margin:0;max-width:1100px;padding:16px;margin:auto}header{border-bottom:1px solid #334155;margin-bottom:16px;padding-bottom:12px}h1{font-size:1.4rem;margin:0 0 8px}h2{margin:0 0 12px;font-size:1.1rem}.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}.toolbar button{background:#1e40af;border:1px solid #60a5fa;padding:10px 14px;border-radius:8px;color:white;font-weight:700;cursor:pointer}.toolbar button:disabled{opacity:.5}select{padding:8px;border-radius:8px;background:#1e293b;color:white}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}.asset{background:#151f32;padding:14px;border:1px solid #334155;border-radius:12px}.contract{padding:12px 0;border-top:1px solid #334155}.ticker{overflow-wrap:anywhere;font-weight:700;font-size:.85rem}.side{margin:8px 0;color:#fbbf24;font-size:.85rem}dl{display:grid;grid-template-columns:1fr 1.25fr;gap:5px;margin:10px 0;font-size:.81rem}dt{color:#94a3b8}dd{margin:0;overflow-wrap:anywhere}details{font-size:.8rem;color:#dbeafe}details p{overflow-wrap:anywhere}.unknown{color:#fca5a5}#state{font-size:.9rem;color:#fbbf24}</style></head>
<body><div class="toolbar"><button id="refresh">Refresh GET</button><label for="interval">Auto-refresh <select id="interval"><option value="0">Off</option><option value="30000">30 sec</option><option value="60000">60 sec</option></select></label></div><div id="state" role="status" aria-live="polite">Waiting for first GET</div><div id="screen"><header><h1>PAYNE Probability Shadow</h1><p>Research monitor · source not yet loaded</p></header></div>
<script type="module">
import {refreshMonitor,renderMonitor} from './research-monitor.mjs';
const TARGET='https://market-edge-payne-kalshi-real.darkbishop43.workers.dev';
const btn=document.querySelector('#refresh'),state=document.querySelector('#state'),screen=document.querySelector('#screen'),selector=document.querySelector('#interval');
let timer=null,busy=false;
async function refresh(){if(busy)return;busy=true;btn.disabled=true;state.textContent='Reading existing GET-only feed…';try{
const vm=await refreshMonitor({getJson:async path=>{if(path!=='/display-market-feed')throw Error('REJECTED_PATH');const r=await fetch(TARGET+path,{method:'GET',cache:'no-store',credentials:'omit'});if(!r.ok)throw Error('FEED_HTTP_'+r.status);return r.json();}});
screen.innerHTML=renderMonitor(vm);state.textContent='Research only · '+vm.coverage.totalObservations+' sides · '+vm.coverage.complete+' complete · '+vm.asOf;
}catch(e){state.textContent='UNKNOWN · feed unavailable ('+String(e?.message||'READ_FAILED').slice(0,80)+')';screen.innerHTML='<header><h1>PAYNE Probability Shadow</h1><p class="unknown">No verified new observations. UNKNOWN.</p></header>';}finally{busy=false;btn.disabled=false;}}
btn.addEventListener('click',refresh);selector.addEventListener('change',()=>{if(timer)clearInterval(timer);timer=null;const ms=Number(selector.value);if(ms>=30000)timer=setInterval(()=>{if(!document.hidden)refresh();},ms);});refresh();
</script></body></html>
