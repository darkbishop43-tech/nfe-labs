<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NFE-OS Founder Trader Terminal · Paper Labs</title><style>
body{margin:0;background:#0b0f14;color:#eef3f8;font-family:Arial,sans-serif}.wrap{max-width:920px;margin:auto;padding:18px}.card{background:#131a22;border:1px solid #263342;border-radius:16px;padding:18px;margin:14px 0}.row{display:grid;grid-template-columns:1fr 140px 130px;gap:10px;align-items:center}.tabs{display:flex;gap:8px}.tab,button,select{font:inherit;border-radius:10px;padding:11px;border:1px solid #3b4a5c}.tab,button{background:#1d2834;color:#fff;cursor:pointer}.tab.on{outline:2px solid #7db7ff}.global{display:grid;grid-template-columns:160px 1fr;gap:10px}.muted{color:#9dafc1;font-size:13px}.ok{color:#72db92}.warn{color:#ffd166}.bad{color:#ff7b7b}.paper{border-left:5px solid #7db7ff}.wall{border-left:5px solid #72db92}@media(max-width:650px){.row,.global{grid-template-columns:1fr}.wrap{padding:10px}} </style></head><body><div class="wrap">
<h1>Founder Trader Terminal</h1><div class="card wall"><b>🧪 PAPER CONTROL PLANE</b><div class="muted">Paper-only runtime controls. Baseline Real is not a target and has no route through this panel.</div></div>
<div class="card paper"><h2>🧪 Paper Lab Thresholds</h2><div class="tabs"><button class="tab on" id="globalTab">GLOBAL</button><button class="tab" id="indTab">INDEPENDENT</button></div>
<div id="globalPanel"><p><b>Global threshold</b></p><div class="global"><select id="globalScore"></select><button id="applyAll">APPLY TO ALL PAPER LABS</button></div><p class="muted">Global = supported Paper Labs only. Each runtime is read back before VERIFIED is shown.</p></div>
<div id="labs"></div><div id="msg" class="muted"></div></div>
</div><script>
const API='https://market-edge-siblings.darkbishop43.workers.dev',vals=[.50,.55,.60,.65,.70,.75,.80,.85,.90],names={adaptive_market_lab:'Adaptive Market Lab',payne_method:'Payne Paper'};
const opts=()=>vals.map(v=>'<option value="'+v+'">'+v.toFixed(2)+'</option>').join('');
globalScore.innerHTML=opts();globalScore.value='.65';
let mode='GLOBAL';
globalTab.onclick=()=>setMode('GLOBAL');indTab.onclick=()=>setMode('INDEPENDENT');
function setMode(m){mode=m;globalTab.classList.toggle('on',m==='GLOBAL');indTab.classList.toggle('on',m==='INDEPENDENT');globalPanel.style.display=m==='GLOBAL'?'block':'none';render();}
async function state(){const r=await fetch(API+'/api/paper-thresholds',{cache:'no-store'});if(!r.ok)throw Error('runtime read '+r.status);return r.json()}
async function apply(lab,v){setStatus(lab,'🟡 REQUESTED '+Number(v).toFixed(2)+' · VERIFYING','warn');const r=await fetch(API+'/api/paper-threshold',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({lab,threshold:Number(v)})});if(!r.ok){setStatus(lab,'🔴 NOT VERIFIED','bad');return}await verify(lab,Number(v))}
async function verify(lab,v){const s=await state(),x=s.thresholds?.[lab];if(x?.supported&&Number(x.activeThreshold)===v)setStatus(lab,'✅ ACTIVE '+v.toFixed(2),'ok');else setStatus(lab,'🔴 NOT VERIFIED','bad')}
function setStatus(lab,t,cl){const e=document.getElementById('status-'+lab);if(e){e.textContent=t;e.className=cl}}
async function render(){try{const s=await state();labs.innerHTML=Object.entries(s.thresholds||{}).filter(([k,v])=>v.supported).map(([lab,x])=>'<div class="card"><div class="row"><div><b>'+names[lab]+'</b><div class="muted">Runtime active: '+Number(x.activeThreshold).toFixed(2)+'</div></div><select id="sel-'+lab+'" '+(mode==='GLOBAL'?'disabled':'')+'>'+opts()+'</select><button id="btn-'+lab+'" '+(mode==='GLOBAL'?'disabled':'')+'>APPLY</button></div><p id="status-'+lab+'" class="ok">✅ ACTIVE '+Number(x.activeThreshold).toFixed(2)+'</p></div>').join('');for(const [lab,x] of Object.entries(s.thresholds||{})){const sel=document.getElementById('sel-'+lab),btn=document.getElementById('btn-'+lab);if(sel)sel.value=String(Number(x.activeThreshold));if(btn)btn.onclick=()=>apply(lab,sel.value)}}catch(e){msg.textContent='🔴 Runtime verification unavailable: '+e.message;msg.className='bad'}}
applyAll.onclick=async()=>{const v=Number(globalScore.value);msg.textContent='🟡 APPLYING TO ALLOWLISTED PAPER LABS · VERIFYING';msg.className='warn';const r=await fetch(API+'/api/paper-thresholds/apply-all',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({threshold:v})});if(!r.ok){msg.textContent='🔴 GLOBAL REQUEST FAILED';msg.className='bad';return}const s=await state(),rows=Object.entries(s.thresholds||{}).filter(([k,x])=>x.supported);const ok=rows.every(([k,x])=>Number(x.activeThreshold)===v);msg.textContent=ok?'✅ ALL SUPPORTED PAPER RUNTIMES VERIFIED '+v.toFixed(2):'🔴 PARTIAL / NOT VERIFIED';msg.className=ok?'ok':'bad';await render()};
render();setInterval(render,15000);
</script></body></html>
